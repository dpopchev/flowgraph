d and reason after created; task_held builds it with removed(task, held.reason, held.removed) from the Task in Backlog; task_row sets row.reason. src/flowgraph/item/__init__.py (46, 48): export DoneTask too. src/flowgraph/work_item/held_file.py (236 of 250, 236 after): import DoneTask in place of CompletedTaskFile; CompletedItemFile.tasks becomes list[DoneTask], its docstring reworded with the line count kept. src/flowgraph/work_item/model.py (221, 221 after): CompletedWorkItem.tasks is tuple[CompletedTask | RemovedTask, ...], its docstring says completed or removed. src/flowgraph/work_item/state.py (53): RemovedTask joins the removed arm of state_name and the empty arm of commit_sha. src/flowgraph/work_item/moves.py (154): the docstring of completed_work_item only. src/flowgraph/parser/refusals.py (137 today, 2 more): import TaskRemovedError and list it in REFUSED right after CompletedAlreadyError. Leave alone: work_item/primitives.py (item_held reads the tables through backlog_task and task_held, which take the new one), WorkItem, RemovedWorkItem, ItemFile and RemovedItemFile (their Tasks stay in Backlog), work_item/tasks.py and task_commands.py (next Task), every module of status/. Tests red first, removed and removed_among added first as typed stubs that raise NotImplementedError. New tests/task/test_task_remove.py shaped as tests/task/test_task_block.py: removed from Backlog holds the time to the second, the reason and the check; from a started and from a blocked Task it equals the one from Backlog; a blank reason is reason is empty; each refusal above by its whole line; task_state_name; row_of. In tests/task/list/test_task_moves.py: removed_among; all_completed over a completed and a removed Task returns both; over a removed one and one in Backlog it names the one in Backlog alone. In tests/work_item/test_work_item_file.py: the two parameters of states gain a started item holding a removed Task and a completed one holding a completed and a removed Task; the keys of the removed table in order; a completed file that holds a table in Backlog is still refused naming the file. In tests/work_item/test_work_item_moves.py: a work item whose Tasks are completed or removed completes holding both. The xfail marks of tests/functional/test_remove_task.py stay."
