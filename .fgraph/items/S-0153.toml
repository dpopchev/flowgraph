title = "Add uncommitted_files to the git work tree: the files changed in it and not committed, as paths from its top"
description = "src/flowgraph/development/commit.py (180 lines, about 190 after): WorkTree gains the field uncommitted_files: Callable[[], list[str]] = _lists_no_change, right after changed_files; _lists_no_change() -> list[str], beside _knows_no_commit, the default of a work tree built without it, returns []; the docstring of WorkTree says in one sentence that uncommitted_files lists the files changed in the work tree and not committed, as paths from the top; open_git binds uncommitted_files=partial(uncommitted_git.uncommitted_files, top), the module imported beside git, pull_git and tag_git. Every WorkTree of src/ and tests/ is built with keywords (grep -rn 'WorkTree(' src tests); if one is built by position, stop and say which. New module src/flowgraph/development/uncommitted_git.py (about 30 lines), an adapter module as src/flowgraph/development/sync_git.py (55 lines) is -- src/flowgraph/development/git.py, at 239 lines, has no room under the 250 of make lines. Docstring: the files the next commit of a work tree can hold, read before it is made (S-0153). uncommitted_files(work_tree: Path) -> list[str], Adapter: two run_git of src/flowgraph/development/git_command.py in the work tree, diff --name-only -z HEAD (the tracked files changed since HEAD, staged or not; git reads a staged rename by its new path, as git show reads it in changed_files of git.py) and ls-files --others --exclude-standard --full-name -z (the files git neither tracks nor ignores, from the top); each split on NUL, empty parts dropped; the two returned together, sorted, each once. It raises GitError naming the command when git refuses, as diff HEAD in a repository with no commit. Probed on 2026-11-24 in a scratch repository: diff lists a changed file, a staged new file and a staged rename by its new path; ls-files lists untracked files from the top, leaves out what .gitignore names and lists a new file under .fgraph/. Red first: the field and its default whole, uncommitted_files as a typed stub raising NotImplementedError, the tests seen failing for their own reason, then the body. New tests/development/commit/test_uncommitted_files.py (about 100 lines), edge as its pytestmark, one assert each, through open_git as tests/development/commit/test_changed_files.py (100 lines) does: copy its IDENTITY, git, commit, environment and work_tree; a fixture checkout on main with one commit holding README and a .gitignore naming ignored.txt. One test each: a clean work tree lists []; README changed and not staged lists ['README']; a new file staged lists it; a new file not staged lists it; ignored.txt written lists []; src/pkg/module.py written, asked from work_tree(checkout, 'src'), lists ['src/pkg/module.py']; README removed lists ['README']; git mv README NOTES lists ['NOTES']; a file staged and changed again is listed once; b.txt and a.txt written list ['a.txt', 'b.txt']; a file whose name holds a space and an accented letter, as test_changed_files.py names one, is listed as it is named; a repository with no commit raises GitError matching 'git diff'. Existing tests: none changes; if one fails, stop and say which. Out of bounds: src/flowgraph/development/git.py, sync_git.py, every other file of src/ and of tests/, the docs."
