description = "FIRST PASS, written on 2026-11-25 before Phases 2 and 3 were completed: the coordinator reviews this Task before its Feature starts (Q-0005, its decision of 2026-11-25). If no later line of Q-0005 says its Tasks were reviewed, stop and say so. One file: docs/domain-model.md, the section the first Task made (if grep -n '^## Read index' docs/domain-model.md finds nothing, stop and say so), this part after ### Reads measured; plain ASCII; no change under src/ or tests/, README.md, pyproject.toml or uv.lock. The probes are throwaways under local/scratch/a1/, run with uv run python on the standard library alone, on the two copies the first Task made, never on .fgraph/ of the repository. The cost: the sha256 of the bytes of every file against os.stat of each (st_size and st_mtime_ns); seen on 2026-11-25: sha256 6.4 and 35.8 ms, stat 1.6 and 10.6 ms, for 313 and 1,768 files -- confirm or write what differs, beside the parse times of the first part. What a stat would miss, each probed and written with what it printed: a file rewritten with other bytes of the same size and its mtime put back by os.utime (as cp -p, touch -r and rsync -t leave it); two writes of the same size within one tick of the mtime of the file system the record is on (stat -f -c %T . names it; say its granularity, probed by two writes in a loop); the mtime git checkout, git merge, git stash pop and git worktree add leave on a file they write, in a throwaway repository under local/scratch/a1/git whose commits take their identity from GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL, GIT_COMMITTER_NAME and GIT_COMMITTER_EMAIL in the environment of the run, never git config. The rows: a row per path of the record (path TEXT PRIMARY KEY, sha256, data), its data served only when the sha256 of the bytes read now is its own, so a row is true of the bytes it was hashed from, whoever wrote it; a file deleted, whose row is left, and the time to remove the rows of the files gone when the index is opened (seen in the draft: an open of an index of 313 rows, WAL set, 3.6 ms with none to remove and 8.7 ms with one); a file whose parse raises (no TOML), whose row is never written, so the refusal of fgraph stays word for word. The verdict, weighed on those times: the hash at every read, a stat alone, or a stat then the hash. Out of bounds: every file under src/ and tests/, README.md, the record of the repository (.fgraph/), pyproject.toml, uv.lock."
