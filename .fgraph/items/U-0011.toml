description = "New file only (about 90 lines), no source change. Today (2026-11-24, a scratch record with S-0001) fgraph note S-0001 prints, after the usage lines, `fgraph note: error: one of the arguments --finding --decision --deviation --progress is required`; fgraph note S-0001 --finding a --decision b prints `fgraph note: error: argument --decision: not allowed with argument --finding`; --finding a --deviation b prints `argument --deviation: not allowed with argument --finding`; --decision a --deviation b prints `argument --deviation: not allowed with argument --decision`; all exit 2. They are the argparse group kinds of note_command in src/flowgraph/parser/knowledge.py (mutually exclusive, required, of four kinds since S-0143 added --progress, so the item's `naming the three` is four today), and no test states them: tests/functional/test_note_progress.py asserts only the fragment `not allowed with argument` for --progress with --finding and tests/functional/test_verify_kinds.py does the same for verify. Copy from tests/functional/test_verify_kinds.py the way an argparse refusal is read: run() of src/flowgraph/cli.py raises SystemExit(2) and the line is on stderr, read with capsys (pytest.raises(SystemExit) as exited; capsys.readouterr().err.splitlines()[-1]). Build on tests/functional/test_note_progress.py: NOW, ADD_STORY, Outcome, fgraph(argv, cwd) with open_store=open_files, open_git=lambda _: None, now=lambda: NOW (its try/except of SystemExit is not wanted here: write fgraph without it, as test_verify_kinds does). functional is the pytestmark, one assert per test. Tests: (a) test_note_without_a_kind_exits_with_two_naming_the_four: argv [\"note\", \"S-0001\"]; the pair (exited.value.code, last line) == (2, \"fgraph note: error: one of the arguments --finding --decision --deviation --progress is required\"). (b) test_note_with_two_kinds_exits_with_two_naming_the_second_and_the_first, parametrized with ids finding-decision, finding-deviation, decision-deviation: argv [\"note\", \"S-0001\", \"--finding\", \"a\", \"--decision\", \"b\"], [... \"--finding\", \"a\", \"--deviation\", \"b\"], [... \"--decision\", \"a\", \"--deviation\", \"b\"] and the lines `fgraph note: error: argument --decision: not allowed with argument --finding`, `argument --deviation: not allowed with argument --finding`, `argument --deviation: not allowed with argument --decision`, the same pair. (c) test_a_note_with_two_kinds_writes_nothing: the bytes of .fgraph/items/S-0001.toml before and after the refused finding-decision note are equal. The record: ADD_STORY run in tmp_path once before each test (a fixture). The tests state existing behavior, so seen failing in a scratch edit never committed: in note_command of src/flowgraph/parser/knowledge.py change the line kinds = note.add_mutually_exclusive_group(required=True) to kinds = note, run the file and see (a), (b) and (c) fail (the refusal is gone), then restore the line with git checkout of that file; the file git status shows at the end is the new test alone. Existing tests: none changes; if one fails, stop and say which. Out of bounds: every other file; the words of the refusal are not changed (the item's remark that two kinds name two of the four is answered by stating the line as it is, a change of it is a Task of its own)."
