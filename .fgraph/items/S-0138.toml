title = "Raise the items fgraph block takes from a Task and a Feature to a work item too"
description = "Filed on the word of the developer of 2026-11-23, from the frame drawn that day. Its Tasks are written when it is ordered. The words, noted on B-0025 too: blocked can be any work item, a Feature among them; I do not see how a Task can be blocked. Today fgraph block takes a Task or a Feature and refuses a work item, and the tables of docs/domain-model.md list the block of a work item among the moves. Open, for the developer: whether fgraph block stops taking a Task."
