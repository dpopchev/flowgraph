id = "U-0018"
state = "backlog"
title = "Cut the reads of the files of the work items the check of the relations makes at every command from one of the rows per Feature of the record, and one more per work item for its terms, to one of the rows"
description = "Found during T-0317 of S-0078 on 2026-11-22, under the burn of the Backlog; filed at the end of the queue and not burned. The check calls find_work_item_detail once per work item to get its about terms, since WorkItemRow carries none; the fake store of tests/functional/test_add_story.py had to be given a detail reader. Amended on 2026-11-25, on the word of the developer, file u18, after a profile of fgraph status on the record of this repository that day (265 item files, 29 Features, two test suites running beside it): 34.5 s, 32.9 of them in check_relations, 28.5 in _feature_parts of src/flowgraph/graph/view.py, which reads the rows of every work item once per Feature through rows_under -- 19,154 parses of an item file in one command -- and about 2 in the read this item named first. Put first of Phase 2 by the decision of that day (F-0026)."
complexity = "low"
created = 2026-11-22 19:42:38+00:00

[criterion]
given = "a record of many work items under many Features"
when = "any fgraph command runs"
then = "the check of the relations reads the rows of the work items as often whatever the count of the Features, and the terms an item is about from those rows, and make check passes"

[[knowledge]]
kind = "finding"
text = "Seen by the coordinator on 2026-11-25 under the /goal of Phase 1, on this record of about 170 items: a write of fgraph takes 10 to 30 seconds, fgraph status --format json about 29 seconds for 384 KB, and fgraph about of a mistyped id about 20 seconds. Not measured where the time goes; U-0018 names one cause, the read of every work item file at the check of the relations."
noted = 2026-11-25 03:43:54+00:00
