id = "S-0117"
state = "backlog"
title = "Raise the scopes of the Backlog fgraph words a /goal line for from none to every one a developer names"
description = "Filed on the plan the developer agreed on 2026-11-23. Its Tasks are written when it is ordered. The words of the developer: agent-driven development always starts with a /goal initiated by the developer; the goal follows the best practices of Claude and is suggested by fgraph given the scope of the Backlog that will be implemented. fgraph words the line and never sets it. Open: the best practices are read from the documentation of Claude Code for /goal when the Story is ordered; the scopes beside a Feature -- a work item, the top of the queue -- and what a record driven by a developer answers."
parent = "F-0016"
created = 2026-11-23 07:02:21+00:00
depends_on = [
    "S-0115",
]

[criterion]
given = "a record whose development is driven by an agent, with a Feature of three work items in Backlog"
when = "the goal of the Feature is asked of fgraph"
then = "it prints one /goal line for the developer to paste: the scope by its ids, the end state as a command of fgraph that shows it, the coordinator that hands each whole work item to a subagent up to development.parallel, and the halts"

[[knowledge]]
kind = "decision"
text = "The developer ruled on 2026-11-23, on the draft of the line shown that day: the /goal line fgraph words carries a time bound. The documentation of Claude Code for /goal, read that day (code.claude.com/docs/en/goal), asks a condition for one measurable end state, a stated check, the constraints that matter and a bound, a turn or time clause in the condition; the condition holds at most 4,000 characters and is judged by a small model from the conversation alone. Open, for the plan: where the number of hours comes from -- an option of the command, a default -- the reading of the coordinator being an option --hours with the 8 hours a burn of board 1 used as its default."
noted = 2026-11-23 10:09:54+00:00
