text = "Ruled by the coordinator on 2026-11-24 while writing its Tasks, under the /goal of Phase 1 the developer set that day, which has the coordinator write the Tasks before a Feature starts; the developer was not asked and reviews them at the close: (1) Two Tasks, one per Story (S-0088: three files; S-0093: two files), each naming per file the behaviors to take out, how, and the tests the probe saw fail; not five Tasks, since the procedure and the output are the same and a Task per file adds briefs, not proof. (2) Each mutation is an Edit in the worktree, run once against its test file and put back with git restore; the check holds git diff --quiet HEAD -- src and git diff --quiet main...HEAD -- src, so no mutation is left or committed. (3) What is committed when every test already fails: one finding of U-0021 per test file, written by fgraph note --finding with --governs on that file, starting red proof of U-0021 and naming each behavior, its mutation and the test that failed. Honest because the output of such a Task is knowledge, not code, and a finding is the home of what the project learned; the check observes it with fgraph about <file> | grep. Governing the test file makes the proof show under Governed by in fgraph about and in the brief of any later Task naming the file. A progress line was not chosen (no knowledge line, nothing about the file); a docstring sentence in each test file was not chosen (a claim in code that drifts when the code moves, and a second home for the fact). (4) Where the probe found a mutation with no failing test, the Task names the rewrite: the move removed in MOVED of tests/task/test_task_check.py, and a work item whose Task is removed in the round trip of tests/work_item/test_work_item_task_check.py; both tests name every move or any state, so the removed case is what their names state and they never checked -- although make check already fails for both mutations through tests/task/test_task_remove.py and tests/work_item/test_work_item_file.py; the smaller reading (no rewrite, the findings cite those tests) is the alternative to rule on. (5) The behavior a no refused adds no Bug is held twice (refusal before the add, and restore_files on failure); each alone keeps it, so it is proven by taking both out together, and no test is added for either hold alone. (6) make check runs once at the end of each Task with every behavior back; per mutation the Task runs the one test file, so the named failing test is read fast; the criterion run (When: make check per behavior) stays the coordinator's at the closing. (7) test_verify_kinds.py is functional, not unit, but the work item names it, so its own behaviors (the parser group, the id words, the kinds, the show line) are taken out too."
