[criterion]
given = "a record in a git repository with a completed Story about a term, whose commit changed a file a knowledge line governs"
when = "fgraph about is run with --format json on the Story, on the term and on the file"
then = "each prints one JSON document that holds the links the text lists, by relation, the same bytes on two runs"

