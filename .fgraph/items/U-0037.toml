title = "Add StartedTasks and started_tasks to src/flowgraph/task/list.py: the Tasks of a started or blocked work item, at least one and at most one started"
description = "FIRST PASS, written on 2026-11-25 before Phase 2 was completed: the coordinator reviews this Task before its Feature starts (U-0037, its decision of 2026-11-25). If no later line of U-0037 says its Tasks were reviewed, stop and say so. Two cases of the criterion, a started work item with no Task and one with two started Tasks, chosen as one type built by one smart constructor. A NewType, not tuple[TaskState, *tuple[TaskState, ...]]: that non-empty tuple type is refused by pyright for () but cannot say at most one started. Pyright refuses a plain tuple given to StartedWorkItem or BlockedWorkItem, and started_tasks refuses at runtime where the state is built. Five source files and two test files, each place found by grep. (1) src/flowgraph/task/list.py (122 lines on 2026-11-25, about 142 after): after at_most_one_started, the comment line '# The Tasks of a started or blocked work item: at least one, at most one of them started; built by started_tasks alone.' and StartedTasks = NewType('StartedTasks', tuple[TaskState, ...]); started_tasks(tasks: tuple[TaskState, ...], named: str) -> StartedTasks, docstring 'The Tasks of the started work item of that name. Raises NoTaskError when there is none and TaskInProgressError naming the started Tasks when there are several.': NoTaskError(f'{named} has no Task to start with') for (), else StartedTasks(at_most_one_started(tasks)), so both refusals keep the words they have today; NoTaskError imported from flowgraph.task.model with the others. (2) src/flowgraph/task/__init__.py (90 lines): import and list StartedTasks and started_tasks in their sorted places. (3) src/flowgraph/work_item/model.py (about 249 lines, the same after): StartedTasks added to the import from flowgraph.task, on its one line (under 100 characters); tasks: tuple[TaskState, ...] becomes tasks: StartedTasks on StartedWorkItem and BlockedWorkItem. (4) src/flowgraph/work_item/moves.py: in started_work_item, the case WorkItem(tasks=()) that raises NoTaskError goes, and the case WorkItem() builds StartedWorkItem with started_tasks(item.tasks, work_item_id_text(item.id)) where it gives item.tasks today, so the refusal is raised by started_tasks with its words, CH-0001 has no Task to start with. (5) src/flowgraph/work_item/primitives.py: in item_held, tasks = at_most_one_started(tuple(task_held(task) for task in held.tasks)) becomes tasks = started_tasks(tuple(task_held(task) for task in held.tasks), work_item_id_text(item_id)); the import of at_most_one_started becomes started_tasks. A started file with no Task raised NoTaskError from started_work_item right after; it now raises the same one first, with the same words. block.py, handed.py, amend.py and the replace(item, tasks=...) of src/flowgraph/work_item/tasks.py are not edited: they pass item.tasks on, or go through dataclasses.replace, which pyright does not check (probed on 2026-11-25). Their moves refuse a second started Task themselves (_none_started_beside of task/list.py). Red first: StartedTasks whole and started_tasks as a typed stub raising NotImplementedError; new tests/task/list/test_started_tasks.py (about 45 lines), pytestmark = pytest.mark.model as tests/task/list/test_task_moves.py, one assert each, its Tasks built as tests/task/list/test_one_started.py builds them (make_task, started, blocked): started_tasks((), 'CH-0001') raises NoTaskError matching ^CH-0001 has no Task to start with$; two started Tasks T-0001 and T-0002 raise TaskInProgressError matching ^more than one Task is started: T-0001, T-0002$; one started beside one in Backlog gives them as they are; a blocked Task beside a started one gives them as they are. See them fail on NotImplementedError, then the body. Existing tests that change: tests/work_item/test_work_item_moves.py, test_a_work_item_with_a_task_starts_on_the_second_with_its_task_in_backlog: tasks=(TASK,) becomes tasks=started_tasks((TASK,), 'CH-0001'), started_tasks imported from flowgraph.task; test_a_work_item_without_a_task_is_refused_by_its_id passes unchanged. tests/task/list/test_one_started.py, among them test_a_file_holding_two_started_tasks_is_refused_naming_them, passes unchanged. If pyright names another test that builds a started or blocked work item from a tuple, give it started_tasks and say which; if a test fails, stop and say which. Out of bounds: src/flowgraph/work_item/tasks.py, block.py, handed.py, amend.py, removal.py, CompletedWorkItem and RemovedWorkItem (their Tasks are other types), every other file of src/ and tests/, the docs; run uv run ruff format on the changed files."
check = "uv run pytest tests/task tests/work_item tests/feature/test_feature_start.py tests/functional/test_start_story.py tests/functional/test_start_no_id.py -q -p no:cacheprovider && grep -q '^def started_tasks' src/flowgraph/task/list.py && grep -q 'tasks: StartedTasks' src/flowgraph/work_item/model.py && uv run python -c \"from pathlib import Path; import tomli_w; from flowgraph.record.store import KINDS; from flowgraph.work_item import read_work_item, parse_work_item_id; from flowgraph.work_item.primitives import item_primitives; r = Path('.fgraph'); print(sum(tomli_w.dumps(item_primitives(read_work_item(r, parse_work_item_id(k, p.stem), KINDS))) != p.read_text(encoding='utf-8') for k in KINDS for p in (r / 'items').glob(k.prefix + '-*.toml')))\" | grep -qx 0 && make lines && uv run pyright"
expected_output = "created: StartedTasks, a NewType over tuple[TaskState, ...], and started_tasks(tasks, named) of src/flowgraph/task/list.py, which raises NoTaskError when there is no Task and TaskInProgressError when two are started; changed: the field tasks of StartedWorkItem and BlockedWorkItem is a StartedTasks, built by started_work_item and item_held through started_tasks; created: tests/task/list/test_started_tasks.py states it. Every command prints what it printed before"
