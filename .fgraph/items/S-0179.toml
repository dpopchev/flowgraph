[[knowledge]]
kind = "finding"
text = "Open at the review of its first-pass Tasks, from their draft of 2026-11-25: (1) Where the smoke run lives: drafted as a recipe of mk/wheel.mk, the smaller, beside wheel, install and dist, none of which has a test (grep of tests/ for Makefile or mk/ finds only tests/record/config/test_config.py, which tests make_config); so S-0179 has no functional test red under a strict xfail, its check being the run of the target and its failing run under SMOKE_FGRAPH=false. The alternative: a pytest module under tests/ marked integration, reusing the helpers of tests/functional/test_mcp_status.py with one assert per test, which the target runs given the path of the installed fgraph; but make test collects every test (addopts in pyproject.toml holds no -m filter, and no test is marked integration today), so it needs -m 'not integration' in the pytest call of mk/python.mk or a skip without the path. (2) Not of make check nor make deliverables: it needs a warm cache of uv or the network, and takes about 7 s. The alternative: dist depends on it (dist: tag-version check smoke, with S-0180), so it runs before every release. (3) The install: uv venv then uv pip install --python <venv> of the wheel (drafted) versus uv tool install with UV_TOOL_DIR and UV_TOOL_BIN_DIR of its own, so the installed fgraph of the developer is not replaced; both passed offline on a warm cache in about 0.5 s on 2026-11-25, uv tool install warning that its bin directory is not on PATH. pipx is not installed here (command -v pipx prints nothing): the Tasks need none; whether pipx runs beside uv, as the first pass of the Feature names, is for the developer. (4) The install resolves the newest pydantic and tomli-w pyproject.toml allows, not the pins of uv.lock (it resolved pydantic 2.14.4, the pin of today, from the cache). Pinning them is one more option of the install: --constraint of the output of uv export --no-dev --no-emit-project --frozen. (5) prints what it prints from the source is read as: status and the exchange of fgraph mcp of the installed wheel diffed against uv run of the source on the same record; init and add story write the record, so they are checked by exit 0 and the line added S-0001 alone, not diffed. (6) The smoke run lives in local/state/smoke/ (a nested git repository there, local/ being ignored, removed by make clean through clean-state and by the target at its start); the alternative is mktemp -d outside the checkout. (7) Expected of Phases 2 and 3: the words of fgraph add story and fgraph status may change (F-0030 to F-0033 rework the moves and the states); the diff to the source holds through them, the grep -qx 'added S-0001' does not, so the first Task says to match the source. U-0018 changes how the files of the record are read, nothing the smoke run names."
noted = 2026-11-25 10:13:07+00:00
