title = "Add the target smoke to mk/wheel.mk: the built wheel installed alone into a venv of its own runs fgraph init, add story and status there"
description = "FIRST PASS, written on 2026-11-25 before Phases 2 and 3 were completed: the coordinator reviews this Task before its Feature starts (S-0179, its decision of 2026-11-25). If no later line of S-0179 says its Tasks were reviewed, stop and say so. S-0179 waits for S-0160: if uv run fgraph show S-0160 does not list it completed, stop and say so. One file: mk/wheel.mk (37 lines on 2026-11-25, about 62 after). If grep -n '^install:' mk/wheel.mk finds nothing, stop and say so. Follow the style of the targets wheel and install there: each recipe line starts with @, the closing log_done has no @, a literal comma in a message is $(comma); bash, no heredoc. Between the target install and the target dist, add: (1) a comment of four lines -- the smoke run: the built wheel installed alone into a venv of its own under $(SMOKE) runs fgraph init, add story and status on a record of its own, status compared with what the source prints; not of check nor of deliverables: the install takes pydantic and tomli-w from the cache of uv or from the index. (2) SMOKE := $(STATE)/smoke; SMOKE_FGRAPH := $(abspath $(SMOKE))/venv/bin/fgraph (a command line override, SMOKE_FGRAPH=false, proves the loud failure); SMOKE_SOURCE := $(RUN) --project $(CURDIR) fgraph. RUN and PYTHON_VERSION are of mk/python.mk, read before mk/wheel.mk; STATE is of mk/environment.mk. (3) Target-specific exports, one line each, so no git configuration of the developer is read and the commits of the record have an identity: smoke: export GIT_CONFIG_GLOBAL := /dev/null, then GIT_CONFIG_NOSYSTEM := 1, GIT_AUTHOR_NAME := smoke, GIT_AUTHOR_EMAIL := smoke@example.invalid, GIT_COMMITTER_NAME := smoke, GIT_COMMITTER_EMAIL := smoke@example.invalid. (4) .PHONY: smoke and smoke: wheel ## Install the built wheel alone and run fgraph there, with one step a recipe line, so make names the line of the step that fails: rm -rf $(SMOKE) && mkdir -p $(SMOKE)/project; $(UV) venv --quiet --no-python-downloads --python $(PYTHON_VERSION) $(SMOKE)/venv (a missing Python fails, never downloaded); $(UV) pip install --quiet --python $(SMOKE)/venv $$(ls $(DIST)/*.whl); cd $(SMOKE)/project && git init --quiet --initial-branch main && $(SMOKE_FGRAPH) init >/dev/null; cd $(SMOKE)/project && $(SMOKE_FGRAPH) add story 'Raise the smoke runs of fgraph from 0 to 1' --given 'the built wheel' --when 'it is installed alone' --then 'it runs' | grep -qx 'added S-0001' (continued on a second line with a backslash); cd $(SMOKE)/project && $(SMOKE_FGRAPH) status > ../status.wheel && $(SMOKE_SOURCE) status > ../status.source; diff $(SMOKE)/status.wheel $(SMOKE)/status.source && grep -q 'S-0001' $(SMOKE)/status.wheel; then $(call log_done,smoke run passed: $$(ls $(DIST)/*.whl) installed alone in $(SMOKE)/venv). If fgraph add story prints another line than added S-0001 when this Task runs (Phases 2 and 3 may reword it), match the line uv run fgraph add story prints from the source and say so. Probed on 2026-11-25 in a copy of main made with git archive HEAD under /home/dimitar/.cache/fgraph-tmp/draft4/repo, never in the repository: these lines, with the exchange of the next Task, passed in about 7 s on a warm cache of uv; uv venv then uv pip install --offline of the wheel took 0.6 s and resolved annotated-types, pydantic 2.14.4, pydantic-core 2.50.5, tomli-w 1.2.0, typing-extensions and typing-inspection from the cache; uv build --wheel needs no network (the build backend of uv, 0.3 s); make smoke SMOKE_FGRAPH=false exited 2 with make: *** [mk/wheel.mk:<line>: smoke] Error 1. The recipe passes no --offline: uv takes the cache and goes to the index when it misses. Red first: before the change, make smoke exits 2 with No rule to make target 'smoke'; see it. Out of bounds: every file but mk/wheel.mk; the targets wheel, install and dist, CHECKS and DELIVERABLES unchanged; the docs (a later Task of S-0179)."
check = "make smoke && ! make smoke SMOKE_FGRAPH=false 2>/dev/null && grep -q '^smoke: wheel' mk/wheel.mk && grep -q 'S-0001' local/state/smoke/status.wheel"
