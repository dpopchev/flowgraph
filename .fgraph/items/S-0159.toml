[[knowledge]]
kind = "decision"
text = "Ruled by the coordinator on 2026-11-25 while writing its Tasks, under the /goal of Phase 1 the developer set on 2026-11-24, which has the coordinator write the Tasks before a Feature starts; the developer was not asked and reviews them at the close: (1) Six move tools, one per command: start, hand, block, unblock, note and complete; the start and the block of a Task are the tools start and block given a Task id, so no tool of its own. (2) Inputs: start (directory, id, agent optional), hand (directory, id, agent), block (directory, id, reason, waiting_on), unblock (directory, id), note (directory, id, kind in finding|decision|deviation|progress, text), complete (directory, id, commit optional); left out: --slug, --about, --governs, --supersedes, --standing, --open, and --decision/--answer of complete. (3) Every text option is passed as --option=value, since argparse refuses a value that starts with a dash otherwise (probed: note --finding --x exits 2). (4) A refusal is the tool error of S-0157, nothing written: fgraph refuses before it saves, the tool only relays the exit status and the last line. (5) The server keeps os.dup(0) and os.dup(1) for the protocol and points fd 0 at /dev/null and fd 1 at stderr before it serves, so run_gate (check of a Task, gate of a landing), which captures nothing, writes on stderr and reads nothing; a Task of its own, red on the functional test whose check prints. (6) Where a call is written is the directory it names, as the command line run there: the functional test calls start on main and the Task moves in the worktree, and checks the commits on main and on the branch. (7) The lock: no change; each write in a call takes it through lock_record of run(); a guard test writes on main by the command line while the server is open."
