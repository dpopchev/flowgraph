description = "FIRST PASS, written on 2026-11-25 before Phases 2 and 3 were completed: the coordinator reviews this Task before its Feature starts (S-0179, its decision of 2026-11-25). If no later line of S-0179 says its Tasks were reviewed, stop and say so. One file: mk/wheel.mk (about 62 lines before, about 70 after). If grep -n '^smoke:' mk/wheel.mk finds nothing, stop and say so. The exchange is that of tests/functional/test_mcp_status.py (S-0157) without its server/discover probe: initialize (id 0, protocolVersion 2025-11-25, capabilities {}, clientInfo name smoke version 1), notifications/initialized (no reply), tools/list (id 1), tools/call of status with arguments directory, the project of the smoke run (id 2); read that file first and if its messages changed, follow them and say so. Add, beside SMOKE_SOURCE, SMOKE_MCP (with =, read at recipe time) = printf '%s\\n' followed by the four messages, each one compact JSON in single quotes on a continued line, the fourth splicing the directory in by closing the quotes: '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"status\",\"arguments\":{\"directory\":\"'\"$$PWD\"'\"}}}'. Two recipe lines after the diff of the status: cd $(SMOKE)/project && $(SMOKE_MCP) | $(SMOKE_FGRAPH) mcp > ../mcp.wheel && $(SMOKE_MCP) | $(SMOKE_SOURCE) mcp > ../mcp.source; then diff $(SMOKE)/mcp.wheel $(SMOKE)/mcp.source && grep -q 'S-0001' $(SMOKE)/mcp.wheel (only the reply of the call holds S-0001; a diff of two empty files would pass, the grep does not). The help line becomes ## Install the built wheel alone and run fgraph and fgraph mcp there, and the comment above SMOKE says one exchange of fgraph mcp too. The replies are equal byte for byte: serverInfo.version is importlib.metadata.version of flowgraph in both (serve_stdio of src/flowgraph/mcp/stdio.py), the wheel and the editable install of .venv carrying the version of pyproject.toml; the diff covers every tool SERVED of src/flowgraph/mcp/stdio.py list