N; fgraph config set development.branch_max 2d == Outcome(0, 'set development.branch_max = \"2d\"\\n', \"\"); with branch_max = \"soon\" in the file, fgraph status exits 2 and its last error line ends with 'development.branch_max is \"soon\": it takes a whole number of days of 1 or more, as 1d'. One guard, no mark: under DEVELOPMENT_ON alone, PLAIN is a line of status at TWO_DAYS. See each marked test xfail and the guard pass before the commit; read the options of watch from tests/functional/test_watch.py. Out of bounds: every file under src/."
