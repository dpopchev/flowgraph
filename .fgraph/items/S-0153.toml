title = "Raise the files changed in the worktree of a started Task that fgraph names as outside its brief before the commit from none to every one"
description = "New on the plan agreed on 2026-11-24, read from the words Pre-Commit of the draft of F-0020; in board 1, board scope. Today the agent learns it at fgraph complete, after the commit. Its Tasks are written before its Feature starts."
