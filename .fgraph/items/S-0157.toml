atever the method; then by match on the method: initialize gives {protocolVersion: params protocolVersion when in VERSIONS else VERSIONS[0], capabilities: {tools: {}}, serverInfo: {name: NAME, version}}; ping gives {}; tools/list gives {tools: [tool_listed(tool) for tool in tools]}; tools/call takes params name and arguments ({} when absent): a name no tool holds gives INVALID_PARAMS Unknown tool: <name>; command_of raising ToolArgumentsError gives the result refused_result(str(error)), nothing run; else run_command(command), the try holding that one call, and except Exception as error gives INTERNAL_ERROR '<type name>: <error>' -- the one boundary of a call, so the server answers and goes on; else the result ran_result(ran); case _ gives METHOD_NOT_FOUND Method not found: <method>. Each reply is json.dumps of the message, so it is one line, a newline of a text escaped. Red first: the constants and Request whole, replied as a typed stub raising NotImplementedError, the tests seen failing for their own reason, then the body. New tests/mcp/protocol/test_replied.py (about 170 lines), view as its pytestmark, one assert each: answer(message) = json.loads(replied(json.dumps(message), (STATUS,), run_command, 0.19.0)) -- the tools given as (STATUS,) of flowgraph.mcp.reads, never READ_TOOLS, which S-0158 grows -- where run_command is the append of a recording list that returns Ran(0, '{}' and a newline, '') unless a test gives another; never as tests/term/test_term_item.py writes it, for a run that must not happen. Tests: initialize with id 0 and protocolVersion 2025-11-25 answers protocolVersion 2025-11-25; its reply holds the id 0; asked 2025-06-18 and 2024-11-05 answer the same (parametrized); asked 1999-01-01 and not asked answer 2025-11-25 (parametrized); capabilities is {tools: {}}; serverInfo is {name: fgraph, version: 0.19.0}; notifications/initialized and an unknown method with no id give None (parametrized, replied itself); ping gives result {}; tools/list gives the names [status]; tools/call of status with {directory: /src/project} gives the result {content: [{type: text, text: {} and a newline}]}; the command run is [Command(Path(/src/project), [status, --format, json])]; a run giving Ran(2, '', fgraph: error: no record and a newline) gives isError True; tools/call of nope gives the error {code: -32602, message: Unknown tool: nope} with run_command never; tools/call of status with {} gives the result {content: [{type: text, text: the arguments of status are refused: directory: Field required}], isError: True} with run_command never; a run_command raising RuntimeError(boom) gives the error {code: -32603, message: RuntimeError: boom} under the id of the request; server/discover with the id server-discover-probe-1 gives {jsonrpc: 2.0, id: server-discover-probe-1, error: {code: -32601, message: Method not found: server/discover}}; the line not json gives {code: -32700} with the id None; [1, 2], {jsonrpc: 1.0, id: 1, method: ping}, {jsonrpc: 2.0, id: true, method: ping} and {jsonrpc: 2.0, id: 1, method: ping, params: [1]} each give the code -32600 with the id None (parametrized); the reply of a call whose text holds a newline holds no newline character (replied itself). Existing tests: none changes; if one fails, stop and say which. Out of bounds: src/flowgraph/mcp/tools.py, reads.py and __init__.py, src/flowgraph/cli.py, src/flowgraph/parser/, tests/functional/test_mcp_status.py keeps its xfail marks, the docs."
