description = "A new module beside history_git.py: git.py is 239 lines against MAX_LINES 250 (mk/python.mk:32), so nothing is added there. Both adapters run git through run_git (src/flowgraph/development/git_command.py:17-29). first_parent_subjects(work_tree: Path, commit: str) -> list[tuple[str, str]] runs run_git(work_tree, \"log\", \"--first-parent\", \"--reverse\", \"--format=%H%x1f%s\", commit) and splits each line once on \\x1f; GitError for a sha git does not know. checked_out_at(work_tree: Path, commit: str) -> Iterator[Path], under @contextmanager: in tempfile.TemporaryDirectory(), path = Path(temporary) / \"before\"; run_git(work_tree, \"worktree\", \"add\", \"--quiet\", \"--detach\", str(path), commit); yield path; in finally run_git(work_tree, \"worktree\", \"remove\", \"--force\", str(path)). WorkTree of src/flowgraph/development/commit.py (50-79) gains first_parent_subjects: Callable[[str], list[tuple[str, str]]] = _lists_no_subject (a default returning []) and checked_out_at: Callable[[str], AbstractContextManager[Path]] = _checks_out_nothing (a default raising GitError(\"no work tree to check a commit out in\")); its docstring names both; open_git (93-131) binds both with partial(before_git.NAME, top); the defaults keep every existing fake of WorkTree working. Red first: tests/development/git/test_before_git.py, edge marker, copying git, environment and checkout from tests/development/git/test_git.py:23-50, one assert each: two commits a then b end the list with [(sha_a, \"a\"), (sha_b, \"b\")]; on a branch side holding x, with main given y and merged by git merge --no-ff -m \"merge main\" main, the subjects of side end [..., \"x\", \"merge main\"] and y is not among them; an unknown sha raises GitError matching ^git log; the path inside checked_out_at(top, f\"{sha_b}^\") holds a.txt (one test) and not b.txt (another); after the with, git worktree list --porcelain names one worktree; a body raising ValueError leaves one worktree too; an uncommitted file of the checkout stays in git status --porcelain. Any other test that fails: stop and say which. Out of bounds: src/flowgraph/development/git.py, task_run.py, task_check.py, src/flowgraph/parser/, src/flowgraph/task/, the functional tests, the docs."
