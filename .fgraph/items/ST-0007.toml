id = "ST-0007"
state = "backlog"
title = "Raise the kinds of work item fgraph takes from Backlog to Completed from 3 to 4: Spike"
description = "Feature: a project tracks every kind of its work with fgraph; its criterion 4: a developer adds a Spike with its hypothesis, a yes/no question, and completes it with the decision that answers it. Ordered after ST-0006. Its Tasks are written when it is ordered."
created = 2026-11-21 07:18:43+00:00

[criterion]
given = "a started Spike whose Task is completed"
when = "the Spike is completed with a commit and its decision"
then = "fgraph show prints the decision under its hypothesis"

[[tasks]]
id = "T-0089"
state = "backlog"
title = "Add tests/functional/test_complete_spike.py, failing on the criterion of ST-0007"
description = "Run through run() of src/flowgraph/cli.py on a record in tmp_path, through the file adapters, as tests/functional/test_complete_bug.py does. Seen red, then marked a strict xfail naming ST-0007 until the Task that turns it green removes the mark. The description leaves no question open. The agent's readings, each a routine call: (1) the command is fgraph add spike TITLE --hypothesis TEXT [--description TEXT]; its ids are SP-0001, counted on their own. (2) A Spike takes Tasks and every move a Story takes; it is completed with fgraph complete ID --commit SHA --decision TEXT. The decision is required for a Spike and not blank, and refused with exit 2 on a Task and on every other kind; fgraph land takes --decision the same way. (3) fgraph show prints '  hypothesis   <text>' and, once the Spike is completed, '  decision     <text>' under it. (4) The decision answers the hypothesis, so it is kept with it: the criterion table of a completed Spike holds hypothesis and decision; a file that holds a decision before the Spike is completed is refused. (5) The hypothesis must say something; that it reads as a yes/no question is not checked, an open question of docs/domain-model.md. (6) fgraph amend rewrites it with --hypothesis."
expected_output = "created: tests/functional/test_complete_spike.py states that a started Spike whose Task is completed, completed with a commit and its decision, is shown by fgraph show with the decision under its hypothesis"
