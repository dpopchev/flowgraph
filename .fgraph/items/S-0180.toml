[[tasks]]
id = "T-0792"
state = "backlog"
title = "Add the target tag-version to mk/wheel.mk and make dist run it first: a version of pyproject.toml other than that of the last v* tag is refused in one line naming both"
description = "FIRST PASS, written on 2026-11-25 before Phases 2 and 3 were completed: the coordinator reviews this Task before its Feature starts (S-0180, its decision of 2026-11-25). If no later line of S-0180 says its Tasks were reviewed, stop and say so. One file: mk/wheel.mk (about 70 lines once S-0179 has landed, about 85 after; 37 lines on 2026-11-25). If grep -n '^dist: check' mk/wheel.mk finds nothing, stop and say so. fgraph release serves any repository and reads no pyproject.toml (src/flowgraph/development/release.py and version.py), so the check is of mk/wheel.mk and src/ is not touched. Before the target dist, add: a comment of two lines -- a release builds the version of its tag: the version of pyproject.toml must be that of the last v* tag reachable from HEAD, RELEASE_TAG naming another; RELEASE_TAG ?= (empty); .PHONY: tag-version; tag-version: ## Refuse a version of pyproject.toml other than that of the last v* tag; one recipe line, continued with backslashes: tag=\"$(RELEASE_TAG)\"; [ -n \"$$tag\" ] || tag=\"$$(git describe --tags --abbrev=0 --match 'v*')\"; version=\"$$($(UV) version --short)\"; if [ \"$$tag\" != \"v$$version\" ]; then printf 'make dist: refused -- pyproject.toml names %s, the last tag %s: bump the version of pyproject.toml to %s\\n' \"$$version\" \"$$tag\" \"$${tag#v}\" >&2; exit 1; fi; then $(call log_done,pyproject.toml names $$($(UV) version --short)$(comma) the version of its last v* tag). A repository with no v* tag fails on git describe, loud. Change dist: check | $(DIST) to dist: tag-version check | $(DIST): make runs the prerequisites in order (no -j in MAKEFLAGS of the Makefile), so the refusal comes before make check. Probed on 2026-11-25 in a copy of main made with git archive HEAD and tagged v0.19.0 under /home/dimitar/.cache/fgraph-tmp/draft4/repo: uv version --short printed 0.19.0 and wrote nothing (no .venv made, git status clean); with an empty commit tagged v0.20.0, make dist printed make dist: refused -- pyproject.toml names 0.19.0, the last tag v0.20.0: bump the version of pyproject.toml to 0.20.0 and exited 2 in 0.03 s, before make check; on main of the repository git describe --tags --abbrev=0 --match 'v*' prints v0.19.0 and uv version --short 0.19.0. If make tag-version is refused on main when this Task runs (a release of Phases 2 or 3 tagged without a bump), stop and say so: the bump is a release chore, not of this Task. Red first: before the change, make tag-version exits 2 with No rule to make target 'tag-version'; see it. Out of bounds: every file but mk/wheel.mk; pyproject.toml and its version; src/flowgraph/development/; the targets wheel, install and smoke; CHECKS and DELIVERABLES unchanged; the docs (the next Task)."
check = "make tag-version && ! make tag-version RELEASE_TAG=v0.0.0 2>/dev/null && make tag-version RELEASE_TAG=v0.0.0 2>&1 | grep -q 'refused -- pyproject.toml names .*, the last tag v0.0.0' && grep -q '^dist: tag-version check' mk/wheel.mk"
expected_output = "created: the target tag-version of mk/wheel.mk compares the version uv version --short reads from pyproject.toml with the last v* tag reachable from HEAD (RELEASE_TAG names another) and exits non-zero with the one line make dist: refused -- pyproject.toml names <version>, the last tag <tag>: bump the version of pyproject.toml to <tag without v> when they differ, else ends [DONE]; changed: dist depends on tag-version before check, so a mismatch is refused before make check runs"
created = 2026-11-25 10:22:37+00:00

