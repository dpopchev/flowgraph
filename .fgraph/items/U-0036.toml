tring 'The answer of a table written before it was taken is NO_REPLY.'; AnswerFile keeps answer: Literal['yes', 'no'] | None = None, the edge of a key that is absent. (4) src/flowgraph/work_item/primitives.py: in item_held, decision.answer is None (grep -n 'decision.answer' src/flowgraph/work_item/primitives.py) becomes isinstance(decision.answer, NoReply), NoReply imported from flowgraph.criterion; the rest of that branch stays (the Task of U-0037 reworks it). Existing tests that change: tests/work_item/test_work_item_answer.py, test_a_hypothesis_completed_with_a_decision_and_no_answer_is_refused_naming_it: Decision('too big', None) becomes Decision('too big', NO_REPLY), NO_REPLY imported from flowgraph.criterion; its name stays. test_a_file_holding_a_decision_and_no_answer_is_read_as_before builds Answer(question, decision) with the default and passes unchanged: it is the proof of the file of a Spike completed before the answer was taken, which this record does not hold (its 2 completed Spike files with a decision both hold an answer). If another test fails or pyright names another file, stop and say which. Red first: the check fails before the change on its grep of Replied; run the named tests and the byte probe before and see them pass (the uv run python -c part of the check: 0 of 255 work item files differ on 2026-11-25). Out of bounds: src/flowgraph/parser/stated.py, src/flowgraph/knowledge/, src/flowgraph/status/, src/flowgraph/brief/ (they read the answer as the text of the detail), src/flowgraph/work_item/moves.py, the work item fields of U-0035, the docs; run uv run ruff format on the changed files."
