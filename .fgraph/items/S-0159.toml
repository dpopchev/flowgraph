description = "Read the decision of Q-0002 first (uv run fgraph show q2); if it answers no or names another design than this one -- a server written by hand on the standard library and pydantic, one server for main and every worktree, each call a run of fgraph in process in the directory it names -- stop and say so. With the development on, fgraph complete of a Task refuses a commit that changed a file its brief does not name (S-0142): the Tasks of the fixture name theirs. One new file, no source change: tests/functional/test_mcp_moves.py (about 220 lines), functional as its pytestmark, one assert per test. The repository: copy IDENTITY, git and the shape of the fixture repository of tests/functional/test_start_agent.py (a git repository on main whose first commit holds .fgraph/config.toml with [development] enabled = true), built once by a module fixture on tmp_path_factory.mktemp('project'), with ENVIRONMENT = {**os.environ, **IDENTITY, GIT_CONFIG_GLOBAL: an empty file beside it, GIT_CONFIG_NOSYSTEM: 1} as the module fixture processes of tests/functional/test_writes_at_one_time.py builds it, given to every git and every process; then, through cli(project, *argv) -- [sys.executable, -m, flowgraph.cli, *argv] run with ENVIRONMENT, an Outcome(status, out, err) -- each asserted exit 0 in the fixture: [add, story, Raise the moves of fgraph from 0 to 1, --given, a state, --when, an action, --then, another]; [add, task, a task title, --parent, S-0001, --output, changed: work.txt, --check, echo checked && test -f work.txt]; [add, task, another task title, --parent, S-0001, --output, changed: more.txt, --check, exit 3]. WORKTREE = the parent of the project / project.worktrees / S-0001-raise-the-moves-of (the branch of a work item is its id and the first four words of its title: see LEAF of test_start_agent.py). class Session, the server: subprocess.Popen([sys.executable, -m, flowgraph.cli, mcp], cwd=project, env=ENVIRONMENT, stdin, stdout and stderr pipes, text=True); call(name, **arguments) writes one tools/call with the next id and reads one line within PATIENCE = 60 seconds through selectors, as first_line of tests/status/watch/test_pipe.py reads one, keeping every line read in lines; it returns parsed(line) ({} for a line that is no JSON object, an empty line, or a write refused with BrokenPipeError by a server that has exited, as today); close() closes stdin and returns Outcome(wait(timeout=60), '', stderr read). A module fixture moves(project) runs, in order, and keeps each reply by its step: initialize (id 0, 2025-11-25) and notifications/initialized; started = call(start, directory=project, id=S-0001, agent=sonnet-a1); written = cli(project, add, story, a second story, --given, a, --when, b, --then, c) while the session is open; task = call(start, directory=WORKTREE, id=T-0001); noted = call(note, directory=WORKTREE, id=S-0001, kind=progress, text=red: a test); work = committed(WORKTREE, work.txt) -- write the file, git add, git commit --quiet --message feat: the work of T-0001, git rev-parse HEAD; but no commit when WORKTREE is not a directory, then the text no commit, so the fixture runs to its end under red; completed = call(complete, directory=WORKTREE, id=T-0001, commit=work); second = call(start, directory=WORKTREE, id=T-0002); more = committed(WORKTREE, more.txt); refused = call(complete, directory=WORKTREE, id=T-0002, commit=more); after = head(WORKTREE), git rev-parse HEAD there or the text no worktree; listed = the tool names of a tools/list; ended = close(). XFAIL = pytest.mark.xfail(strict=True, reason='S-0159: fgraph mcp serves no move'). text(reply) = the text of the first content of the result of the reply, the empty text when there is none (reply.get(result, {}).get(content) or [{}], then .get(text, '')), so a missing reply fails on its value. Red tests, each under XFAIL: text(started).partition of the newline, its first part, == started S-0001 (never splitlines()[0], which raises on the empty text of today); text(task) == started T-0001 of S-0001 and a newline; text(noted) == noted S-0001 and a newline; text(completed) == completed T-0001 of S-0001 at <work> and a newline; chore: start S-0001 in the record is in the subjects of git log --format=%s on main; the first four subjects beginning with chore: of git log --format=%s in WORKTREE (none when it is not a directory) == [chore: start T-0002 of S-0001 in the record, chore: complete T-0001 of S-0001 in the record, chore: note S-0001 in the record, chore: start T-0001 of S-0001 in the record]; refused result isError is True; its content == [{type: text, text: fgraph: error: T-0002 cannot complete: its check \"exit 3\" exited with status 3}]; after == more -- nothing committed by the refusal; git status --porcelain of WORKTREE is the empty text (the text no worktree when it is not a directory); [parsed(line).get(jsonrpc) for line in the lines] == [2.0] * the count of requests made, the initialize and every call -- the check printed checked and it is not among them; checked is in ended.err -- it reached the stderr of the server; sorted(set(listed) & {start, hand, block, unblock, note, complete}) == [block, complete, hand, note, start, unblock]; ended.status == 0. Guards, no mark, passing today and after: written.status == 0 -- a write of the command line on main while the server runs is not refused, the server holding no lock; chore: start T-0001 of S-0001 in the record is not among the subjects of git log on main. Probed on 2026-11-25 with the commands run by hand at 0ae0a98f: the start prints started S-0001 then branch wi/S-0001-... in <path>; the start of a Task started T-0001 of S-0001; the note noted S-0001; the complete completed T-0001 of S-0001 at <full sha>; the refusal fgraph: error: T-0002 cannot complete: its check \"exit 3\" exited with status 3, exit 2; the commits on the branch chore: start T-0001 of S-0001 in the record, chore: note S-0001 in the record, chore: complete T-0001 of S-0001 in the record, chore: start T-0002 of S-0001 in the record; and the check wrote checked on stdout. See each marked test fail under --runxfail on its property, none on the arrangement (today fgraph mcp of S-0157 lists no move, so start is the error Unknown tool: start and every result is {}). Out of bounds: every file under src/, every other test file, the docs."
check = "uv run pytest tests/functional/test_mcp_moves.py -q -p no:cacheprovider && grep -q xfail tests/functional/test_mcp_moves.py"
expected_output = "created: tests/functional/test_mcp_moves.py states that one fgraph mcp, run as a process on a git repository with the development on and a planned Story in Backlog whose two Tasks name their files and hold checks, answers the tool start of S-0001 with agent sonnet-a1 called on main with started S-0001, start of T-0001, note of its progress and complete of T-0001 at its commit, each called in the worktree of S-0001, with the line each command prints; that the start is committed on main and the three moves of the Task on the branch of S-0001; that the complete of T-0002, whose check exits 3, is given isError true and the one line T-0002 cannot complete: its check \"exit 3\" exited with status 3, HEAD of the worktree left where it was and nothing written; that the output of a check reaches the stderr of the server and never its stdout, whose every line is a reply; that the tools start, hand, block, unblock, note and complete are listed; and that the server exits 0 when its input closes. And, as guards, that a write of the command line on main while the server runs exits 0 and that main holds no commit of a Task move. Each red test carries a strict xfail naming S-0159"
