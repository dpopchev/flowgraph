title = "Move the reference of every command from README.md to docs/reference.md, every line of it kept and in order"
description = "FIRST PASS, written on 2026-11-25 before Phases 2 and 3 were completed: the coordinator reviews this Task before its Feature starts (U-0042, its decision of 2026-11-25). If no later line of U-0042 says its Tasks were reviewed, stop and say so. It lands last: S-0181 and S-0182 completed, and every work item of Phases 2, 3 and 4 that adds a passage to README.md completed first (uv run fgraph status: if one is started, stop and say which). A step: no command and no test changes, README.md is cut and nothing of it is lost. Two files: README.md (3,524 lines and 159,199 bytes on main on 2026-11-25, about 160 lines and 10,500 bytes after) and docs/reference.md (new, about 3,400 lines). Where each part goes, the smaller of the two readings: a page of its own, docs/reference.md, since the passages are moved whole and in order with no line changed; docs/domain-model.md, the specification, keeps its sections as they are (the other reading, the examples merged into its sections, is in open). Find each cut by grep, never by line number; if one finds nothing, stop and say so: grep -n '^The model of the record -- its item types' README.md (the paragraph that ends what stays of ## Status, after the table of the parts); grep -n '^A term is a node of the record with no flow' README.md (the first passage that moves, line 79 on 2026-11-25); grep -n '^## Use' README.md; grep -n '^is then made there with .fgraph init.' README.md and the sh block of make install under it (what stays of ## Use); grep -n '^.fgraph. looks for the record in this order' README.md (the first passage of ## Use that moves); grep -n '^## Develop' README.md (where the moves end). README.md keeps, in order: line 1 to the end of the paragraph on the model; ## Use; the passage on make install and its sh block; a new line: The reference of every command, with its examples, is [docs/reference.md](docs/reference.md).; ## Develop to the end. docs/reference.md: # Reference of fgraph; a new paragraph in the voice of README.md: every command of fgraph with its examples, moved whole from README.md (U-0042), the model of the record being docs/domain-model.md; ## Terms, links and knowledge followed by the passages of ## Status from the term to the line before ## Use, verbatim; ## Commands followed by the passages of ## Use from fgraph looks for the record to the line before ## Develop, verbatim. Lines inside them that name README for themselves (grep -n 'README' of the moved text: README names them in its prose as before, on 2026-11-25) stay verbatim and are listed in the hand-back. The cut of about 3,400 lines cannot be made by Edit: make it with a throwaway script under local/scratch/d3/ (local/ is ignored by git; never committed), run once, and read the diff before the commit. The proof, run before the commit and quoted in the hand-back: the first part of the check, which prints every non-blank line of README.md on main that no line of the five files holds whole, and prints nothing; and the counts, wc -l of README.md on main, of README.md and of docs/reference.md after. The tests of the pages pass before and after: run them first. docs/board-review.md is not changed (open). Out of bounds: docs/domain-model.md, docs/quickstart.md, docs/agents.md, docs/board-review.md, pyproject.toml (its readme stays README.md), src/, tests/."
check = "git rev-parse -q --verify main >/dev/null && ! git show main:README.md | grep -vx '[[:space:]]*' | grep -vxF -f README.md -f docs/reference.md -f docs/quickstart.md -f docs/agents.md -f docs/domain-model.md | grep -q . && test \"$(wc -c < README.md)\" -le 16000 && grep -q '^# Reference of fgraph' docs/reference.md && uv run pytest tests/functional/test_quickstart.py tests/functional/test_agents.py tests/functional/test_page_commands.py -q -p no:cacheprovider"
expected_output = "changed: README.md keeps its opening, the list Read next, under ## Status its first paragraph, the table of the parts and the paragraph on the model, under ## Use the passage on make install and one new line naming docs/reference.md, then ## Develop and ## License; created: docs/reference.md holds every other passage of README.md, verbatim and in order, under ## Terms, links and knowledge (from Status) and ## Commands (from Use); every non-blank line of README.md on main is a line of README.md, docs/reference.md, docs/quickstart.md, docs/agents.md or docs/domain-model.md; README.md is at most 16,000 bytes"
