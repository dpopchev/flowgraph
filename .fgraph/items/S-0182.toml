title = "Add docs/agents.md: serve fgraph mcp to a session, read the brief of a work item and keep a knowledge line that governs a file"
description = "FIRST PASS, written on 2026-11-25 before Phases 2 and 3 were completed: the coordinator reviews this Task before its Feature starts (S-0182, its decision of 2026-11-25). If no later line of S-0182 says its Tasks were reviewed, stop and say so. Two files: docs/agents.md (new, at most 100 lines) and tests/functional/test_agents.py (remove XFAIL and its marks). Red first: remove the marks, see the tests fail for the missing page, then write it. Plain ASCII, the voice of README.md and of docs/quickstart.md. Ground every sentence in what runs: read the passage on fgraph mcp of README.md (grep -n 'claude mcp add fgraph -- fgraph mcp' README.md) and ## Tools over stdio of docs/domain-model.md (grep -n '^## Tools over stdio' docs/domain-model.md); if either finds nothing, stop and say so. Shape: # Agents; one paragraph: fgraph mcp is a stdio server of the Model Context Protocol that a session starts; each call is a run of fgraph in the directory it names, the checkout of main or the worktree of a work item; a refusal comes back as its one line; the server writes nothing itself and ends when its input closes. ## Serve it: a sh block of the record it is tried on, the development off as in docs/quickstart.md -- git init -q -b main; fgraph init (# record: <path>/.fgraph); fgraph add story \"Raise the greetings hello.sh prints from none to one\" --given \"a checkout\" --when \"sh hello.sh runs\" --then \"it prints hello\" (# added S-0001); fgraph add task \"Add hello.sh, which prints hello\" --parent S-0001 --output \"created: hello.sh\" (# added T-0001 to S-0001); fgraph start S-0001 (# started S-0001) -- then a sh block with claude mcp add fgraph -- fgraph mcp, which the test reads and does not run, and a sentence that the session then lists the tools as mcp__fgraph__<name>. ## The tools: one line per tool of the server, in the order tools/list gives them (status, brief, show, knowledge, about, the moves of S-0159, land and verify of S-0160 -- list them from the reply of tools/list, not from this text), as mcp__fgraph__<name> and what it runs; that no tool takes the approval of a landing (S-0160). ## Read a brief and keep a line: what a session does at the start of a work item -- the brief, then a decision that governs the file it is about, then about of the file -- with the block fenced json the test gives to fgraph mcp, one message a line, exactly: {\"jsonrpc\": \"2.0\", \"id\": 0, \"method\": \"initialize\", \"params\": {\"protocolVersion\": \"2025-11-25\", \"capabilities\": {}, \"clientInfo\": {\"name\": \"a-client\", \"version\": \"1\"}}}; {\"jsonrpc\": \"2.0\", \"method\": \"notifications/initialized\"}; {\"jsonrpc\": \"2.0\", \"id\": 1, \"method\": \"tools/list\"}; then ids 2, 3, 4: tools/call of brief {directory: ., id: S-0001}, of note {directory: ., id: S-0001, kind: decision, text: hello.sh prints one line and nothing else, governs: [hello.sh]} and of about {directory: ., id: hello.sh}; a sentence before it that a session sends these itself and the block is what fgraph mcp answers on a pipe, and that a session in the worktree of a work item names that worktree as its directory. Keep the ids, S-0001 and hello.sh: the test reads them. If tools/list gives another tool when this Task runs, name it in the page: the guard test fails otherwise. Out of bounds: every file under src/, tests/functional/page_commands.py, every other test file, README.md, docs/domain-model.md, docs/quickstart.md."
check = "uv run pytest tests/functional/test_agents.py tests/functional/test_page_commands.py -q -p no:cacheprovider && ! grep -q xfail tests/functional/test_agents.py && test \"$(wc -l < docs/agents.md)\" -le 100"
expected_output = "created: docs/agents.md says how an operator gives fgraph mcp to a Claude Code session (claude mcp add fgraph -- fgraph mcp), lists every tool the server serves as mcp__fgraph__<name>, and shows the record it is tried on and the messages a session sends to read the brief of S-0001, keep a decision that governs hello.sh and read it back; no xfail mark is left in tests/functional/test_agents.py"
