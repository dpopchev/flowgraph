efused('start', 'started', 'T-0001', GONE) gives (StartedAlreadyError, 'T-0001 is started already'); start and complete from blocked (parametrized) give (BlockedError, 'T-0001 is blocked: unblock it first'); start, complete and remove from completed (parametrized) give (CompletedAlreadyError, 'T-0001 is completed already'); complete from backlog gives (NotStartedError, 'T-0001 is in Backlog: start it first'); start, complete and remove from removed (parametrized) are GONE; the take pairs gain ('start', 'backlog'), ('complete', 'started'), ('remove', 'backlog'), ('remove', 'started') and ('remove', 'blocked'), raising LookupError. Existing tests: none changes; if one fails, stop and say which. Out of bounds: the moves (the next two Tasks), every other file of src/ and tests/, the docs; run uv run ruff format on the files."
