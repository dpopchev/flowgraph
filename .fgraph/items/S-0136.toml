description = "The keys go through the modules of flowgraph.record as S-0120 added archive.board: values, tables and key names in a module of their own, since src/flowgraph/record/config.py (230 lines today, about 231 after S-0120, S-0096, S-0098 and S-0099) has no room for five keys. New src/flowgraph/record/listing.py (about 120 lines), importing nothing of flowgraph.record.config. It holds: STATUS_BACKLOG = \"status.backlog\", STATUS_IN_PROGRESS = \"status.in-progress\", STATUS_COMPLETED, STATUS_REMOVED, WATCH_BUCKETS = \"watch.buckets\", ALL = \"all\"; class Bucket(Enum) with BACKLOG = \"backlog\", IN_PROGRESS = \"in-progress\", COMPLETED = \"completed\", REMOVED = \"removed\", in the order of the flow; frozen dataclasses Lines(count: int) and AllLines with ALL_LINES, Listed = Lines | AllLines (shaped as Parallel, Unlimited and Limit of layers.py); frozen StatusLists(backlog, in_progress, completed, removed: Listed) and WatchShows(buckets: tuple[Bucket, ...]); LINES_TAKEN = \"a count of lines of 1 or more, or all\" and BUCKETS_TAKEN = \"the buckets to show, among backlog, in-progress, completed and removed, separated by commas\"; TAKES, a mapping of each of the five key names to its words; StatusTable and WatchTable (BaseModel, each its own model_config = ConfigDict(extra=\"forbid\", strict=True), as ArchiveTable); make_status_lists(table), make_watch_shows(table); listed_text(listed) -> int | str (the count, or all) and buckets_text(shows) -> str (the words joined by \", \"). The tables: StatusTable has backlog: int | str = 1, in_progress: int | str = Field(default=ALL, alias=\"in-progress\"), completed = 5, removed = 5, validated by ONE field_validator over the four in mode=\"plain\" that returns the text all or a whole number of 1 or more that is no bool and raises ValueError otherwise. Do not type them int | Literal[\"all\"]: pydantic then reports two errors whose place ends in the member (status.backlog.int), and the refusal names a wrong key (probed on pydantic 2.14.4; the plain validator gives one value_error at status.backlog, and the alias gives status.in-progress, in_progress refused as no key). WatchTable has buckets: str, default the four words, a plain validator refusing a value that is no text, no word, a word that is no bucket, a word twice; make_watch_shows gives the buckets in the order of the flow whatever the order written. src/flowgraph/record/config_file.py (made by S-0096, about 68 lines, about 71 after): ConfigFile gains status: StatusTable = StatusTable() and watch: WatchTable = WatchTable(). src/flowgraph/record/config_refusal.py (52 today, about 60 after S-0098 and S-0120, 2 more): the mapping by dotted key that refusal reads first (S-0098 made it read by key before the type) gains **TAKES. src/flowgraph/record/config.py (about 231, about 239 after): Config gains status: StatusLists and watch: WatchShows; make_config passes them; two sentences of its docstring. src/flowgraph/record/setting.py (204 today, about 223, about 237 after): five Key lines after archive.board, the four counts as Takes.COUNT with listed_text (its reader keeps a text that is no number, so all arrives as a text), watch.buckets as Takes.TEXT with buckets_text. Red first: typed stubs that raise NotImplementedError. Tests: new tests/record/config/test_listing.py (edge): the defaults; each key read as a count and as all; 0, -1, \"many\", true, 2.5 refused with the whole line; in_progress refused as no key; status = 3 takes a table; the buckets read in the order of the flow; \"\", \"backlog, done\", \"backlog, backlog\", 3 and [\"backlog\"] refused with the whole line. tests/record/setting/test_show_config.py and tests/functional/test_config_command.py: each whole listing gains the five lines. tests/record/setting/test_with_setting.py and test_without_setting.py: a count, all, a dashed key and a refused value. Then remove XFAIL_KEY and its marks. Out of bounds: src/flowgraph/status/, src/flowgraph/cli.py, src/flowgraph/record/init.py and __init__.py, the docs."
