00:00); on a terminal of width 80 the output starts with CLEAR followed by the head; at width 80 and height 4 the frame is CLEAR, the head, the two first lines of status and one line `... N more lines`, N read from the run. Guards, no mark, passing today and after: the first line of fgraph status on EVERY is the heading of its first bucket; watch --count 1 on EVERY exits 0; fgraph status --format json on EVERY holds no key named progress at its top. Read every literal from the run but for the head. See each marked test fail under --runxfail on the head, none on the arrangement. Out of bounds: every file under src/, every other test file, the docs."
