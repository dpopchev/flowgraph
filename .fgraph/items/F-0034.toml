title = "Raise the reads of fgraph answered from an index kept beside the record, rebuilt by itself, from none to every one"
description = "Phase 4, Disposable Local Read-Index (Graph Queries) and Distribution, the last phase, to be completed after Phase 3 (F-0030 to F-0033): filed on the word of the developer of 2026-11-25, great, file them, on the draft the coordinator showed that day from a first pass of the developer of four Features, reviewed against the repository. The first pass numbers it F-0031, an id the record gave a Feature of Phase 3, and names it Content-Hashed SQLite Read-Index and Triple Store; its target modules: record/store.py, work_item/projection.py, .gitignore; its scope: materialize .fgraph/items/*.toml, the K-* knowledge records, queue.toml and terms/*.toml into an untracked .fgraph/.cache/ SQLite store with normalized (subject, predicate, object) graph edges invalidated per file by content hash; its exit gate: deleting .fgraph/.cache/ transparently rebuilds the index and edge store on the next read command with identical query outputs. Measured by the coordinator on main on 2026-11-25, the machine under the load of two suites: the record holds 288 item files, the biggest 45,824 bytes, 2,290,297 bytes in all, 22 terms, queue.toml and config.toml, and no K-* item -- a knowledge line lives in the file of its item; sqlite3 of the standard library answers (SQLite 3.53.1), so the index takes no dependency; one fgraph status, profiled in process, parsed TOML 22,801 times for those 288 files, 64 of its 66 seconds inside check_relations of src/flowgraph/relation/read.py through 148 calls of find_work_item_rows: each file is read about 79 times, the repeated reads U-0018 of Phase 2 cuts; by the same profile one parse of each file is under a second. So the index is weighed against a record read once, not against today: its first work item is the Spike that measures it after U-0018, and its answer may be no. .gitignore names no folder of the record today. Its first-pass Tasks are drafted the same day and reviewed before the phase starts."
