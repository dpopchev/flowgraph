[criterion]
given = "a record with the development on and two started work items, one that names no agent, started by the completion of another, and one that names an agent"
when = "each is handed to an agent named, by one command"
then = "fgraph status lists the new agent beside each, and fgraph show of the second lists the agent it holds now"

