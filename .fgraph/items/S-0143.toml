em use replace and stay untouched. src/flowgraph/work_item/__init__.py (189, about 195 after): import and list ProgressLine, ProgressRow, make_progress_line, progress_row and progressed_work_item. Red first: add the field, then make_progress_line, progress_row and progressed_work_item as typed stubs raising NotImplementedError; write the tests; see each fail for its own reason; then write the bodies and the five keywords. Build every line and every item inside a test or a fixture, never at module level, so no test is red at the import. New tests/work_item/test_work_item_progress.py (about 130 lines), pytestmark = pytest.mark.model, one assert each, with CHORE, CREATED, ON, COMMIT, SCENARIO, BARE, TASK (make_task_id(3)), ITEM, HALF, STUCK and WHOLE as tests/work_item/test_work_item_file.py builds them: a line holds its text; its time is kept to the second; it names no Task by default; it holds the Task given; a blank text raises EmptyPartError matching ^text is empty$; progress_row of a line of T-0003 is ProgressRow(ON, \"a text\", \"T-0003\") and of one of the work item has task \"\"; two lines noted are kept in the order noted; a line of T-0003 is kept on ITEM; a line of T-0009 raises TaskNotFoundError matching ^no Task T-0009 in the record$; the knowledge of a work item with a line is still (); parametrized over the moves, the result keeps (LINE,): started_work_item of ITEM with the line, blocked_work_item of HALF with it, unblocked_work_item of STUCK with it, completed_work_item of the item whose Task is completed with it, removed_work_item of BARE with it, amended_work_item of BARE with it and a new title. Existing tests that change: none; those that compare a move with a state built by hand (tests/work_item/test_work_item_moves.py, test_work_item_remove.py) pass untouched, the default being (). Out of bounds: the file models and readers (Task 3), src/flowgraph/task/ (a Task holds no line of its own: the work item holds the line that names it), src/flowgraph/knowledge/, src/flowgraph/feature/, tests/functional/."
