[criterion]
given = "a repository with a .board/ of board 1 that holds open and closed items"
when = "the developer starts a record of fgraph in it"
then = "the .fgraph/ holds the open work alone, the old board stays whole as an archive nothing writes to, and an item of the old board is found from the new record by the id it held"

