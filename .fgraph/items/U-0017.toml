_the_id_of_an_item_the_name_of_a_term_and_the_path_of_a_file: \"the id of the work item or of the Feature, the name of the term or the path of the file\" in \" \".join(COMMAND_LINE.commands[\"about\",].format_help().split()). Both hold after S-0156 adds its --format argument, since they read a substring. Existing tests: none changes; no test, README.md or docs/ states the old summary (grep -rn 'links of a work item' tests README.md docs finds a docstring of tests/functional/test_about_item.py and the README table line, which are not the help); if one fails, stop and say which. README.md and docs/domain-model.md name no help line of about, so no doc Task. Out of bounds: src/flowgraph/parser/base.py, src/flowgraph/about/, README.md, docs/, every other file of src/ and tests/."
