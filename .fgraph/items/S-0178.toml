cle ends the walk; a name terms does not hold is listed and not followed. (2) tests/term/test_terms_reached.py (new, about 80 lines), view as its pytestmark (as tests/term/test_term_shown.py), one assert each, terms as Term('gate', 'a meaning', ADDED, (), ('lane',)) of src/flowgraph/term/model.py and entries as KnowledgeEntry('S-0001', 'decision', a time, 'a text', about=['gate'], ref='S-0001#1'): a line about gate, gate part of lane, gives [TermReached('gate', 'about', 'S-0001#1'), TermReached('lane', 'part of', 'gate')]; lane is a path adds TermReached('path', 'is a', 'lane') third; two lines about one term list it once, from the first; a term reached by two ways is listed once, nearest; gate part of lane and lane part of gate ends; no line gives []; a line about no term gives []; an entry with no ref is reached from its item. Red first: TermReached whole, terms_reached a typed stub raising NotImplementedError, the tests seen failing for their own reason, then the body. Existing tests: none changes; if one fails, stop and say which. Out of bounds: src/flowgraph/term/model.py, item.py and __init__.py, src/flowgraph/about/, src/flowgraph/graph/, every other file of src/ and of tests/, the docs."
