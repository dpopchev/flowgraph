[[tasks]]
id = "T-0767"
state = "backlog"
title = "Add tests/work_item/test_work_item_table.py: the five states of a work item against its seven moves, each cell its next state or its one line"
description = "FIRST PASS, written on 2026-11-25 before Phase 2 was completed: the coordinator reviews this Task before its Feature starts (U-0040, its decision of 2026-11-25). If no later line of U-0040 says its Tasks were reviewed, stop and say so. A step: one new test file, no source change. tests/work_item/test_work_item_table.py (new, about 120 lines), pytestmark = pytest.mark.model as tests/work_item/test_work_item_moves.py has, one assert per test. Build the states as tests/work_item/test_work_item_moves.py builds them: CHORE = make_kind('Chore', 'a', 'CH'); CREATED, ON and DONE whole seconds (datetime(2026, 1, 1, 12, 30, 15, tzinfo=UTC) and the like); COMMIT = make_commit('abc1234'); TASK = make_task(make_task_id(1), 'a task title', 'an output', '', CREATED); ITEM = append_task(make_work_item(make_work_item_id(CHORE, 1), 'a title', make_scenario('a', 'b', 'c'), '', CREATED), TASK); FINISHED = completed_task(started_task(started_work_item(ITEM, ON), make_task_id(1), ON), make_task_id(1), DONE, COMMIT) -- started with its Task completed, so that its complete is a move and not the refusal of an open Task (that refusal stays stated in test_work_item_moves.py). STATES: dict[str, WorkItemState] = {backlog: ITEM, started: FINISHED, blocked: blocked_work_item(FINISHED, 'a reason', 'someone', ON), completed: completed_work_item(FINISHED, DONE, COMMIT), removed: removed_work_item(ITEM, 'a reason', ON)}. MOVES: dict[str, Callable[[WorkItemState], object]] = {start: started_work_item(s, ON), block: blocked_work_item(s, 'a reason', 'someone', ON), unblock: unblocked_work_item(s), complete: completed_work_item(s, DONE, COMMIT), remove: removed_work_item(s, 'a reason', ON), hand: handed_over(s, make_agent('sonnet-a1')) of flowgraph.work_item.handed, verify: verified_work_item(s, 'make check: all checks passed', DONE)}, each a lambda over s; every other name imported from flowgraph.work_item, flowgraph.task and flowgraph.criterion as the neighbouring tests import them, make_agent from flowgraph.work_item.agent. TABLE: dict[tuple[str, str], type[object] | str], written as a table a developer reads, one line per cell, in the order of STATES then MOVES. The cells, probed on 2026-11-25 against main (a scratch script calling these functions; none raised outside REFUSED): backlog: start StartedWorkItem; block 'CH-0001 is in Backlog: start it first'; unblock 'CH-0001 is not blocked'; complete 'CH-0001 is in Backlog: start it first'; remove RemovedWorkItem; hand 'CH-0001 is in Backlog: its start names the agent with --agent'; verify 'CH-0001 is backlog: fgraph verify takes a completed Story, Bug or Upkeep'. started: start 'CH-0001 is started already'; block BlockedWorkItem; unblock 'CH-0001 is not blocked'; complete CompletedWorkItem; remove RemovedWorkItem; hand StartedWorkItem; verify 'CH-0001 is started: fgraph verify takes a completed Story, Bug or Upkeep'. blocked: start 'CH-0001 is blocked: unblock it first'; block 'CH-0001 is blocked already'; unblock StartedWorkItem; complete 'CH-0001 is blocked: unblock it first'; remove RemovedWorkItem; hand 'CH-0001 is blocked: unblock it first'; verify 'CH-0001 is blocked: fgraph verify takes a completed Story, Bug or Upkeep'. completed: start, block, complete, remove and hand 'CH-0001 is completed already'; unblock 'CH-0001 is not blocked'; verify CompletedWorkItem. removed: start, block, complete, remove and hand 'CH-0001 is removed already'; unblock 'CH-0001 is not blocked'; verify 'CH-0001 is removed: fgraph verify takes a completed Story, Bug or Upkeep'. Tests: test_the_table_holds_every_state_against_every_move: sorted(TABLE) == sorted(itertools.product(STATES, MOVES)); test_a_move_the_table_takes_gives_its_next_state, parametrized on the cells whose value is a type, ids f'{state}-{move}': type(MOVES[move](STATES[state])) is TABLE[(state, move)]; test_a_move_the_table_refuses_raises_its_one_line, parametrized on the cells whose value is a str: with pytest.raises(REFUSED, match=f'^{re.escape(line)}$') -- REFUSED of flowgraph.parser.refusals, so a cell states the line fgraph prints after fgraph: error: and that run() turns it into that line. Red first: the check fails before the file exists; then delete one cell of TABLE and see the product test fail, and change one line and see its cell fail, before putting both back. If a cell gives another next state or another line than the list above, or raises an error outside REFUSED, do not change the source and do not bend the cell: stop and say which cell and what it gave; the coordinator files it as a Bug. Existing tests: none changes; if one fails, stop and say which. Out of bounds: every file under src/, every other test file, the docs."
check = "uv run pytest tests/work_item/test_work_item_table.py tests/work_item/test_work_item_moves.py tests/work_item/test_work_item_block.py tests/work_item/test_work_item_hand.py tests/work_item/test_work_item_verify.py -q -p no:cacheprovider && grep -q '^TABLE' tests/work_item/test_work_item_table.py && grep -q 'product(' tests/work_item/test_work_item_table.py"
expected_output = "created: tests/work_item/test_work_item_table.py holds TABLE, a dict keyed by (state, move) over the five states backlog, started, blocked, completed and removed and the seven moves start, block, unblock, complete, remove, hand and verify, each value the type of the next state or the one line of its refusal; one test states that its keys are the whole product of STATES and MOVES, a parametrized test states each next state and a parametrized test each refusal, raised as one of REFUSED of src/flowgraph/parser/refusals.py with exactly that line. No source changes and every command prints what it printed before"
created = 2026-11-25 09:39:28+00:00

