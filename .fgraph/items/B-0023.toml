description = "One new test file, no source change: tests/functional/test_land_push_untracked.py (about 190 lines), run through run() of src/flowgraph/cli.py on a real git repository in tmp_path, functional as its pytestmark, one assert per test. Its docstring names the expected of B-0023. Copy from tests/functional/test_land_push_refused.py (235 lines, not changed): NOW, CRITERION, ADD_STORY, ADD_TASK, LAND, LAND_UNWORDED, BRANCHES, WORKTREE, DEVELOPMENT, PUSH, WAYS, WAY_IDS, IDENTITY, Outcome, fgraph, git, the autouse fixture environment and the fixture origin. A helper started(tmp_path, development=DEVELOPMENT, delivery=PUSH) -> Path is the ready of that file without its origin parameter and without its two lines git remote add origin and git push --set-upstream: the configuration, both tables, is committed before the Story starts, so a fast-forward lands, and main tracks nothing. A git repository of a test takes its identity from the environment of the command, as environment gives it, never from git config. REFUSAL = \"fgraph: error: S-0001 cannot land: main tracks no branch of a remote to push to -- run git push --set-upstream <remote> main, or fgraph config set delivery.push false\". A frozen dataclass Refused(checkout, land, before), before being git rev-parse main read before the land. Why the tests are red today: since S-0140 the land merges, then its first push is refused, and it exits 2 with main tracks no branch of a remote to push to -- main is not pushed -- S-0001 is merged at <sha> and not completed -- run fgraph land S-0001 again, main moved, the Story InProgress, its branch and its worktree standing (src/flowgraph/development/delivery.py, pushed_at_merge; src/flowgraph/development/git.py, upstream_of). Red tests, each under its own strict xfail, XFAIL = pytest.mark.xfail(strict=True, reason=\"B-0023: fgraph land merges before it says main tracks no branch of a remote\"): (1) in class TestALandingWhoseMainTracksNoRemote, fixture refused = the land of started(tmp_path): the pair (status, land.err.splitlines()[-1:]) is (2, [REFUSAL]), a pair because the exit is 2 today too; (2) test_main_is_where_it_was_by_each_way, parametrized on WAYS with WAY_IDS, the mark on the function: the pair (status, git rev-parse main) is (2, before); (3) test_a_remote_main_does_not_track_is_refused_the_same: started, then git remote add origin <the origin fixture> with no --set-upstream, then the land: the pair is (2, [REFUSAL]). Guards, no xfail, passing today and after, in the same class on the fixture refused: fgraph show S-0001 holds the line bucket       InProgress; git branch --list BRANCHES is not empty; (tmp_path / WORKTREE).is_dir() is true. Guards outside the class: with started(tmp_path, delivery=\"[delivery]\\npush = false\\n\") the pair (status, out) of the land is (0, \"landed S-0001 at <sha>\\n\"), the sha being git rev-parse --short main~1 read after; and after a refused land, git remote add origin, git push --quiet --set-upstream origin main, then the land run again: the pair (status, out) is (0, \"landed S-0001 at <sha>\\npushed main to origin\\n\"), the sha read the same way (today the landing is taken up at the merge the first land left, after the fix the second land makes the merge: the pair holds both ways). Run the file and see each marked test xfail and each guard pass before the commit. Where a test named red passes today, it is neither left unmarked nor dropped: pair its fact with one that is red, or stop and say so; where a guard fails today, stop and say so. Out of bounds: every file under src/, every other test file, README.md, docs/."
