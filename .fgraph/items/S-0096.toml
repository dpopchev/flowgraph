s neither is refused with the whole line; on the trunk parallel left out is Parallel(1) and parallel = 1 is Parallel(1); parallel = 2 beside trunk raises the whole line; branched over make_config, parametrized: off False, on True, on with trunk False, off with trunk False. tests/record/setting/test_show_config.py: the two whole listings gain development.mode = \"branch\" after the driver line, and EVERY_KEY gains mode = \"branch\". tests/record/setting/test_with_setting.py: development.mode set to trunk beside enabled is kept; set to main is refused naming the key and the two words. tests/functional/test_config_command.py: the listing of the defaults gains the line. tests/functional/test_trunk.py: remove XFAIL_KEY and its marks, nothing else; the XFAIL_START tests must still xfail. Out of bounds: src/flowgraph/development/, src/flowgraph/status/, src/flowgraph/parser/, README.md and docs/ (the last Task)."
