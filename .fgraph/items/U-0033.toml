description = "FIRST PASS, written on 2026-11-25 before Phase 2 was completed: the coordinator reviews this Task before its Feature starts (U-0033, its decision of 2026-11-25). If no later line of U-0033 says its Tasks were reviewed, stop and say so. The shape, from a prototype of 2026-11-25 (pyright 1.1.414, throwaway under /home/dimitar/.cache/fgraph-tmp/draft/): the refusal of a move is one table matched on the pair of the move and the name of the state, the same for the three aggregates; each aggregate keeps its own five states, the case of the state that takes the move and the fields it carries (the next two Tasks). No state class gains a base class. Six files. src/flowgraph/task/model.py (216 lines on 2026-11-25, about 219 after): right after the alias TaskState, the comment line # A state of a Task, a work item or a Feature, as the record writes it. and type StateName = Literal['backlog', 'started', 'blocked', 'completed', 'removed']; typing gains Literal; task_state_name(task: TaskState) -> StateName (its body returns these words already). src/flowgraph/task/refusal.py (about 30 lines after U-0032, about 60 after): the comment line # A move the Task, the work item and the Feature refuse alike. and type Move = Literal['block', 'unblock'] (U-0034 adds start, complete and remove); def refused(move: Move, state: StateName, named: str, gone: Exception) -> Exception, docstring: The refusal of the move of the item named in that state; gone, the item's own, when it is removed. Raises LookupError when the state takes the move: the caller's own case takes it first. Its body is match move, state: with these cases in this order -- the order is the rule: an unblock of a removed item is refused as not blocked, as today, and a prototype that put the removed row first changed that: case 'unblock', 'backlog' | 'started' | 'completed' | 'removed': return NotBlockedError(f'{named} is not blocked'); case 'block', 'removed': return gone; case 'block', 'completed': return completed_already(named); case 'block', 'blocked': return BlockedError(f'{named} is blocked already'); case 'block', 'backlog': return in_backlog(named); case ('block', 'started') | ('unblock', 'blocked'): raise LookupError(f'{state} takes the move {move}: it is no refusal'); case _ as unreachable: assert_never(unreachable). Probed: pyright narrows the tuple of two Literals, so a pair left out fails assert_never (a pair dropped from the prototype was reported). Imports BlockedError, NotBlockedError and StateName from flowgraph.task.model. The module docstring gains: refused states the refusal of a move the three aggregates share, by the state it is refused in; each aggregate keeps its own states and its own case of the state that takes the move (U-0033). src/flowgraph/feature/state.py (193 lines, about the same): from typing import Final, assert_never; IN_BACKLOG, STARTED, BLOCKED, COMPLETED and REMOVED each written NAME: Final = '...'; state_name(feature: FeatureState) -> StateName, StateName imported from flowgraph.task. src/flowgraph/work_item/state.py (53 lines, about the same): STARTED: Final = 'started', BLOCKED: Final = 'blocked'; state_name(item: WorkItemState | TaskState) -> StateName (probed: a Final constant returns as the Literal, and IN_PROGRESS = frozenset({STARTED, BLOCKED}) still type-checks). src/flowgraph/task/__init__.py (about 93 lines, about 96): exports Move and refused from flowgraph.task.refusal and StateName from flowgraph.task.model, __all__ sorted (ruff RUF022). Red first: Move whole and refused as a typed stub raising NotImplementedError, the tests seen failing for that reason, then the body; StateName and the annotations are a narrowing only pyright sees, gated by uv run pyright. Tests, model as the pytestmark of tests/task/test_task_block.py, one assert each, new tests/task/refusal/test_refused.py (about 50 lines), GONE = ValueError('T-0001 is removed already'), each refusal compared as (type(error), str(error)): refused('block', 'backlog', 'T-0001', GONE) gives (NotStartedError, 'T-0001 is in Backlog: start it first'); 'blocked' gives (BlockedError, 'T-0001 is blocked already'); 'completed' gives (CompletedAlreadyError, 'T-0001 is completed already'); refused('block', 'removed', 'T-0001', GONE) is GONE; refused('unblock', state, 'T-0001', GONE) gives (NotBlockedError, 'T-0001 is not blocked') for each of backlog, started, completed and removed (parametrized); ('block', 'started') and ('unblock', 'blocked') raise LookupError (parametrized, match=r'takes the move'). Existing tests: none changes; if one fails, stop and say which. Out of bounds: the moves (src/flowgraph/task/moves.py, src/flowgraph/feature/moves.py, src/flowgraph/work_item/block.py: the next two Tasks), every other file of src/ and tests/, the docs; run uv run ruff format and uv run ruff check on the files."
check = "uv run pytest tests/task tests/feature tests/work_item -q -p no:cacheprovider && grep -q '^def refused' src/flowgraph/task/refusal.py && grep -q '^type StateName' src/flowgraph/task/model.py && grep -q -- '-> StateName' src/flowgraph/feature/state.py && grep -q -- '-> StateName' src/flowgraph/work_item/state.py && make lines && uv run pyright"
