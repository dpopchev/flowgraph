[project]
name = "flowgraph"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dimitar popchev", email = "dpopchev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
fgraph = "flowgraph.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

# Tool residuals live in local/cache/ (mk/python.mk): a tool with a cache key is
# pointed there here, a tool that only reads the environment in mk/python.mk.

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
# pytester: tests/test_conftest.py drives the conftest in throwaway sessions.
addopts = "-ra --doctest-modules --import-mode=importlib --strict-markers -p pytester"
# Every test carries exactly one category marker.
markers = [
  "edge: primitives to domain types and back; an adapter against a local resource",
  "model: an aggregate's rules and moves; a value object's constructor",
  "command: load-change-save with injected load, save and find",
  "view: a query or projection over primitives",
  "functional: the work item's criterion",
  "integration: the real external system; never in make test or make check",
]
cache_dir = "local/cache/pytest"

# Coverage measures only when asked (pytest --cov). Its data file is a residual
# in local/cache/; a report a person reads is an end product under build/reports/.
[tool.coverage.run]
source = ["src"]
branch = true
data_file = "local/cache/coverage/data"

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "build/reports/coverage"

[tool.coverage.xml]
output = "build/reports/coverage.xml"

[tool.ruff]
line-length = 100
cache-dir = "local/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pyright]
exclude = ["**/__pycache__", ".venv", "build", "local"]
typeCheckingMode = "standard"
reportImportCycles = "error"
venvPath = "."
venv = ".venv"
