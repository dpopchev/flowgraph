[criterion]
given = "a record with the development on and development.driver set to agent, and two work items in Backlog that each hold a Task and wait for nothing, the first with a complexity and the second with none"
when = "fgraph status is run, as text and as JSON, and fgraph start of each is run"
then = "status marks the first as able to start and not the second, and fgraph start refuses the second naming the complexity it lacks and fgraph amend --complexity; with the driver a developer both are marked and both start"

