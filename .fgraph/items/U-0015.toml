ure/amend.py, in _of_feature, the string only = \"a Feature is amended by its title, its description and its criteria\" becomes \"a Feature is amended by its title, its description, its criteria and its terms\" (FeatureAmendment takes title, description, criteria and about, the terms); the docstring of _of_feature, Every part of an amend but its title and its description is one of a work item, says its title, its description and its terms (the criteria are given beside the parts); change nothing else, in particular not NoPartError and the message amend rewrites no part of F-0001: name one, and not src/flowgraph/item/amend.py (ONLY_A_TASK). Existing tests: besides these four none changes; the check greps src and tests for the old words and must find none; if another file states them, stop and say which. README.md and docs/domain-model.md state the old words (grep -n 'its description and its criteria' README.md docs/domain-model.md) and are changed by the next Task. Out of bounds: README.md, docs/, src/flowgraph/item/amend.py, src/flowgraph/work_item/, every other file of src/ and tests/."
