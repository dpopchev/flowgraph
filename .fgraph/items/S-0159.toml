id = "S-0159"
state = "backlog"
title = "Raise the moves an agent makes as tools from none to those of its work item and its Tasks: start, hand, block, unblock, note, and the start, the block and the complete of a Task"
description = "New on the plan agreed on 2026-11-24. It waits for the two Bugs of F-0019: a server makes two writes of main at one time likelier. Its Tasks are written before its Feature starts."
