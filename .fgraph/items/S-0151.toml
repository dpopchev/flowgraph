description = "Filed on the word of the developer of 2026-11-23, picked from the map made that day of what the skills and rules of ~/.claude ask of board 1 that fgraph does not do and no Backlog item builds, so that those skills can call fgraph in its place. In board 1: board land prints run: <criterion>, which the coordinator runs at the merge and notes verified:. Its Tasks are written when it is ordered."
