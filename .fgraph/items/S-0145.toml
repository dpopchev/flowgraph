title = "Add tests/functional/test_amend_started.py and tests/functional/test_amend_started_branch.py, failing on the criterion of S-0145"
description = "Two new test files, no source change; functional, one assert per test, through run(). XFAIL = pytest.mark.xfail(strict=True, reason=\"S-0145: fgraph amend refuses every started item\"). Copy Outcome, fgraph (with its except SystemExit: until the parser takes --deviation, argparse exits 2 with an empty err) and runs from tests/functional/test_start_agent.py. Every refusal is the pair (status, err.splitlines()[-1:]). Lines: NEEDED = \"{} is started: amend it with --deviation TEXT, what changes in what it was agreed to do\"; IN_BACKLOG = \"{} is in Backlog: it has no agreed plan to deviate from -- amend it without --deviation\"; BACKLOG_ALONE = \"{} is started: its complexity, its parent and what it depends on are amended in Backlog alone\"; D = \"the then is narrowed to one kind\". Naming, because later checks select with -k: a test of the refusal for a missing deviation has the word without in its name; a test of a work item has the word story (name or class) and never feature; a test of a Feature has feature and never story (say work_item where its Story is meant); no parameter id holds without. (1) tests/functional/test_amend_started.py (about 230 lines), no git, open_git=lambda _: None, the setups of tests/functional/test_amend_work_item.py and test_amend_feature.py (ADD_STORY with description why, ADD_TASK, STARTED, BLOCK, COMPLETE). Red, each under XFAIL. Story: started, amend S-0001 --then \"a new state\" --deviation D gives (0, \"amended S-0001\\n\"); show then holds the pair of lines (bucket InProgress, then a new state) and ends with \"Knowledge (1)\\n  deviation  2026-01-01  \" + D + \"\\n\"; --title, --description, --given and --when are each taken with D (parametrized, the new line in show); a blocked Story is amended the same way; without --deviation a started and a blocked Story give (2, NEEDED for S-0001); with D, --complexity high, --parent none and --depends-on S-0002 each give (2, BACKLOG_ALONE); --deviation D alone gives amend rewrites no part of S-0001: name one; --deviation \" \" gives text is empty; a Story in Backlog with D gives IN_BACKLOG; a completed one S-0001 is completed already; amend T-0001 --title x --deviation D gives T-0001 takes no --deviation: a Task keeps no knowledge line. Feature (F-0001 with one Story started by start F-0001): amend F-0001 --title \"another title\" --deviation D gives (0, \"amended F-0001\\n\"); show starts F-0001  another title, keeps bucket InProgress and ends with the Knowledge line; --criterion with D replaces the criteria; a blocked Feature the same; without D a started and a blocked Feature give NEEDED for F-0001; a Feature in Backlog with D gives IN_BACKLOG; a completed one F-0001 is completed already. Guards, no mark: the show of a started Story and of a started Feature is the same before and after the amend refused without the text. (2) tests/functional/test_amend_started_branch.py (about 180 lines), real git: helpers and the checkout of tests/functional/test_main_scope.py for the Story (S-0001 started, its worktree), and the checkout of tests/functional/test_note_feature_branch.py for the Feature. Red: in the worktree the amend with D gives (0, \"amended S-0001\\n\", last subject chore: amend S-0001 in the record, the one file .fgraph/items/S-0001.toml, one commit more than before); on main it gives (2, S-0001 is started: its Tasks are written in its worktree, <worktree>, git status empty, last subject chore: start S-0001 in the record); on main without D it gives NEEDED (name it with without and story); after the amend in the worktree, show S-0001 on main lists the new then and the deviation; the Feature on main with D gives (0, chore: amend F-0001 in the record, .fgraph/items/F-0001.toml); in the worktree of its work item it gives F-0001 is not written here: the branch wi/<leaf> writes S-0001 alone. See each marked test xfail, then --runxfail and each fail at its assert."
check = "uv run pytest tests/functional/test_amend_started.py tests/functional/test_amend_started_branch.py -q && grep -q xfail tests/functional/test_amend_started.py && grep -q xfail tests/functional/test_amend_started_branch.py"
expected_output = "created: tests/functional/test_amend_started.py states that fgraph amend of a started (or blocked) work item and of a started (or blocked) Feature given a part and --deviation TEXT rewrites the part and keeps one deviation line on the item, listed by fgraph show under Knowledge, and that without the text it exits 2 with S-0001 is started: amend it with --deviation TEXT, what changes in what it was agreed to do, nothing written; created: tests/functional/test_amend_started_branch.py states that with the development on the amend of a started work item is one commit of its branch, made in its worktree, and is refused on main naming the worktree, and that of a started Feature is one commit on main. Each red test carries a strict xfail naming S-0145"
