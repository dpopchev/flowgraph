description = "New module src/flowgraph/development/named_files.py (about 45 lines now, about 95 after the next Task) and its tests; pure, no import but collections.abc. Docstring: the brief of a Task -- its title, its expected output and its description -- names the files its commit may change (S-0142, the scope rule 1 of board 1); the rule reads words, not intent. Two functions. path_words(text: str) -> frozenset[str]: split the text on whitespace; from each word strip, at its start, any of ( [ { < \" ' and the backtick, and at its end any of ) ] } > \" ' the backtick and , ; : . ! ?; then drop one leading ./ ; then cut the word at its first colon that a digit or a second colon follows, so src/a.py:12 and src/a.py::test_x are read as src/a.py, as governing of src/flowgraph/brief/model.py reads them; drop what is left empty. files_not_named(changed: Iterable[str], brief: Iterable[str]) -> list[str]: the words of every text of the brief together; a file, written as git writes it (from the top of the repository, / between its parts), is named when a word equals it, or a word ends in / and the file starts with that word; return the files not named, in the order given. Nothing else: no file system, no git, no knowledge of suffixes -- the words are compared to the paths git lists, so README.md or Makefile at the top is named by the bare word. Red first: add both as typed stubs raising NotImplementedError, write the tests, see each fail for its own reason, then the bodies. Tests in the new tests/development/named_files/test_files_not_named.py, pytestmark model, one assert each, two parametrized tables on files_not_named([file], [text]). Named, the result []: (\"changed: src/a.py\", \"src/a.py\"); (\"`src/a.py`,\", \"src/a.py\"); (\"(src/a.py)\", \"src/a.py\"); (\"in src/a.py.\", \"src/a.py\"); ('\"src/a.py\";', \"src/a.py\"); (\"<src/a.py>:\", \"src/a.py\"); (\"./src/a.py\", \"src/a.py\"); (\"one\\nsrc/a.py\\ntwo\", \"src/a.py\"); (\"the README.md\", \"README.md\"); (\".gitignore\", \".gitignore\"); (\"tests/unit/\", \"tests/unit/a/test_x.py\"); (\"(tests/unit/).\", \"tests/unit/a/test_x.py\"); (\"src/a.py:12\", \"src/a.py\") -- a line number after a colon is cut; (\"src/a.py::test_x\", \"src/a.py\"); (\"`src/a.py:12`,\", \"src/a.py\"). Not named, the result [file]: (\"\", \"src/a.py\"); (\"an output\", \"work.txt\"); (\"a.py\", \"src/a.py\") -- a bare name names a file at the top alone; (\"src/a.py:x\", \"src/a.py\") -- a colon before a letter is kept; (\"src/a.py\", \"src/a.pyc\"); (\"tests/unit\", \"tests/unit/a.py\") -- a directory is named by its trailing slash; (\"tests/unit/\", \"tests/unit_more/a.py\"); (\"SRC/A.PY\", \"src/a.py\"); (\"/home/src/a.py\", \"src/a.py\"); (\"src/*.py\", \"src/a.py\") -- no pattern is read; (\"src\\\\a.py\", \"src/a.py\"); (\"./ / .\", \"a.txt\"). Then: files_not_named([\"docs/m.md\", \"src/a.py\", \"other.txt\"], [\"Change src/a.py\", \"an output\", \"\"]) == [\"docs/m.md\", \"other.txt\"]; a file named in one text of three is named whichever text holds it (parametrized on the place); no file changed gives []. Out of bounds: every other file of src/ and of tests/; tests/functional/test_complete_named_files.py keeps its xfail marks."
