description = "Today (2026-11-24, a throwaway git repository with the development on, S-0001 started, terms gate and lane on main): in the worktree project.worktrees/S-0001-raise-the-stories-fgraph, fgraph relate gate part-of lane prints `fgraph: error: gate is not added here: the branch wi/S-0001-raise-the-stories-fgraph writes S-0001 alone`, exit 2 (no test states it); fgraph add term other --means m there prints `fgraph: error: other is not added here: ...` (tests/functional/test_term_worktree.py states it) and on main fgraph relate gate part-of lane prints `related gate part-of lane`. Files this Task may change: src/flowgraph/development/scope.py (240 lines on 2026-11-24, 242 after; make lines holds 250), tests/development/scope/test_scope.py (161 lines, about 195 after), tests/functional/test_term_worktree.py (145, about 175 after). Red first: write the three tests below and see them fail for the reason in their name before the source changes: the printed word is added, not related. Source: in within of src/flowgraph/development/scope.py (grep -n 'is not added here'), the inner save_term, inside `if scope is not None:`, reads whether the term is held and words the verb: held = term.name in store.terms.find_term_names(); what = \"related\" if held else \"added\"; raise OutOfScopeError(f\"{term.name} is not {what} here: {_alone(scope)}\"). A term saved that the record holds is a relation (add_term_item refuses a name held, so only relate_term_item saves one); the read is made on the refusal path alone, so a save on main asks for nothing; update the docstring of within in one clause (a term is refused as added or, when the record holds it, as related). Tests in tests/development/scope/test_scope.py (marker command is its pytestmark, one assert each; add the imports from flowgraph.record.store import TermStore and from flowgraph.term import Term, make_term; GATE = make_term(\"gate\", \"a check\", CREATED); replace is imported; never and store() are there): (a) test_a_term_the_record_holds_is_refused_as_related_naming_the_owner_of_the_branch: within(replace(store([]), terms=TermStore(never, saved.append, lambda: [\"gate\"])), lambda: SCOPE, never).save_term(GATE) raises OutOfScopeError matching rf\"^gate is not related here: the branch {BRANCH} writes S-0001 alone$\" (saved: list[Term] = []); red. (b) test_a_term_the_record_holds_none_of_is_refused_as_added_naming_the_owner_of_the_branch: the same with lambda: [] and the message gate is not added here: ...; guard, passes today. (c) test_a_term_refused_is_not_saved: with the held case, saved == [] after the pytest.raises block, as test_the_settings_refused_are_not_saved does; guard. (d) test_a_branch_no_work_item_owns_saves_a_term: scope lambda: None, saved == [GATE]; guard. To see (a) fail for its reason and the guards mean something, run them before the source edit: (a) must print `gate is not added here` in the failure. Test in tests/functional/test_term_worktree.py (marker functional is its pytestmark; copy nothing, the fixtures checkout, fgraph, Outcome, WORKTREE, BRANCH are there): a constant RELATE = [\"relate\", \"gate\", \"part-of\", \"lane\"]; a class TestATermRelatedOnTheBranchOfAWorkItem after TestATermAddedOnTheBranchOfAWorkItem, its fixture refused = fgraph(RELATE, tmp_path / WORKTREE); test_exits_with_two (status == 2), test_names_the_work_item_the_branch_owns_and_says_the_term_is_not_related (refused.err.endswith(f\"fgraph: error: gate is not related here: the branch {BRANCH} writes S-0001 alone\\n\")), test_writes_no_relation ('lane' not in (tmp_path / 'project' / '.fgraph' / 'terms' / 'gate.toml').read_text(encoding='utf-8')); say the relate in the module docstring (a term added or related on its branch is refused naming the work item the branch owns). Run the class before the source edit: only the second test fails (it prints added), the first and the third pass today as guards of the arrangement. Existing tests: none changes; tests/functional/test_term_worktree.py keeps its add term case (other is not added here) and tests/functional/test_relate_terms.py and tests/functional/test_term_refused.py keep passing; if one fails, stop and say which. Out of bounds: docs/ (the next Task), README.md, src/flowgraph/term/, src/flowgraph/record/, src/flowgraph/parser/, src/flowgraph/cli.py, every other file of src/ and tests/."
