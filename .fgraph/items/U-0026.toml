description = "A move with no change of behavior: no new test, no test file changed, the suite is the guard (3484 tests pass on main today). Change src/flowgraph/status/text.py (226 lines, about 90 after) and create three modules beside it. (1) New src/flowgraph/status/buckets.py (about 45 lines), docstring: the buckets of the flow, their names and the states listed in each. It holds BACKLOG_BUCKET = \"Backlog\", IN_PROGRESS_BUCKET = \"InProgress\", COMPLETED_BUCKET = \"Completed\", REMOVED_BUCKET = \"Removed\"; BUCKETS (text.py lines 17-23) built from those names, the same states in the same order; APART = REMOVED_BUCKET (lines 25-26); is_listed_in (lines 75-83) as it is. It imports FeatureRow and WorkItemRow alone. (2) New src/flowgraph/status/work_item_lines.py (about 85 lines), docstring: the lines status writes for one work item with its Tasks being worked, and the words of a wait and of a block. Moved as they are and renamed public, since another module calls them: _status_line becomes work_item_lines(row: StoryRow | UpkeepRow) -> str (lines 186-214); _waiting becomes waiting_line(line, waits_for, *, next_up=False) (130-138); _marked becomes blocked_line(line, block) (141-144); _block_text becomes block_text(waiting_on, reason) (147-149); _task_line stays private (217-226); COMPLETED, the state of a completed Task (31-32), moves with them. BLOCKED of text.py (28-29) is dropped: import BLOCKED from flowgraph.work_item, which exports the same word. (3) New src/flowgraph/status/feature_lines.py (about 65 lines), docstring: the lines status writes for one Feature with the work items listed under it. _feature_lines becomes feature_lines(feature: FeatureRow) -> str (97-127), calling work_item_lines, waiting_line and blocked_line; _waited_on stays private (152-167), BLOCKED from flowgraph.work_item. (4) text.py keeps its docstring, CUT, status_text, cut_lines, _item_lines (calling feature_lines and work_item_lines) and _top_of, and imports APART, BUCKETS and is_listed_in from buckets. Docstrings move with their functions, reworded only for the new names. (5) Importers, one line each: src/flowgraph/status/document.py (149 lines) takes BUCKETS and is_listed_in from flowgraph.status.buckets; src/flowgraph/status/show.py (148) takes BUCKETS from buckets and BLOCKED from flowgraph.work_item; src/flowgraph/status/__init__.py (57) takes APART and BUCKETS from buckets, cut_lines and status_text still from text, its __all__ unchanged; src/flowgraph/graph/view.py (161, line 23) and src/flowgraph/brief/document.py (130, line 18) take BUCKETS from flowgraph.status.buckets; src/flowgraph/status/next.py (223, about 221 after) drops its own BACKLOG_BUCKET and imports the one of buckets. Imports stay acyclic: buckets and work_item_lines import nothing of text, feature_lines imports work_item_lines, text imports the three; pyright refuses a cycle (reportImportCycles). Out of bounds: src/flowgraph/status/view.py (the next Task), every file under tests/, any printed character, README.md and docs/ (neither names these modules). tests/status/test_output.py imports cut_lines from flowgraph.status.text and must pass untouched."
