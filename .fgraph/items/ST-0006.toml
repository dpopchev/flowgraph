id = "ST-0006"
state = "backlog"
title = "Raise the kinds of work item fgraph takes from Backlog to Completed from 2 to 3: Bug"
description = "Feature: a project tracks every kind of its work with fgraph; its criterion 3: a developer adds a Bug with what is observed and what is expected, writes its Tasks and takes it from Backlog to Completed with their commits. Ordered after U-0002, so a Bug adds its id and its criterion to the shared work item. Its Tasks are written when it is ordered."
created = 2026-11-21 07:18:43+00:00

[criterion]
given = "a started Bug whose Task is completed"
when = "the Bug is completed with a commit"
then = "fgraph status lists it under Completed with that commit"
