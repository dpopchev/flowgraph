id = "ST-0045"
state = "backlog"
title = "Raise the keys of the configuration fgraph shows and sets from none to every one"
description = "Part of the developer's request of 2026-11-21 to layer fgraph by a configuration, .fgraph/config.toml: (1) the items and their lifecycle, always; (2) their commits on main, optional; (3) the development beside the source code, turned on. The plan was shown and filed on the developer's 'file only' of 2026-11-21. Its Tasks are written when it is ordered. Reading of the agent: until this Story config.toml is written by hand; fgraph config show lists every key with its value, a key the file lacks at its default, and fgraph config set writes one key and commits the file as any write of the record."
parent = "F-0001"
created = 2026-11-21 20:32:55+00:00

[criterion]
given = "a record without config.toml"
when = "fgraph config set development.enabled true is run"
then = "fgraph config show lists development.enabled as true"
