id = "ST-0013"
state = "backlog"
title = "Cut the Tasks of one work item that can be started at once from any number to 1"
description = "Gap found during U-0002: T-0031 and T-0032 were started at once, and fgraph start takes a second Task today. New rule, agreed by the developer on 2026-11-21: one work item holds at most one started Task; a blocked Task does not count. Ordered after ST-0011 and ST-0012, since without block the reorder of U-0002 (T-0032, T-0034, then T-0031) would have had no legal path. It adds the rule to docs/domain-model.md, Rules. Its Tasks are written when it is ordered."
created = 2026-11-21 08:06:52+00:00

[criterion]
given = "a started Story with one started Task and one Task in Backlog"
when = "fgraph start is run on the second Task"
then = "it exits 2 and names the started Task"

[[tasks]]
id = "T-0077"
state = "backlog"
title = "Add tests/functional/test_one_started_task.py, failing on the criterion of ST-0013"
description = "Run through run() of src/flowgraph/cli.py on a record in tmp_path, through the file adapters, as tests/functional/test_block_task.py does. Seen red, then marked a strict xfail naming ST-0013 until the Task that turns it green removes the mark. The rule is the developer's, agreed on 2026-11-21: one work item holds at most one started Task; a blocked Task does not count. The agent's readings, each a routine call: (1) a start refused reads '<task> cannot start: <started task> is started -- complete or block it first', exit 2, nothing written. (2) An unblock makes a Task started, so it is refused the same way while another Task is started: '<task> cannot be unblocked: <started task> is started -- complete or block it first'. (3) The refusal of the Task's own move comes first: a Task started already, blocked or completed says so. (4) A file of a started work item that holds two started Tasks is refused when it is read, naming them, since no move reaches it."
expected_output = "created: tests/functional/test_one_started_task.py states that fgraph start on a second Task of a started Story that holds one started Task exits 2 and names the started Task"
created = 2026-11-21 11:33:19+00:00

