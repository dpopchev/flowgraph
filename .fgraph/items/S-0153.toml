put 'created: the tests under tests/unit/', changed tests/unit/a/test_x.py and other.txt: out is other.txt alone. (d) test_a_file_named_by_the_title_or_the_description_is_not_listed, parametrized with ids title and description: title 'Change src/named.py' with description '', and title 'a title' with description 'the file src/named.py (12 lines).', output 'an output' in both; changed src/named.py and other.txt: out is other.txt alone. (e) test_a_file_of_the_record_is_not_listed: output 'an output'; append the line '# a note' to .fgraph/config.toml of the worktree (tracked, and still a valid configuration) and write other.txt: out is other.txt alone. (f) test_run_on_main_it_lists_the_files_of_the_worktree: as (a), with not_named run in tmp_path / 'project': out is other.txt alone. (g) test_with_format_json_it_prints_a_json_list: as (a), not_named(worktree, '--format', 'json'): out is '[\"other.txt\"]' and a newline. (h) test_a_clean_worktree_lists_nothing: output 'an output', nothing changed: (status, out) is (0, ''). (i) test_a_work_item_with_no_started_task_is_refused: started_task(tmp_path, 'an output', start_task=False): the pair (status, err.splitlines()[-1:]) is (2, ['fgraph: error: S-0001 has no started Task: --not-named reads the brief of the Task started']). (j) test_a_record_outside_a_git_work_tree_is_refused: in tmp_path, no git and no config.toml, run ADD_STORY, add task a title --parent S-0001 --output 'an output', start S-0001 and start T-0001, all in tmp_path, then not_named(tmp_path): (2, ['fgraph: error: S-0001 has no files changed to read: the record is not inside a git work tree']). Guards, no mark, passing today and after: (k) test_it_writes_nothing: as (a), the pair (git rev-parse HEAD, git status --porcelain) of the worktree is the same before and after not_named; (l) test_the_brief_without_the_option_prints_as_before: fgraph brief S-0001 run in the worktree of (a) exits 0 with an output that starts with the output of fgraph show S-0001 run ther