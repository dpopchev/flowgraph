title = "Give the run() call of each functional test file that completes a checked Task its own runner of the check"
description = "Test files only: no source change, no new test, no test renamed. The check is a probe: it replaces, in memory and for that one process, the default of run_check of run() by a runner that fails the test asking for it, then runs tests/functional/ without the file of the first Task; no file is written by it. Red first: run the check before any edit and see it fail, on main today with 34 failed and 134 errors, 168 tests in the 22 files below (about 5 minutes); it exits 0 once each gives its runner. The edit is the same in each file, one line: in its one call of run(), inside its helper fgraph, add run_check=lambda command, directory: 0, right after load_config=read_config, -- or right after run_gate=run_gate, in the two files that give a gate. Nothing else changes: the --check make test of each add stays (tests/functional/test_show_worktree.py asserts the line check make test), no import is added, no docstring, no fixture. The 22 files, with their lines today, each one more after (the four B-0029 corrects first hold a few more by then): tests/functional/test_block_feature_branch.py (188), test_block_work_item_branch.py (192), test_commit_writes.py (232), test_complete_feature_branch.py (182), test_complete_without_commit.py (163), test_hand.py (242), test_hand_refused.py (161), test_ignored_record.py (147), test_ignored_record_branch.py (203), test_land_delivered.py (285, gives run_gate), test_land_gate.py (220, gives run_gate), test_land_merge.py (306), test_land_push.py (156), test_land_push_refused.py (235), test_land_work_item.py (238), test_release.py (139), test_release_feature_close.py (203), test_show_worktree.py (129), test_start_agent.py (204), test_start_next_branch.py (346), test_status_review.py (206), test_status_worktree.py (132), all under tests/functional/. A file under tests/functional/ that the check still names after these 22 was added by a work item landed since this brief was written (test_watch_worktree.py, test_block_task_branch.py, test_start_branch_there.py, test_goal_planned.py are the candidates): give its run() call the same one line and name the file in the commit; that is the one exception to the list. Leave alone: tests/functional/test_complete_task_check.py and test_complete_commit_held.py, which give run_check=run_gate and run their checks through the shell; tests/functional/test_run_check_default.py; the 19 files that add a Task with --check and never complete it (test_add_task_check.py, test_planned_start.py and the like), which the probe does not name; every file under src/; the docs."
