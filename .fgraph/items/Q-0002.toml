id = "Q-0002"
state = "backlog"
title = "Settle whether fgraph serves its commands as tools over stdio with no new runtime dependency, one server writing both main and the worktree of a work item"
description = "New on the plan agreed on 2026-11-24, the first work item of F-0022. Its decision names: the server written by hand or on the mcp package, as a dependency or as an extra; where a call is written, by the directory it names or by one server per worktree (docs/domain-model.md, Persistence, who writes what); and the client the probe was run with. Its Tasks are written before its Feature starts."
parent = "F-0022"
complexity = "medium"
created = 2026-11-24 19:51:42+00:00

[criterion]
hypothesis = "Can one stdio server of the Model Context Protocol, written on the standard library and pydantic alone, list the commands of fgraph as tools and make both the writes of main and those of the worktree of a work item?"

[[tasks]]
id = "T-0697"
state = "backlog"
title = "Record in docs/domain-model.md the messages Claude Code sends a stdio server of the Model Context Protocol and the replies it takes, run against a probe of fgraph"
description = "One file: docs/domain-model.md (3371 lines on 2026-11-25); find the place by grep -n '^## Evidence' docs/domain-model.md, never by line number; plain ASCII; no change under src/ or tests/. The probe is a throwaway, never committed: write it under local/scratch/q2/ (local/ is in .gitignore) and run it with uv run python, the standard library and pydantic alone (pyproject.toml: the runtime is pydantic and tomli-w); install nothing. It is a stdio server: it reads one JSON-RPC 2.0 message a line on stdin and writes one reply a line on stdout, nothing else on stdout, and logs every line read and every reply written to a file of its own under local/scratch/q2/, since the client keeps its stderr. It answers initialize (the protocolVersion asked when it is one of 2025-11-25, 2025-06-18, 2025-03-26 and 2024-11-05, else 2025-11-25; capabilities {tools: {}}; serverInfo {name: fgraph, version}), ping ({}), tools/list and tools/call, gives a notification no reply, and answers any other method with the error -32601 Method not found and the id of the request; its tools run fgraph in process -- run() of src/flowgraph/cli.py with the effects main() gives it but width and height, write and write_error appended to lists -- in the directory a call names: status (argv status --format json, the argument directory) and start (directory, id, and an optional agent written by pydantic as agent: str | None = None, so model_json_schema writes it as anyOf string and null), each inputSchema the model_json_schema() of a pydantic model with extra forbid; a call whose run exits 2 is answered {content: [{type: text, text: <the last line of its error output>}], isError: true}. The client is Claude Code, run in print mode with a config file of its own and nothing of the configuration of the developer: write local/scratch/q2/mcp.json holding {mcpServers: {fgraph: {type: stdio, command: <a script that runs the probe>, args: []}}} and run, in a throwaway record under local/scratch/q2/ (git init, a config.toml with [development] enabled = true committed, a Story with a Task), claude -p <a prompt asking it to call mcp__fgraph__status with that directory, then mcp__fgraph__start of S-0009, which the record does not hold, and to say what each answered> --mcp-config local/scratch/q2/mcp.json --strict-mcp-config --allowedTools mcp__fgraph__status mcp__fgraph__start --model haiku --output-format json < /dev/null; never claude mcp add, which writes the configuration of the developer. claude mcp --help lists add, add-json, get, list, remove and serve; claude mcp add NAME -- COMMAND ARGS adds a stdio server, scope local by default. Run once more with the directory of the checkout of flowgraph itself, whose fgraph status --format json printed 384268 bytes on 2026-11-25, and write what the session was given (whole, cut, refused; the variable MAX_MCP_OUTPUT_TOKENS of Claude Code bounds it: find its default in the documentation of Claude Code, else say it is not known). Then drive claude mcp serve, the server of Claude Code itself, from a python script that writes initialize (once with 2025-06-18, once with 1999-01-01), notifications/initialized, tools/list, an unknown method, a tools/call of an unknown tool and of a tool with arguments its schema refuses, and write each reply. Seen by the coordinator's probe on 2026-11-25 with claude 2.1.331 -- confirm each, or write what differs: the client first sends server/discover with the string id server-discover-probe-1 and _meta naming the protocol version 2026-07-28, takes the error -32601 and falls back to initialize, sent with the id 0 (an id that is 0 is a request, never a notification) and protocolVersion 2025-11-25; then notifications/initialized, tools/list with id 1, and tools/call whose params hold _meta (claudecode/toolUseId and progressToken), which a server ignores; at the end it closes stdin and the server exits 0. claude mcp serve answered 2025-06-18 with 2025-06-18 and 1999-01-01 with 2025-11-25, capabilities {tools: {listChanged: true}}, an unknown method -32601, an unknown tool the JSON-RPC error -32603, refused arguments and a failed tool a result with isError true, and a success {content: [{type: text, text}]} with no isError. Write each message and each reply as a short sh block of the JSON, cut to its keys where long. Out of bounds: every file under src/ and tests/, README.md, the configuration of claude (~/.claude.json, .mcp.json of any repository)."
check = "grep -q '^## Tools over stdio' docs/domain-model.md && grep -q '^### Wire' docs/domain-model.md"
expected_output = "changed: docs/domain-model.md gains the section ## Tools over stdio, right before ## Evidence, opening with the hypothesis of Q-0002, and its first part ### Wire: each message Claude Code sent a probe server over stdio, in the order sent and as logged -- the method, the id and its type, the protocolVersion asked, the params a server must read -- the reply the probe gave to each and what the client did next; how the session ends (stdin closed, the exit status of the server); a tool whose schema pydantic writes, an optional argument among them, listed and called with and without it; a tool error (isError) as the model is given it; a result of about 384 KB (fgraph status --format json of this repository) and what the client does with it; the replies of claude mcp serve to the same requests as a second reference; the version of claude each was run with"
created = 2026-11-24 23:43:50+00:00
