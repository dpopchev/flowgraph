]

[[knowledge]]
kind = "decision"
text = "The developer decided on 2026-11-22, answering the open question of T-0292: a term is written on main alone, and the worktree of a started work item reads the terms of main, as Task ids are read across worktrees, so a term added on main after a branch was cut can be named with --about on that branch."
