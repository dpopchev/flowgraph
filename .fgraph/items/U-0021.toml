description = "The red proof of the unit tests T-0347 wrote after its code (S-0088). Files: tests/task/test_task_check.py (57 lines), tests/work_item/test_work_item_task_check.py (74 lines) and tests/development/task_check/test_task_check.py (57 lines), the only files committed; the sources below are changed in the worktree for one run each and put back, never committed. How each behavior is taken out, in turn: with Edit, in the worktree, exactly as said, never staged or committed; then uv run pytest <its test file> -q -p no:cacheprovider -rf and read the names of the tests that fail; then git restore -- <the source file> and see git diff --quiet HEAD -- src pass before the next one. A behavior is proven when a test of that file fails by name for it -- its assert, or an error raised in its body -- never by an error of collection or of an import: a mutation that does not import is a wrong mutation, redo it. A mutation is one change; two holds of one behavior are taken out together where said. Probed by the coordinator's agent on 2026-11-24 in a scratch copy of 2cddaf4: every behavior failed a test of its file but the two marked SURVIVED; run each again, the code may have moved. tests/task/test_task_check.py, behaviors of src/flowgraph/task/model.py (216 lines) and src/flowgraph/task/moves.py (164 lines): (1) make_task keeps the check -- kept = None in place of its line -> test_every_move_of_a_task_carries_its_check[backlog] to [done] and test_the_row_of_a_task_reads_its_check; (2) make_task refuses a blank check -- check in place of said('check', check) -> test_a_blank_check_is_refused_by_name, its three cases; (3) make_task holds None without a check -- '' in place of None in kept = None if check is None -> test_a_task_made_with_no_check_holds_none; (4) started carries the check -- check=None in its StartedTask -> [started] and every later state; (5) blocked carries it -- None in place of task.check, its last argument -> [blocked] and [unblocked]; (6) unblocked carries it -- None in place of task.check in its StartedTask -> [unblocked]; (7) completed carries it -- None in place of task.check -> [done]; (8) removed carries it -- None in place of task.check in its RemovedTask -> SURVIVED in this file, MOVED holding no removed Task (the suite catches it elsewhere, in tests/task/test_task_remove.py, test_a_task_in_backlog_is_removed_with_its_reason_its_check_and_its_time_to_the_second); (9) row_of reads the check -- check='' in place of check=task.check or '' -> test_the_row_of_a_task_reads_its_check; (10) row_of reads no check as '' -- check=task.check -> test_the_row_of_a_task_with_no_check_reads_none. tests/work_item/test_work_item_task_check.py, behaviors of src/flowgraph/item/task_file.py (223 lines): (11) task_primitives writes the check -- checked = {} -> test_a_task_with_its_check_reads_back_whole_in_any_state, its four cases, and test_the_detail_of_a_work_item_lists_the_check_of_its_task; (12) backlog_task reads it -- None in place of held.check -> the same five; (13) task_row lists it -- check='' in place of check=held.check or '' -> test_the_detail_of_a_work_item_lists_the_check_of_its_task; (14) a table with no check reads -- the field check of TaskFile loses its default None -> test_a_file_whose_task_holds_no_check_reads_with_none; (15) to (18) the tables of a started, a blocked, a completed and a removed Task hold a check -- the field check deleted from StartedTaskFile, BlockedTaskFile, CompletedTaskFile, RemovedTaskFile in turn (extra=forbid refuses the table written) -> [started], [blocked], [done], and for RemovedTaskFile SURVIVED in this file, no case writing a removed Task (the suite catches it elsewhere, in tests/work_item/test_work_item_file.py, test_a_work_item_in_any_state_reads_back_whole). tests/development/task_check/test_task_check.py, behaviors of src/flowgraph/development/task_check.py (59 lines): (19) check_task_checked refuses no check with the development on -- its if and raise deleted -> test_no_check_with_the_development_on_is_refused_naming_the_flag; (20) check_task_checked refuses a check with it off -- its call of _refuse_check_off deleted -> test_a_check_with_the_development_off_is_refused_naming_the_key; (21) check_task_amended refuses a check with it off -- its call deleted -> test_an_amend_giving_a_check_with_the_development_off_is_refused_with_the_whole_line; (22) _refuse_check_off lets no check pass -- check is not None and deleted from its if -> [none-off] and test_a_task_added_the_way_the_development_asks_is_taken[None-False]; (23) it lets a check pass with the development on -- and not development_on deleted -> [given-on] and the case make test with True; (24) the refusal names the key and the file -- turn_on = 'turn it on' -> the two tests of a check with the development off. The tests to rewrite, red first: with (8) in, tests/task/test_task_check.py: MOVED gains removed(BEGUN, 'a reason', ON), removed imported from flowgraph.task, and the ids gain 'removed' -- see [removed] fail with (8) in and pass with it out; with (18) in, tests/work_item/test_work_item_task_check.py: GONE = removed_task(HALF, make_task_id(3), 'a reason', ON), removed_task imported from flowgraph.work_item, joins the parametrize of test_a_task_with_its_check_reads_back_whole_in_any_state with the id 'removed' -- see it fail with (18) in and pass with it out. If another behavior survives when run, add or rewrite the one test of its file that states it, red with the mutation in, and say so; if one of these two fails already, rewrite nothing for it and say so. Commit the test files in one commit, then What is committed besides any test: one finding per test file, written in the worktree with uv run fgraph note U-0021 --finding TEXT --governs <the test file> (fgraph commits it on the branch, a commit of the record alone), TEXT starting with the words red proof of U-0021 and going on: with each behavior taken out in turn, a test of this file failed by name -- then, for each behavior, its function, how it was taken out and the test or tests that failed, separated by semicolons, and, for a test added or rewritten, its name and the commit; so fgraph about <the test file> lists the proof under Governed by, and the brief of any later Task naming the file shows it. Last, with every behavior back, make check passes and git diff --quiet HEAD -- src holds. Complete the Task at the commit of the tests. Out of bounds: every file of src/ in a commit, every other test file, the docs."
