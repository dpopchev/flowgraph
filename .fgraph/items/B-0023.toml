lopment/land/test_land.py and of tests/development/land/test_land_tag.py add upstream=lambda _: (\"origin\", \"refs/heads/main\") as the last step, noted in no list of steps (a read, as find_branches); nothing else changes in those two files in this Task. Step 2, the check. Add to delivery.py, above pushed, a typed stub def check_main_tracked(item: str, work_tree: WorkTree) -> None that raises NotImplementedError; write tests/development/delivery/test_main_tracked.py, command as its pytestmark, its work tree a WorkTree whose every step is a never that raises AssertionError and whose landing is dataclasses.replace(NO_LANDING, upstream=<fake>), NO_LANDING imported from flowgraph.development.commit. Three tests: with a fake answering (\"origin\", \"refs/heads/main\") the check returns None; with a fake raising GitError(\"main tracks no branch of a remote to push to\") it raises LandError matching the whole line of the output above, ^ to $, through re.escape; the fake is asked for \"main\" alone (a list it appends to equals [\"main\"]). See each fail on NotImplementedError, then write the body: try work_tree.landing.upstream(MAIN), and on GitError raise LandError(f\"{item} cannot land: {error} -- run git push --set-upstream <remote> {MAIN}, or fgraph config set {DELIVERY_PUSH} false\") from the error, the try over that one statement. Imports: LandError from flowgraph.development.way (way.py does not import delivery.py, the imports stay acyclic) and DELIVERY_PUSH from flowgraph.record. Its docstring says it is checked before a landing that pushes merges, and names the LandError; the module docstring of delivery.py gains one sentence on it. Out of bounds: src/flowgraph/development/land.py (the wiring is the next Task), git.py, way.py, tag_git.py, release.py, src/flowgraph/parser/ (LandError is in REFUSED of refusals.py already), every functional test, README.md, docs/."
