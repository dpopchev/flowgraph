g, unblock_first, the three names added to __all__ in its sorted order (ruff RUF022). Red first: the three functions as typed stubs raising NotImplementedError, the tests seen failing for that reason, then the bodies. Tests, model as the pytestmark of tests/task/test_task_block.py, one assert each, new tests/task/refusal/test_refusal_words.py (about 30 lines), each comparing (type(error), str(error)): completed_already('T-0001') gives (CompletedAlreadyError, 'T-0001 is completed already'); completed_already('S-0002', 'F-0001 cannot be removed: ') gives (CompletedAlreadyError, 'F-0001 cannot be removed: S-0002 is completed already'); in_backlog('F-0001') gives (NotStartedError, 'F-0001 is in Backlog: start it first'); unblock_first('S-0003') gives (BlockedError, 'S-0003 is blocked: unblock it first'). Existing tests: none changes; if one fails, stop and say which. Out of bounds: every other file of src/ and tests/, the docs; run uv run ruff format and uv run ruff check on the files."
