id = "S-0150"
state = "backlog"
title = "Raise the branches of a started work item that take the commits of main by one command of fgraph from none to every one"
description = "Filed on the word of the developer of 2026-11-23, picked from the map made that day of what the skills and rules of ~/.claude ask of board 1 that fgraph does not do and no Backlog item builds, so that those skills can call fgraph in its place. In board 1: board sync-main, which a lane runs when another work item landed first. Its Tasks are written when it is ordered."
complexity = "medium"
created = 2026-11-23 20:39:20+00:00
depends_on = [
    "U-0025",
]

[criterion]
given = "a repository with the development on, a started work item in its worktree and a main that moved since its start"
when = "the command is run in the worktree of the work item, with a main it merges cleanly and with one it conflicts with"
then = "the first leaves the branch holding main, by one merge commit; the second leaves the branch and the work tree as they were and exits 2 naming the files in conflict"
