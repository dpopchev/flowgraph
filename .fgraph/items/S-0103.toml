description = "Two new test files, no source change; functional as pytestmark, one assert per test. XFAIL = pytest.mark.xfail(strict=True, reason=\"S-0103: fgraph note takes no --supersedes\") in each. Every red test reads a record on which a note with --supersedes has run, so none passes before Task 4. (1) tests/functional/test_note_supersedes.py (about 190 lines): Outcome and fgraph(argv, cwd, day) as tests/functional/test_note_mark.py has them (open_files, no git, SystemExit caught). FIRST = (1, note S-0001 --decision \"keep one store\"); LATER = (2, note S-0001 --decision \"keep one file per item\" --supersedes S-0001#1); REFUSAL = \"fgraph: error: --supersedes names {}, which is no knowledge line of the record: fgraph knowledge lists each line with its ref\". Red tests after add story, FIRST, LATER: the pair (status, out) of LATER is (0, \"noted S-0001\\n\"); show S-0001 ends with \"Tasks (0)\\nKnowledge (2)\\n  decision  2026-01-01  keep one store  (superseded by S-0001#2)\\n  decision  2026-01-02  keep one file per item\\n\"; fgraph knowledge prints \"2026-01-02  decision  S-0001#2  keep one file per item\\n2026-01-01  decision  S-0001#1  keep one store\\n\"; of the file .fgraph/items/S-0001.toml read with tomllib, the pair (keys of knowledge[0], knowledge[1][\"supersedes\"]) is ({\"kind\", \"text\", \"noted\"}, [\"S-0001#1\"]); fgraph brief S-0001 holds the line ending (superseded by S-0001#2). With a second Story and note S-0002 --finding \"one file each\" --supersedes S-0001#1 in place of LATER: the pair (status, text of S-0001.toml equal to its text before the note) is (0, True); show S-0001 holds \"  decision  2026-01-01  keep one store  (superseded by S-0002#1)\\n\". With a Feature: note F-0001 --decision \"ship in two steps\", then note F-0001 --decision \"ship in one\" --supersedes F-0001#1: show F-0001 holds \"ship in two steps  (superseded by F-0001#2)\\n\". Spelled: --supersedes s1#1 gives the same show as LATER. A third line that names S-0001#1 too: the first line ends (superseded by S-0001#2, S-0001#3). Two refs on one note, --supersedes S-0001#1 --supersedes S-0001#2 on a third line: both earlier lines end (superseded by S-0001#3). Refusals, parametrized over S-0001#9, S-0009#1, S-0001, T-0001#1, x, each after FIRST: the triple (status, last error line, last line of show S-0001) is (2, REFUSAL with the ref as typed, \"  decision  2026-01-01  keep one store\"). Guards, no xfail: after FIRST alone show ends \"  decision  2026-01-01  keep one store\\n\"; after add story, FIRST and LATER run or refused, fgraph brief S-0001 starts with the output of fgraph show S-0001. (2) tests/functional/test_note_supersedes_worktree.py (about 130 lines): copy from tests/functional/test_note_about_worktree.py Outcome, fgraph (add the SystemExit catch), git, IDENTITY, the autouse fixture environment, NOW, CRITERION. Fixture checkout: git init on main, config [development] enabled = true committed, then add story \"a title that stands\", add story \"Raise the Stories fgraph lists from 0 to 1\", add task under S-0002 with --output and --check make test, note S-0001 --decision \"keep one store\", start S-0002. WORKTREE = project.worktrees/S-0002-raise-the-stories-fgraph. Fixture noted: in the worktree, note S-0002 --decision \"keep one file per item\" --supersedes S-0001#1. Red tests: (status, out) is (0, \"noted S-0002\\n\"); in the worktree the pair (git log -1 --format=%s, git show --name-only --format= HEAD) is (\"chore: note S-0002 in the record\", \".fgraph/items/S-0002.toml\"); the triple (noted.status, git status --porcelain on main, text of S-0001.toml on main equal to before) is (0, \"\", True); fgraph show S-0001 run on main holds \"  decision  2026-01-01  keep one store  (superseded by S-0002#1)\\n\"; the same run in the worktree holds it too. See each marked test xfail and each guard pass. Out of bounds: src/, every other test, the docs."
