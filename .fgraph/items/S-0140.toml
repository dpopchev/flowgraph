state = "backlog"
title = "Add tests/functional/test_land_push_refused.py, failing on the criterion of S-0140"
description = "Run through run() of src/flowgraph/cli.py. Copy the helpers Outcome, fgraph, git, environment and origin from tests/functional/test_land_push.py, and its ready with one more argument, the text of the [development] table, so a test names its way of merging; WAYS and WAY_IDS as tests/functional/test_land_gate.py writes them, the land of a fast-forward taking no --message. A fixture refused: ready with push = true, git remote set-url origin to tmp_path / \"gone.git\", then the land; the sha is git rev-parse --short main read after it. Classes and tests: TestALandingWhosePushIsRefused -- exits with two; the output of show S-0001 holds the line bucket       InProgress; git log -1 --format=%s main is feat: land the first Story; git branch --list \"wi/S-0001-*\" is not empty; the error output ends with the line above and a newline. TestTheLandingTakenUpOnceTheOriginIsBack, its fixture the refused one with the url put back and the land run again -- (status, out) is (0, landed S-0001 at <sha>, then pushed main to origin, each on its line); show lists Completed; main of the origin is main of the checkout; the subject of main of the origin is chore: complete S-0001 in the record; no branch wi/S-0001-* is left. test_a_landing_taken_up_completes_by_each_way, parametrized on WAYS, one assert on (status, out) of the second land. TestAStoryWhoseBranchIsMergedByHand, with no [delivery] table: git merge --no-ff --quiet --message \"feat: merge by hand\" of the branch in the checkout, then the land -- (status, out) is (0, landed S-0001 at <short sha of that merge>); show lists Completed. Every test is red today: a refused push leaves the Story Completed and the second land says S-0001 has no branch wi/S-0001-* to land; a branch merged by hand is refused as bringing nothing to merge. Each carries its own strict xfail naming S-0140, the parametrized one through the marks of pytest.param. See each marked test xfail before the commit; where one passes today, stop and say so. A git repository of a test takes its identity from the environment of the command, as the helper environment gives it, never from git config. functional is the pytestmark. One assert per test. No source changes."
check = "uv run pytest tests/functional/test_land_push_refused.py -q"
expected_output = "created: tests/functional/test_land_push_refused.py states that, in a checkout of main tracking a bare origin of tmp_path, with [development] enabled = true and [delivery] push = true and a started Story whose one Task is completed: while the url of origin names no repository, fgraph land exits 2, fgraph show S-0001 lists bucket InProgress, main is on the merge with no commit of the record after it, the branch stands, and the error output ends -- main is not pushed -- S-0001 is merged at <sha> and not completed -- run fgraph land S-0001 again; once the url is put back a second fgraph land exits 0 saying landed S-0001 at that sha and pushed main to origin, by each of the three ways of merging, show lists it Completed, main of the origin is main of the checkout under chore: complete S-0001 in the record, and the branch is gone; and that a Story whose branch was merged into main by hand lands, with no delivery table, at the commit main is on"
