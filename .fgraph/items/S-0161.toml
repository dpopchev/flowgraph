description = "Three files. New module src/flowgraph/development/commit_task.py (about 80 lines), beside named_files.py, whose rule it reads. Docstring: fgraph commit, the commit of the work of a started Task: the files changed and not committed in the work tree of the record, each named by the brief of the Task -- its title, its expected output and its description -- by files_not_named, the rule fgraph complete holds that commit to (S-0142) and fgraph brief --not-named lists by (S-0153); it writes no file of the record and does not complete the Task (S-0161). It holds, each with its comment line: NOT_STARTED = '{task} is not started: fgraph commit commits the work of the Task started'; NO_WORK_TREE = '{task} has no files to commit: the record is not inside a git work tree'; NOTHING = '{task} has nothing to commit: no file is changed in {top}'; NOT_NAMED = '{task} cannot commit: its brief does not name {files} -- nothing is committed; take each back or have the brief name it', the files joined by a comma and a blank; class CommitTaskError(ValueError); def commit_task(item: str, message: str, store: Store, record: Path, open_git: OpenGit) -> Said. Its steps, in this order: parse_task_id(item) (TaskIdError as it is); said('message', message) of flowgraph.criterion (EmptyPartError, message is empty); load_holder(store)(task_id) of flowgraph.item.moves (TaskNotFoundError as it is); the Task is the StartedTask of that id among the Tasks of a holder that is not a BlockedWorkItem, read as check_files_named of named_files.py reads it, else NOT_STARTED; open_git(record), None is NO_WORK_TREE; the files are outside_record(work_tree.uncommitted_files(), record, work_tree.path); none is NOTHING with the path of the work tree; files_not_named(files, (task.title, task.expected_output, task.description)) not empty is NOT_NAMED; then sha = work_tree.commit_files([Path(file) for file in files], f'{message} ({item id}, {task id})'), the ids by work_item_id_text and task_id_text; return Said of committed, the Task id, of, the work item id, at, the sha and a newline. A GitError of the step is left to rise. It is not conditioned on development.enabled, as --not-named is not. src/flowgraph/development/named_files.py (99 lines): _outside_record becomes outside_record, its body and docstring unchanged, its one call in check_files_named renamed; nothing else. Red first: the constants, the error and commit_task as a typed stub raising NotImplementedError; the tests seen failing for their own reason; then the body. New tests/development/commit_task/test_commit_task.py (about 130 lines), command as its pytestmark, one assert each, built as tests/development/named_files/test_check_files_named.py builds its started Task (task_texts), its Store and its fake WorkTree; the fake answers uncommitted_files with a list and commit_files by keeping what it is given and returning 3e9ae5c. States: with src/a.py changed under a Task whose output names it, the Said out is committed T-0001 of S-0001 at 3e9ae5c and a newline; commit_files was given [Path(src/a.py)]; and the message fix: a change (S-0001, T-0001); a file under .fgraph/ changed beside it is not given to commit_files; refused, each pytest.raises(CommitTaskError, match=...) anchored from ^ to $ through re.escape, with a commit_files that fails the test when called: a Task in Backlog, a Task of a blocked work item, open_git answering None, no file changed (the top is /src/project), and other.txt changed beside src/a.py (the line names other.txt alone); a message of blanks raises EmptyPartError. Existing tests: tests/development/named_files pass as they are -- if one names _outside_record, stop and say which. Out of bounds: src/flowgraph/brief/not_named.py, which keeps its own line, src/flowgraph/parser/, src/flowgraph/cli.py, every other file of src/ and of tests/, the docs."
