id = "S-0040"
state = "backlog"
title = "Cut the commits fgraph makes of a record under git.commit = false from one a write to none"
description = "Part of the developer's request of 2026-11-21 to layer fgraph by a configuration, .fgraph/config.toml: (1) the items and their lifecycle, always; (2) their commits on main, optional; (3) the development beside the source code, turned on. The plan was shown and filed on the developer's 'file only' of 2026-11-21. Its Tasks are written when it is ordered. Reading of the agent: [git] commit is on by default when the record is inside a git work tree and git does not ignore it, as fgraph commits today; the alternative, off until set, was shown and not taken."
parent = "F-0001"
created = 2026-11-21 20:32:53+00:00

[criterion]
given = "a git repository whose record holds config.toml with [git] commit = false"
when = "a Story is added"
then = "the Story is in the record and git log holds no new commit"
