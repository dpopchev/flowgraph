title = "Rewrite the parts of a Task in Backlog inside its work item: amended of src/flowgraph/task/amend.py, amended_task and amend_task of the work item"
description = "Bottom-up, tests seen red first (each new function a typed stub that raises NotImplementedError before its tests). (1) New src/flowgraph/task/amend.py (about 55 lines; src/flowgraph/task/model.py is at 235 lines and is not touched): docstring, the amend of a Task in Backlog, part by part, it is no move. @dataclass(frozen=True) TaskAmendment with title, expected_output, check, description, each str | None = None. amended(task: TaskState, amendment: TaskAmendment) -> Task: an exhaustive match closed by assert_never; for Task() it returns make_task(task.id, title, expected_output, description, task.created, check), each part the one given or the one the Task had, so a blank title, output or check raises EmptyPartError through said and a blank description clears it; StartedTask raises StartedAlreadyError(f\"{named} is started already\"), BlockedTask BlockedError(f\"{named} is blocked\"), CompletedTask CompletedAlreadyError(f\"{named} is completed already\"), named by task_id_text. Export TaskAmendment and amended from src/flowgraph/task/__init__.py (78 lines, about 82 after). (2) src/flowgraph/work_item/tasks.py (138 lines, about 172 after): amended_task(item: WorkItemState, task_id: TaskId, amendment: TaskAmendment) -> OpenWorkItem. task_of(item.tasks, task_id) first (TaskNotFoundError); then a match on the item: WorkItem, StartedWorkItem and BlockedWorkItem take it, the same items that take a new Task (still_open of src/flowgraph/work_item/moves.py), and return replace(item, tasks=...) with the amended Task in the place it had; CompletedWorkItem raises CompletedAlreadyError(f\"{task} is completed already\") as started_task does; RemovedWorkItem raises RemovedAlreadyError(item.id). After amended() has passed, an amendment equal to TaskAmendment() raises NoPartError(f\"amend rewrites no part of {task}: name one\"), imported from flowgraph.work_item.amend: the state is refused before the missing part, as for a work item. A WorkItem holds tuple[Task, ...] and a started one tuple[TaskState, ...]: write the cases so pyright accepts each replace. Say in the module docstring that the amend of a Task is here though it is no move. (3) src/flowgraph/work_item/task_commands.py (130 lines, about 148 after): amend_task(*, task_id, amendment, load_holder, save_work_item) -> WorkItemId, shaped as unblock_task. Export amended_task and amend_task from src/flowgraph/work_item/__init__.py (189 lines, about 193 after). Tests: new tests/task/test_task_amend.py (model): each part given alone is rewritten and the rest equals the Task it was (parametrized); several parts together; a blank description clears it; a blank title, output and check are refused by name (title is empty, output is empty, check is empty); a check given to a Task that held none is kept; the three states refused with their whole lines. New tests/work_item/test_work_item_task_amend.py (model, and command for amend_task), items built as tests/work_item/test_work_item_blocked.py builds BACKLOG, STARTED, BLOCKED, COMPLETED and REMOVED: a Task of a work item in Backlog, a Task in Backlog of a started and of a blocked work item are amended and every other Task and field stays; the started Task of a started work item is refused; a Task of a completed and of a removed work item are refused with their lines; no part is refused; an unknown Task raises TaskNotFoundError; amend_task saves the holder once and returns its id; a refused amend_task saves nothing. Out of bounds: src/flowgraph/task/model.py, src/flowgraph/work_item/amend.py, src/flowgraph/item/, src/flowgraph/parser/, tests/functional/ (the xfail marks stay)."
