id = "S-0149"
state = "backlog"
title = "Cut the releases fgraph tags while a work item completed since the last tag holds no answer of fgraph verify from every one to none"
description = "Filed on the word of the developer of 2026-11-23, picked from the map made that day of what the skills and rules of ~/.claude ask of board 1 that fgraph does not do and no Backlog item builds, so that those skills can call fgraph in its place. In board 1: board release refuses a root with a work item that holds no verified: line (W-583). Its Tasks are written when it is ordered."
complexity = "medium"
created = 2026-11-23 20:39:15+00:00

[criterion]
given = "a main with a v* tag and, completed since it, a Story that holds no answer of fgraph verify"
when = "fgraph release is run, and run again once fgraph verify has kept a yes for the Story"
then = "the first is refused, exit 2, naming the Story and fgraph verify, no tag made; the second tags as today"

