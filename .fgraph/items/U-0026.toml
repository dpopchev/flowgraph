d_in from buckets. Docstrings move with their functions, reworded only for the new names. (5) Importers, one line each: src/flowgraph/status/document.py (149 lines) takes BUCKETS and is_listed_in from flowgraph.status.buckets; src/flowgraph/status/show.py (148) takes BUCKETS from buckets and BLOCKED from flowgraph.work_item; src/flowgraph/status/__init__.py (57) takes APART and BUCKETS from buckets, cut_lines and status_text still from text, its __all__ unchanged; src/flowgraph/graph/view.py (161, line 23) and src/flowgraph/brief/document.py (130, line 18) take BUCKETS from flowgraph.status.buckets; src/flowgraph/status/next.py (223, about 221 after) drops its own BACKLOG_BUCKET and imports the one of buckets. Imports stay acyclic: buckets and work_item_lines import nothing of text, feature_lines imports work_item_lines, text imports the three; pyright refuses a cycle (reportImportCycles). Out of bounds: src/flowgraph/status/view.py (the next Task), every file under tests/, any printed character, README.md and docs/ (neither names these modules). tests/status/test_output.py imports cut_lines from flowgraph.status.text and must pass untouched."
