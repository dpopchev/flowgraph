st: tests/functional/ test_add_story.py 1, test_add_upkeep.py 1, test_amend_feature.py 1, test_amend_parent.py 1, test_complete_bug.py 1, test_remove_work_item.py 1, test_reorder_backlog.py 2, test_reorder_feature.py 1, test_spike_prefix.py 1, test_status_feature_bucket.py 1, test_status_features.py 1, test_status_next.py 2, test_status_waits.py 1, test_status_width.py 2 (the cut falls elsewhere: read it from the run), test_story_prefix.py 1, test_watch.py 9; tests/item/ test_status_features.py 7, test_status_order.py 2; tests/status/text/ test_status_features.py 1, test_status_next.py 4, test_status_start_now_feature.py 2, test_status_start_now.py 3, test_status_top.py 3, test_status_waits.py 3; tests/work_item/test_remove_command.py 1; and tests/functional/test_status_backlog_top.py of S-0130 (its WHOLE, SHORT and waiting lines gain `[]`). Then remove XFAIL and its marks from tests/functional/test_status_task_count.py. Out of bounds: src/flowgraph/status/feature_lines.py (a Feature line keeps `N/M W`), document.py, text.py, tops.py, the docs."
