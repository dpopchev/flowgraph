id = "ST-0017"
state = "started"
title = "Cut the git commands a developer runs to land a work item from 4 to 0"
description = "Found in the review of the Backlog on 2026-11-21: the developer's rule is that the record and its rituals go through fgraph, and ST-0009 covers only the start. Landing is done by hand today: one merge commit of the branch on main, fgraph complete at that commit, the commit of the record, then the worktree and the merged branch removed. fgraph land does those steps; the commit of the record is fgraph's. Open: who words the merge commit; the agent's reading is the developer, given with an option, since it is a commit of the development and the developer said on 2026-11-21 that fgraph does not take over those messages. Ordered after ST-0009 and ST-0010. Its Tasks are written when it is ordered."
created = 2026-11-21 08:34:10+00:00
started = 2026-11-21 10:59:11+00:00

[criterion]
given = "a started Story on its worktree branch, every Task of it completed"
when = "fgraph land is run on it in the checkout of main"
then = "fgraph status lists it under Completed with the merge commit of its branch"

[[tasks]]
id = "T-0053"
state = "completed"
title = "Add tests/functional/test_land_work_item.py, failing on the criterion of ST-0017"
description = "Run through run() of src/flowgraph/cli.py on a real git repository in tmp_path, as tests/functional/test_commit_writes.py does. Seen red, then marked a strict xfail naming ST-0017 until the Task that turns it green removes the mark. The developer's decision of 2026-11-21 for the whole Story: the developer words the merge commit, given with an option of fgraph land. The agent's readings, each a routine call: (1) the command is fgraph land ID --message TEXT, the option required; a Task id is refused. (2) Its steps in order: merge the branch wi/<id>-* into main with --no-ff and without committing; refuse as fgraph complete would, the merge aborted, when a Task of the item is not completed; commit the merge under the message; complete the work item at the short sha of that commit, committed as 'chore: complete <id> in the record'; remove the worktree of the branch, then the branch. (3) It prints 'landed <id> at <sha>'. (4) It exits 2 naming why, nothing merged, when the record is outside a git work tree, when the checkout it runs in is not on main -- the rule the developer gave for a start in ST-0021 -- when no branch wi/<id>-* or more than one is there, and when git refuses the merge. (5) A worktree or a branch git refuses to remove exits 2 naming the git command and saying the work item is landed."
expected_output = "created: tests/functional/test_land_work_item.py states that fgraph land, run in the checkout of main on a started Story whose Tasks are completed on its worktree branch, leaves fgraph status listing it under Completed with the merge commit of its branch"
