description = "FIRST PASS, written on 2026-11-25 before Phases 2 and 3 were completed: the coordinator reviews this Task before its Feature starts (Q-0005, its decision of 2026-11-25). If no later line of Q-0005 says its Tasks were reviewed, stop and say so. One file: docs/domain-model.md, the section the first Task made (if grep -n '^### Invalidation' docs/domain-model.md finds nothing, stop and say so), the two parts after it; plain ASCII; no change under src/ or tests/, README.md, pyproject.toml or uv.lock. The probe of the index for this part, under local/scratch/a1/, on the standard library: a read(path) that reads the bytes, hashes them, selects the row of the path and decodes it when the hash is its own, else parses and writes the row (INSERT OR REPLACE), the connection opened at the first read by sqlite3.connect(<copy>/.cache/index.sqlite3, timeout=1.0, isolation_level=None) with journal_mode WAL, the folder .cache/ made inside the copy of the record with a .gitignore holding *. Probe each and write it with what it printed: four processes building the index from none at one time (seen on 2026-11-25: each took about 1.0 s, each parsed 182 to 212 of the 313 files and read every file equal to tomllib, exit 0); a read while another process holds BEGIN EXCLUSIVE on the index (seen: under WAL the selects go on, the insert waits the busy timeout and raises sqlite3.OperationalError, the read gives the parse; a read that goes on using the index after it waits the timeout again at each miss, so the probe gives the index up for the rest of its store); a read of a file an fgraph write replaces between the read of its bytes and the write of its row (the row holds the parse of the bytes it was hashed from: say whether any order of the two leaves a row untrue to its hash); an index file that is no database (seen: sqlite3.DatabaseError at the first statement, every read gives the parse and the index stays broken: say whether to remove it and make it anew); a record folder that cannot be written (chmod 555 on the copy: mkdir raises, every read gives the parse, no folder is left); the ResourceWarning Python 3.14 gives for a connection collected unclosed (seen under python -W always: unclosed database; weakref.finalize(read, connection.close) at the open closed it with no warning; an open and a close at each read cost 0.39 ms, 120 ms for 313 reads); and the journal and synchronous modes kept, from the build times of the first part. Then ### Where it lives: each copy of the record keeps its own, .fgraph/.cache/ in the worktree of a work item, built anew at its first read there, or one for the repository under git rev-parse --git-common-dir, its rows keyed by worktree and path; count the records one fgraph status opens on main and in the worktree of a work item, in a throwaway repository under local/scratch/a1/git with the development on and two started work items (grep -n 'open_store(' src/flowgraph/development/worktrees.py: find_task_ids, where_written for each started row, main_store for each read of a term), and the cost of each open. How git ignores it, each run in that repository: .fgraph/.cache/.gitignore holding * (seen in the draft: git status --porcelain --untracked-files=all printed nothing, git add -A .fgraph staged nothing, git check-ignore -v named .fgraph/.cache/.gitignore:1:* for the index and for the .gitignore itself, git worktree add made no .cache/ in the new worktree, and git worktree remove of a worktree holding one exited 0 -- remove_worktree of src/flowgraph/development/git.py runs it with no --force); a line of the .gitignore of the repository, the user's file; a .fgraph/.gitignore that fgraph init writes (init_record of src/flowgraph/record/init.py writes config.toml alone today, and a record made before would hold none); and that uncommitted_files of src/flowgraph/development/uncommitted_git.py, which lists the files git neither tracks nor ignores, never names the index. Out of bounds: every file under src/ and tests/, README.md, the record of the repository (.fgraph/), pyproject.toml, uv.lock."
