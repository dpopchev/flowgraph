ord; with no connection, parse(text); else the key path.relative_to(record).as_posix() and hashlib.sha256(raw).hexdigest(); SELECT sha256, data FROM parsed WHERE path = ?; a row of that hash gives _decoded(data); else parsed = parse(text) -- a parse that raises writes nothing -- then INSERT OR REPLACE INTO parsed VALUES (?, ?, ?) and parsed is given. Each try holds the one statement that raises sqlite3.Error. open_indexed(record: Path, parse: ParseToml = tomllib.loads) -> Store, docstring: the store of the record kept as its files, each TOML file read through the index -- open_files(record, read=indexed(record, parse)); it fits OpenStore. Probed in the draft on 2026-11-25 on a copy of the record of this repository (313 files): the repr of every parse read back equals that of tomllib.loads; through the index 42 ms against 359 ms of parsing; four processes building it from none at one time each read every file right; an index file that is no database and a record that cannot be written gave the parse. New tests/record/index/test_indexed.py, edge as its pytestmark as tests/record/lock/test_lock_files.py, one assert each, on tmp_path, a counting parse as the functional test has it: the first read of a file gives what tomllib.loads gives; it parses the file; a read through a second indexed of the same record parses nothing; it gives what the first gave; a read after the file changed parses its new text alone; a file of an offset, a local and a fractional datetime, a date, a time, inf and nan reads back with the repr tomllib.loads gives; the index file is record / .cache / index.sqlite3; .cache/.gitignore holds *; a file that is no TOML raises tomllib.TOMLDecodeError; after it the next read parses it again; an index file overwritten with bytes that are no database gives the parse; a record holding a file named .cache gives the parse; an index whose PRAGMA user_version was set to 99 is made anew (the next read parses); two indexed reads of one record, both open at one time