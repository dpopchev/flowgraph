[[knowledge]]
kind = "decision"
text = "Ruled by the coordinator on 2026-11-24 while writing its Tasks, under the /goal of Phase 1 the developer set that day, which has the coordinator write the Tasks before a Feature starts; the developer was not asked and reviews them at the close: (1) The document of a work item uses the key names of fgraph brief --format json for the parts both hold (agent, bucket, complexity, criterion, depends_on, description, id, kind, knowledge, state, tasks, title) and adds the parts only show lists; it holds no waits_for, which the text of show does not list. (2) Every key is always present, null for an empty text and [] for an empty list, though the text leaves the line out, so a reader never tests for a missing key. (3) realizes is the number or null and realized the text of the criterion or null, flat as WorkItemDetail holds them, never the words none of the criteria of F-0001 the text prints. (4) A Task holds its bucket in every state, where the text lists it only once it left Backlog, and its progress lines under it; the progress of the work item holds its own lines alone, as the text splits them. (5) A knowledge line of a work item and of a Feature holds about, governs, kind, mark, noted, superseded_by, supersedes and text, no ref, as the row holds it; a line of the term holds the nine keys of a KnowledgeEntry (about, governs, item, kind, mark, noted, ref, supersedes, text), the same shape S-0155 lists, so the three stories agree on a line. (6) criteria of a Feature always hold met and realized_by, where the text prints met k of n only once a work item names a criterion. (7) The term document is kind term with name in place of id; its items are ids in the order items_about gives (work items, then Features). (8) A format that is neither text nor json is refused before the item is read, but after the archive check of an id of board 1 in src/flowgraph/parser/views.py, which is left as it is. (9) The JSON of a work item and of a Feature lives in the new src/flowgraph/status/show_document.py beside status/show.py, that of a term in the new src/flowgraph/term/document.py, since term/item.py would close an import cycle with a module that imports TermShown. (10) show_item of src/flowgraph/item/commands.py is removed: show_any_item reads the work item itself, and the module (240 lines) has no room for a format."
noted = 2026-11-24 21:52:37+00:00
