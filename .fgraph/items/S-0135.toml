ns in and those of its Task nine; a removed row reads its reason below; one superseded with no reason reads `  superseded by S-0002`; cut_lines at a width cuts the two lines apart. Existing tests that pin `  -- `, 46 in 22 files (counted by a run with the words patched below): tests/functional/ test_block_feature.py 3, test_block_task.py 1, test_block_work_item_branch.py 1, test_block_work_item.py 3, test_remove_feature.py 2, test_remove_started_feature.py 1, test_remove_work_item.py 1, test_status_block_reason.py 2, test_status_feature_blocked.py 2, test_status_started_task.py 1, test_status_waits.py 1, test_superseded_by.py 1, test_superseded_by_refused.py 1; tests/item/test_status_features.py 3, test_status_in_progress_order.py 1; tests/status/text/ test_status_blocked_item.py 8, test_status_features.py 4, test_status_tasks.py 2, test_status_waits.py 4, test_superseded.py 2; tests/work_item/test_remove_command.py 1; tests/feature/test_feature_remove.py 1. Correct all but those of a removed Feature (test_remove_feature.py, test_remove_started_feature.py, tests/feature/test_feature_remove.py and the removed Feature of tests/item/test_status_features.py: the next Task): the expected line splits in two; a test that reads one line by index or endswith reads the pair. Remove the marks of XFAIL, not those of XFAIL_FEATURE. Out of bounds: src/flowgraph/status/feature_lines.py, text.py (cut_lines and the tops count items, not lines), watch.py, document.py, show.py, the docs."
