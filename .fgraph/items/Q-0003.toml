id = "Q-0003"
state = "backlog"
title = "Settle whether two writes of fgraph made at one time in two worktrees of one repository collide on an id or leave records that do not merge"
description = "Phase 2, Concurrent Worktree and Merge Ergonomics: filed on the word of the developer of 2026-11-25, add the spike first to be next of U-0018, before the Features of the phase, whose rework its answer feeds: the ids across worktrees and the merge of the record. To probe in a throwaway repository with the development on: two fgraph add task run at one time in the worktrees of two started work items; an add on main while a worktree adds a Task; and which pairs of writes -- a Task move in a worktree beside an add, a reorder, a note or a landing on main -- leave copies of the record that conflict at fgraph sync or at fgraph land. Known on 2026-11-25: the next Task id is one above the highest in the record of every worktree (docs/domain-model.md, Persistence); T-0718 and T-0719 were added that day in two worktrees one after the other and got ids of their own; six landings and the syncs of that day met no conflict in the record, and no knowledge line holds the word conflict; a work item completed on main by hand while its branch lives is the one conflict the domain model names. Its Tasks are written when it is ordered."
complexity = "medium"
created = 2026-11-25 07:45:33+00:00

[criterion]
hypothesis = "Do two writes of fgraph made at one time in two worktrees of one repository give two items one id, or leave copies of the record that conflict at fgraph sync or at the landing?"

[[tasks]]
id = "T-0739"
state = "backlog"
title = "Probe two fgraph add task run at one time in two worktrees; write Ids given at one time in docs/domain-model.md"
description = "Probes alone: no file under src/ or tests/ and no README.md changes, and nothing under local/scratch/q3/, which git ignores, is committed. Each probe runs in a throwaway git repository made under local/scratch/q3/, the identity of its commits from the environment (GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL, GIT_COMMITTER_NAME, GIT_COMMITTER_EMAIL), never from git config, the development on (fgraph init, then fgraph config set development.enabled true), with the fgraph of this worktree (uv run --project <this worktree> --directory <the throwaway directory> fgraph ...). The record: two Stories, each with one Task, both started, so each has its worktree. One round: fgraph add task with a title of its own, --parent S-0001 in the worktree of S-0001 and --parent S-0002 in the worktree of S-0002, started as two processes at one time (subprocess.Popen of both, then wait). At least 20 rounds; keep the script under local/scratch/q3/. Per round keep the two exit statuses, the two lines and the ids. Then, on the last state: fgraph status on main, and fgraph show of each Story in its worktree -- does each list its Tasks, each once. If a round gave one id twice: run fgraph sync in each worktree and say what it printed. Also 10 rounds of fgraph add story on main at one time with fgraph add task in a worktree. Known before: the next Task id is one above the highest in the record of every worktree (docs/domain-model.md, Persistence; grep -n 'next Task id'), each worktree taking the lock of its own copy (B-0035). Write the part in the words of docs/domain-model.md: plain ASCII, what was run, the counts in one table, the lines as printed; no conclusion beyond what was seen -- the answer is the third Task. Out of bounds: every file but docs/domain-model.md."
check = "grep -q '^## Writes at one time in two worktrees' docs/domain-model.md && grep -q '^### Ids given at one time' docs/domain-model.md"
expected_output = "changed: docs/domain-model.md holds, right before ## Evidence, the new section ## Writes at one time in two worktrees with its first part, ### Ids given at one time: what was run, how many rounds, the ids each round gave, how many rounds gave one id twice or lost a Task, and every line fgraph printed that was not an added line, word for word"
created = 2026-11-25 08:04:29+00:00

