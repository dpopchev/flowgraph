title = "Narrow the criterion of a work item before Completed to OpenCriterion, so pyright refuses a state before Completed built with an Answer"
description = "FIRST PASS, written on 2026-11-25 before Phase 2 was completed: the coordinator reviews this Task before its Feature starts (U-0037, its decision of 2026-11-25). If no later line of U-0037 says its Tasks were reviewed, stop and say so. The case of a decision kept before the completion, chosen as a type: pyright refuses an Answer where a state before Completed is built, and make_work_item refuses one at runtime already (CriterionError: a Probe states a hypothesis, not a hypothesis and its decision), as item_held refuses a file that holds a decision before it is completed. Seven source files and four test files, each place found by grep. (1) src/flowgraph/criterion/model.py (about 243 lines after U-0036, about 246 after; make lines holds 250, if it fails stop and say so): right after Criterion = Scenario | Defect | Hypothesis | Answer, the comment line '# The criterion of a work item not completed: the one its kind takes, never yet answered.' and OpenCriterion = Scenario | Defect | Hypothesis. (2) src/flowgraph/criterion/__init__.py: import and list OpenCriterion in its sorted place. (3) src/flowgraph/work_item/model.py (248 lines, about 249 after): OpenCriterion added to the parenthesized import from flowgraph.criterion; criterion: Criterion becomes criterion: OpenCriterion on WorkItem, StartedWorkItem, BlockedWorkItem and RemovedWorkItem, CompletedWorkItem keeping criterion: Criterion; make_work_item takes criterion: OpenCriterion. (4) src/flowgraph/work_item/commands.py: add_work_item takes criterion: OpenCriterion, the import of Criterion becoming OpenCriterion. (5) src/flowgraph/item/commands.py: add_item takes criterion: OpenCriterion, likewise. (6) src/flowgraph/item/file.py: criterion_held returns OpenCriterion (it builds only make_scenario, make_defect and make_hypothesis); criterion_primitives keeps Criterion. (7) src/flowgraph/parser/stated.py: criterion_added returns OpenCriterion, its import likewise. src/flowgraph/work_item/amend.py is not edited: _amended_criterion takes the wider Criterion and its case Answer stays. Its result goes through dataclasses.replace, which pyright does not check (probed on 2026-11-25), and an amend of a completed item is refused before it. Tests that change (pyright names them; each helper completed(kind, criterion: Criterion, ...) passes its criterion to make_work_item): tests/work_item/test_work_item_verify.py, tests/work_item/test_work_item_verify_no.py and tests/work_item/test_work_item_verified_row.py, where criterion: Criterion becomes criterion: OpenCriterion and the import likewise. Red first: the check fails before the change on its grep of OpenCriterion. Then add to tests/work_item/test_work_item_hypothesis.py (model, as the neighbouring tests mark each function), with CriterionError imported from flowgraph.criterion: test_a_work_item_built_with_an_answer_is_refused: pytest.raises(CriterionError, match=r'^a Probe states a hypothesis, not a hypothesis and its decision$') around make_work_item(ONE, 'a title', Answer('Can one file hold the record?', 'yes, one file', 'yes'), '', CREATED), with the comment # pyright: ignore[reportArgumentType] on the argument, the build pyright now refuses. It passes before the narrowing too, as a guard of the runtime refusal; it is named here so it may be added. If pyright names another file, or a test that builds a state before Completed with an Answer, stop and say which. Out of bounds: src/flowgraph/work_item/amend.py, moves.py, primitives.py, verify.py, src/flowgraph/work_item/id.py (Kind.takes stays type[Criterion]), every other file of src/ and tests/, the docs; run uv run ruff format on the changed files."
check = "uv run pytest tests/work_item tests/item tests/parser tests/criterion tests/spike tests/functional/test_complete_spike.py -q -p no:cacheprovider && grep -q '^OpenCriterion = Scenario | Defect | Hypothesis' src/flowgraph/criterion/model.py && grep -q 'criterion: OpenCriterion' src/flowgraph/work_item/model.py && grep -q 'def test_a_work_item_built_with_an_answer_is_refused' tests/work_item/test_work_item_hypothesis.py && uv run python -c \"from pathlib import Path; import tomli_w; from flowgraph.record.store import KINDS; from flowgraph.work_item import read_work_item, parse_work_item_id; from flowgraph.work_item.primitives import item_primitives; r = Path('.fgraph'); print(sum(tomli_w.dumps(item_primitives(read_work_item(r, parse_work_item_id(k, p.stem), KINDS))) != p.read_text(encoding='utf-8') for k in KINDS for p in (r / 'items').glob(k.prefix + '-*.toml')))\" | grep -qx 0 && make lines && uv run pyright"
expected_output = "changed: src/flowgraph/criterion/model.py holds OpenCriterion = Scenario | Defect | Hypothesis; the criterion of WorkItem, StartedWorkItem, BlockedWorkItem and RemovedWorkItem and the criterion taken by make_work_item, add_work_item and add_item, and given by criterion_held and criterion_added, is an OpenCriterion; created: test_a_work_item_built_with_an_answer_is_refused in tests/work_item/test_work_item_hypothesis.py states the refusal at the build. Every command prints what it printed before"
