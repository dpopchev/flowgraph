text = "Ruled by the coordinator on 2026-11-24 while writing its Tasks, under the /goal of Phase 1 the developer set that day, which has the coordinator write the Tasks before a Feature starts; the developer was not asked and reviews them at the close: (1) Every relation is a list of {bucket, id, title} under its own key, the heading of the text with underscores, even feature, filed_during, superseded_by and amends that link one item at most, and every relation is present with [] for none, so the document has the same keys for every work item of a kind. (2) The document is flat: id (name for a term, path for a file), kind and title at the top beside the relations, as brief and show are flat; kind is the noun of the prefix for a work item, feature, term or file, so a reader tells the four apart. (3) A knowledge row of an item holds about, governs, kind, mark, noted, supersedes and text; a line of a term and of a file holds the nine keys of a KnowledgeEntry (with item and ref), the shape S-0155 lists, and a line of a term adds via. (4) via is null for what is about the term itself and the name of the term under it otherwise, where the text writes (via TERM); the commit of a work item only a Task touched is null, where the text writes -. (5) The term holds its head (meaning, added, is_a, part_of, kinds, parts) as fields read in about/view.py, while the text keeps reading the head through term_head of src/flowgraph/term/item.py, so its words stay those of fgraph show; the reads duplicate those of term_head in about ten lines. (6) The text is split from its reads first, in a step Task with the text unchanged, so the JSON formats the same plain data the text words (about/links.py, about/text.py, about/document.py beside about/view.py and about/file.py). (7) The path of a file is the text as given, not the path from the top of the work tree."
noted = 2026-11-24 21:52:59+00:00
