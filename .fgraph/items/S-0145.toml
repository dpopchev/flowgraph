description = "Made after S-0144 has landed; tests seen red first, the new function and parameter typed stubs first. (1) src/flowgraph/work_item/amend.py (about 176 lines after S-0144, about 220 after). DeviationError(ValueError): an amend of a started item without its deviation, or of one in Backlog with one. A public check_deviation(named: str, started: bool, deviation: KnowledgeLine | None) -> None that raises it with the two lines of the OUTPUT (NEEDED when started and none is given, IN_BACKLOG when not started and one is given); the Feature will call it too. amended_work_item(item, amendment, deviation: KnowledgeLine | None = None) -> OpenWorkItem. Case WorkItem: check_deviation(named, False, deviation) first, then as today. Case StartedWorkItem | BlockedWorkItem, a blocked one counting as started, in this order: complexity, parent or depends_on given raises StartedAlreadyError with the BACKLOG_ALONE line (before the deviation is asked, so --complexity alone never asks for one); output or check given raises the NoSuchPartError of S-0144; check_deviation(named, True, deviation); an amendment equal to Amendment() raises NoPartError as in Backlog; then replace(item, title=said(\"title\", ...), criterion=_amended_criterion(...), description=..., about=...) and noted_work_item(that, deviation) of src/flowgraph/work_item/model.py, so the state, the times, the agent, the block and the Tasks stay. Completed and removed refuse as today. Put the started case in a private function if ruff counts the match too complex. BlockedError is no longer raised by an amend. Update the module docstring (the wording of one in Backlog, or of a started one with its deviation) and the docstrings. (2) src/flowgraph/work_item/commands.py (157 lines, about 162 after): amend_work_item gains deviation: KnowledgeLine | None = None, keyword, passed on; the item and the line are one save. (3) src/flowgraph/work_item/__init__.py (about 193, about 195 after): export DeviationError and check_deviation. (4) src/flowgraph/parser/refusals.py (about 141 lines, about 143 after): DeviationError in the import of flowgraph.work_item and in REFUSED after NoSuchPartError; it must be there in this Task, since fgraph amend of a started work item raises it from now on. Tests, new tests/work_item/test_work_item_amend_started.py (model, command for amend_work_item), items built as tests/work_item/test_work_item_blocked.py builds them, the line by make_knowledge_line(DEVIATION, ...): a started and a blocked item amended equal replace(item, the part, knowledge=(*kept, line)), per part (title, description, given, about); a line it kept before stays first; without a line each is refused with the whole NEEDED line; complexity, parent and depends_on each refuse with BACKLOG_ALONE, with a line and without; no part with a line is NoPartError; a blank title is EmptyPartError; a line for one in Backlog is IN_BACKLOG; completed and removed refuse as before with a line; amend_work_item saves once, the amended item holding the line; a refusal saves nothing. Existing tests that change: tests/work_item/test_work_item_amend.py test_a_started_work_item_is_not_amended and tests/work_item/test_work_item_blocked.py test_a_blocked_work_item_is_not_amended (now DeviationError, NEEDED); tests/functional/test_amend_work_item.py row a-started-story (NEEDED); tests/functional/test_complexity.py (the line STARTED its started-Story test reads), tests/functional/test_amend_parent.py row a-started-story and tests/functional/test_depends_on_refused.py test_a_work_item_started_is_amended_no_more (each the BACKLOG_ALONE line). Remove the XFAIL mark of every test selected by -k \"without and story\" in the two files of Task 1 and of no other. Out of bounds: src/flowgraph/feature/, src/flowgraph/item/, src/flowgraph/parser/amend.py and command.py, src/flowgraph/knowledge/, the docs."
check = "uv run pytest tests/work_item tests/parser tests/functional/test_amend_work_item.py tests/functional/test_complexity.py tests/functional/test_amend_parent.py tests/functional/test_depends_on_refused.py tests/functional/test_amend_started.py tests/functional/test_amend_started_branch.py -q && uv run pytest tests/functional/test_amend_started.py tests/functional/test_amend_started_branch.py -q --runxfail -k \"without and story\" && make lines"
