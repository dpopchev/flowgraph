description = "Probes alone: no file under src/ or tests/ and no README.md changes, and nothing under local/scratch/q3/, which git ignores, is committed. Each probe runs in a throwaway git repository made under local/scratch/q3/, the identity of its commits from the environment (GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL, GIT_COMMITTER_NAME, GIT_COMMITTER_EMAIL), never from git config, the development on (fgraph init, then fgraph config set development.enabled true), with the fgraph of this worktree (uv run --project <this worktree> --directory <the throwaway directory> fgraph ...). For each pair a fresh repository, or a fresh started Story of one: make the write of the worktree, the write of main, then fgraph sync in the worktree; and on a second copy of the pair, with the Tasks completed, fgraph land on main with no sync before it. The pairs, the worktree first: (a) the start and the complete of a Task, with fgraph add story on main; (b) the same, with fgraph reorder of two items on main; (c) the same, with fgraph note of a finding on another work item on main; (d) fgraph add task in the worktree, with fgraph add task to a work item in Backlog on main; (e) fgraph amend of the started work item with its deviation, with fgraph add term and fgraph note on a Feature on main; (f) fgraph note of a decision on the started work item, with the landing of a second started work item on main; (g) the work item completed on main by hand while its branch lives, the one conflict the domain model names (grep -n 'completed on .main. by hand'); (h) any other pair the first seven suggest. Known before: six landings and the syncs of 2026-11-25 on this repository met no conflict in the record. Write the table and, for each conflict, the line as printed; no conclusion beyond what was seen. Out of bounds: every file but docs/domain-model.md."
