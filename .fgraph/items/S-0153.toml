[[knowledge]]
kind = "decision"
text = "Ruled by the coordinator on 2026-11-24 while writing its Tasks, under the /goal of Phase 1 the developer set that day, which has the coordinator write the Tasks before a Feature starts; the developer was not asked and reviews them at the close: (1) The agent asks with an option of an existing view, fgraph brief ID --not-named, not a new command: brief is already the read an agent is handed, already finds the worktree of the work item through git, writes nothing and is among the commands that take no lock (READS of B-0035); a new command would also change the parser registration, the command list tests/parser/test_help.py pins, the lock list of B-0035 and the command table of README.md. (2) It takes the id of the work item, as brief does, and reads its one started Task (a work item holds at most one); a work item with no started Task is refused, exit 2, rather than answered with an empty list that would read as all named. (3) Changed covers what the next commit of the Task can hold: tracked files changed since HEAD, staged or not, and new files git does not ignore; it leaves out the commits already on the branch, since the Given says changed and not committed and the Then holds them to the S-0142 rule, which measures the one commit given to each complete -- a file of an earlier commit was held to the brief of its own Task, and listing it here would name files of other Tasks. (4) The rule is files_not_named of S-0142 over the same three texts (title, expected output, description), the files under the record directory dropped as check_files_named drops them; the brief's own _named rule (Governed by) is not used. (5) The answer is a listing: one path per line by path, nothing when every file is named, exit 0 either way, and a JSON list under --format json, so the existing --format keeps its meaning and no new refusal of a format is needed. (6) It answers whatever development.enabled says: it writes nothing and only informs, so no refusal is added for the development off. (7) It reads the worktree git holds for the work item from main and from the worktree alike, else the work tree of the record (a record git ignores, the development off); a record outside a git work tree is refused, exit 2. (8) The git read is a new field uncommitted_files of WorkTree with its adapter in a new module uncommitted_git.py, because git.py is at 239 of 250 lines; it reuses no existing adapter since uncommitted of sync_git.py lists tracked files alone and a Task's new file is untracked until added."
noted = 2026-11-24 21:55:21+00:00
