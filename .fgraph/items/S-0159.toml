[criterion]
given = "the server of fgraph mcp on a repository with the development on and a planned Story in Backlog"
when = "the session calls the tools that start the Story with its agent, start its Task, note its progress and complete the Task at its commit, and then the one that completes a Task whose check fails"
then = "each move is written where fgraph writes it, main or the worktree of the Story, and answers with the line its command prints; the refused completion is given back as an error that holds the one line of the refusal, nothing written"

