[criterion]
given = "a record with a Feature, a Story under it that holds a Task and a knowledge line, and a term"
when = "fgraph show is run with --format json on the Story, on the Feature and on the term"
then = "each prints one JSON document that holds what the text of fgraph show lists for it, the same bytes on two runs, and a format that is neither text nor json is refused naming both, exit 2"

