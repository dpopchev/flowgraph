[criterion]
given = "a record in a git repository whose folder .fgraph/.cache/ was deleted"
when = "fgraph status is run twice, and once more after one item file is changed"
then = "each run prints the bytes fgraph status prints with no index; the first builds the index, the second parses no item file, the third parses the changed one alone; and git status lists nothing of .fgraph/.cache/"

