description = "FIRST PASS, written on 2026-11-25 before Phases 2 and 3 were completed: the coordinator reviews this Task before its Feature starts (Q-0005, its decision of 2026-11-25). If no later line of Q-0005 says its Tasks were reviewed, stop and say so. Read U-0018 first (uv run fgraph show U-0018): if it is not completed, stop and say so -- the index is weighed against the record read after U-0018 has cut the repeated reads, never against today. One file: docs/domain-model.md (about 4000 lines on 2026-11-25); find the place by grep -n '^## Evidence' docs/domain-model.md, never by line number, and put the new section right before it, after ## Tools over stdio, as Q-0002 put its own; plain ASCII; no change under src/ or tests/, README.md, pyproject.toml or uv.lock. The probes are throwaways, never committed: write them under local/scratch/a1/ (local/ is in .gitignore) and run them with uv run python, on the standard library and flowgraph alone (sqlite3, hashlib, json, tomllib; install nothing). Never build an index inside the record of the repository: .gitignore names no folder of the record, so a .fgraph/.cache/ there shows in git status; copy it first (cp -r .fgraph local/scratch/a1/record/.fgraph) and probe the copy. Take the best of three runs and say the load of the machine (uptime) beside each table. The synthetic record: local/scratch/a1/synthetic/.fgraph, a copy of the record whose items/ gains whole copies of every file of items/, each id of the form S-, U-, B-, Q-, F- or T- and four digits, in the name of the file and in its text, shifted by 1000 times the number of the copy (in copy 1, S-0157 becomes S-1157 and T-0767 becomes T-1767; the regular expression \\b([SUBQFT])-(\\d{4})\\b), so the relations of a copy name files of the same copy; terms/, config.toml and queue.toml are copied once. Whole copies until items/ holds at least 1,500 files: on 2026-11-25 the 291 item files and 5 copies made 1,746 item files, 14.0 MB with the 22 terms. Run fgraph status there (uv run --project /home/dimitar/projects/flowgraph fgraph status in local/scratch/a1/synthetic) and write that it exits 0, or its refusal and how the probe was changed for it. The parses of one command: the probe sets tomllib.loads to a wrapper that counts each call and, by the sha256 of the text, the file it parsed (the modules of flowgraph call tomllib.loads through the module, so the one attribute counts them all), then runs run() of src/flowgraph/cli.py in process with the effects main() gives it, write and write_error appended to lists, for fgraph status, fgraph show of a Story with Tasks and fgraph about of a term; write the parses of each command and the most one file was parsed. Seen on 2026-11-25 before U-0018: one fgraph status parsed TOML 22,801 times for 288 files, about 79 a file. The index of the probe: a SQLite file beside the copy, local/scratch/a1/<record>.sqlite3, one table (sha256 TEXT PRIMARY KEY, data TEXT), the parse encoded by json.dumps with each datetime, date and time written as a table of one key, $datetime, $date or $time, to its isoformat, and decoded by an object_hook with fromisoformat; the wrapper of tomllib.loads looks the sha256 of the text up first and parses only on a miss -- the same work the index of the Stories does at a read (the bytes hashed, one select, one decode), under the real commands. Check the decode first: the repr of each decoded parse equals that of tomllib.loads, for every file of both records and for a file of offset, local and fractional datetimes, a date, a time, inf and nan (seen on 2026-11-25: equal for all 313 files and each of those values). Times to write for each record: the read of the bytes of every file; tomllib.loads of each; tomllib and the model of its kind (HELD_ITEM of src/flowgraph/work_item/held_file.py) of each work item; the read of each through the index; the build of the index from none, one transaction per file, journal_mode WAL, under synchronous FULL and NORMAL; the seconds of each of the three commands whole, with and without the index; the size of the index file. Seen by the coordinator's draft probe on 2026-11-25 (313 files and 2.34 MB, 1,768 files and 14.0 MB; two test suites loading the machine) -- confirm each or write what differs: the bytes 3.6 and 17.5 ms; tomllib.loads 359 and 1,791 ms; with HELD_ITEM 372 and 1,881 ms for the work items; the JSON decode of every parse 12 and 76 ms (pickle 7 and 43 ms); through the index 42 and 183 ms; the index file 2.7 and 15.9 MB; the build from none 2.5 s under FULL and 1.0 s under NORMAL for 313 files, against 0.36 s for their parses alone. The import of flowgraph.cli alone took about 1.0 s (Q-0002, Where a call is written): say it beside the seconds of each command. Write one table per record. Out of bounds: every file under src/ and tests/, README.md, the record of the repository (.fgraph/), pyproject.toml, uv.lock."
check = "grep -q '^## Read index' docs/domain-model.md && grep -q '^### Reads measured' docs/domain-model.md"
