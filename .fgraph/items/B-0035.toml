title = "Add src/flowgraph/record/lock.py: the lock a write takes on the directory of its record"
description = "New module src/flowgraph/record/lock.py (about 60 lines), an adapter of the record as src/flowgraph/record/journal.py is, imported by its module path and not named in src/flowgraph/record/__init__.py. Docstring: a write of the record is made alone -- it takes the lock of the directory of its record before it reads and holds it through its commit, so two fgraph run at one time never read the same ids or write the same file (B-0035); the lock is flock of fcntl on the directory itself, so no file is added and git sees nothing; it is that of one copy of the record, so the worktree of a work item has its own; Linux and macOS alone. It holds: class LockedError(Exception), a record another fgraph is writing; Wait = Callable[[float], object], an alias of its own with its comment line, since record imports nothing of status; LockRecord = Callable[[Path], AbstractContextManager[None]], with its comment line saying it raises LockedError; TRIES = 100 and PAUSE = 0.1, ten seconds in all; BEING_WRITTEN = '{record} is being written by another fgraph: run the command again'; and lock_files(record: Path, wait: Wait, tries: int = TRIES, pause: float = PAUSE) -> Iterator[None] under contextlib.contextmanager: os.open(record, os.O_RDONLY), then up to tries times fcntl.flock(descriptor, fcntl.LOCK_EX | fcntl.LOCK_NB), calling wait(pause) after each BlockingIOError but the last; given none it raises LockedError(BEING_WRITTEN) with the record as given; it yields; the descriptor is closed in a finally, which gives the lock back, also when the lock was refused. Probed on 2026-11-24: a second descriptor of one process is refused while the first holds the lock and takes it once the first is closed, and the directory holds no new file. src/flowgraph/parser/not_given.py (39 lines, about 46 after): no_lock(record: Path), a context manager that locks nothing, the lock of a run given none, and one clause for it in the docstring of the module. Red first: LockedError and the constants whole, lock_files as a typed stub raising NotImplementedError, the tests seen failing for their own reason. New tests/record/lock/test_lock_files.py (about 90 lines), edge as its pytestmark, one assert per test, on tmp_path, the wait the append of a list so nothing sleeps: the body runs with the lock taken (a second lock_files of the same directory with tries=1, inside it, raises LockedError); after the block it is taken again; a lock refused with tries=3 has waited [0.1, 0.1]; with tries=1 it has waited []; the message is BEING_WRITTEN with the directory; the lock is given back when the body raises; a refused lock leaves none behind (a take after the holder is released passes); the directory lists no file after a take; the locks of two directories do not meet; no_lock runs its body. Nothing calls lock_files yet: the xfail marks of tests/functional/test_writes_at_one_time.py stay. Out of bounds: src/flowgraph/cli.py, src/flowgraph/parser/refusals.py, src/flowgraph/record/store.py and __init__.py, the docs."
