description = "One new file, no source change: tests/functional/test_add_task_guard.py (about 170 lines), functional as its pytestmark, one assert per test. Copy from tests/functional/test_complete_task_check.py: NOW, CRITERION, TITLE, ADD_STORY, WORKTREE, ON, IDENTITY, Outcome, fgraph(argv, cwd) with run_check=run_gate, git(cwd, *args), the autouse fixture environment, and started_task; if any is not there under these names, stop and say so. started_task becomes started_task(tmp_path, *extra): the Task is added with --output \"changed: work.txt\", --check true and the extra argv, here [\"--guard\"]; each step's outcome is kept, and a guard skips the later steps when one fails, so the fixture runs to its end under red. worked(worktree) writes work.txt, runs fgraph([\"commit\", \"T-0001\", \"--message\", \"feat: the work\"], worktree) and returns git rev-parse HEAD; use fgraph commit and not raw git, since its subject cites the Task (src/flowgraph/development/commit_task.py:56-57), so once B-0047 lands this test also proves a guard skips the red proof. Module fixture guarded: added = the outcome of the add; shown = fgraph([\"show\", \"S-0001\"], worktree).out; shown_json = json.loads of show --format json; briefed = json.loads(fgraph([\"brief\", \"S-0001\", \"--format\", \"json\"], worktree).out); before = tomllib.loads of worktree/.fgraph/items/S-0001.toml, its [\"tasks\"][0]; sha = worked(worktree); completed = fgraph([\"complete\", \"T-0001\", \"--commit\", sha], worktree); after = the same table read again. XFAIL = pytest.mark.xfail(strict=True, reason=\"S-0190: fgraph add task takes no --guard\"). Red, each under XFAIL: added.out == \"added T-0001 to S-0001\\n\"; \"    guard            yes\\n\" in shown; shown_json[\"tasks\"][0].get(\"guard\") is True; briefed[\"tasks\"][0].get(\"guard\") is True; before.get(\"guard\") is True; (completed.status, completed.out) == (0, f\"completed T-0001 of S-0001 at {sha}\\n\"); after.get(\"guard\") is True; in a record with no [development], [add story] then [add task ..., --guard] gives (status, last err line) == (2, [\"fgraph: error: a guard needs its check: --guard is given with --check COMMAND\"]). Guards, no mark, from a second fixture added without --guard: no shown line starts with \"    guard\"; the table has no key guard. See each marked test fail under --runxfail on its value (argparse refuses --guard with exit 2), not on the arrangement. Existing tests: none changes; if one fails, stop and say which. Out of bounds: every file under src/, every other test file, the docs."
check = "uv run pytest tests/functional/test_add_task_guard.py -q -p no:cacheprovider && grep -q xfail tests/functional/test_add_task_guard.py"
expected_output = "created: tests/functional/test_add_task_guard.py states that, on a real git repository with the development on, fgraph add task --guard with --check true adds T-0001; that fgraph show S-0001 lists guard yes under T-0001, its JSON and the JSON of fgraph brief S-0001 give guard true; that .fgraph/items/S-0001.toml holds guard = true in the table of T-0001; that T-0001, started and completed at a work commit made by fgraph commit, exits 0 with completed T-0001 of S-0001 at SHA and its table still holds guard = true; that --guard with the development off and no --check is refused with fgraph: error: a guard needs its check: --guard is given with --check COMMAND; and, as guards, that a Task added without --guard has no guard key and no guard line. Each red test carries a strict xfail naming S-0190"
