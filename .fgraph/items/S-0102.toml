odel.py (128 lines, about 131): note_feature the same. Red first: add make_mark, mark_name and mark_text as typed stubs that raise NotImplementedError and the fields with their defaults, write the tests, see each fail for its own reason, then fill in. tests/knowledge/test_knowledge_mark.py (model marker): a line made with no mark holds UNMARKED; one made with OPEN holds it; make_mark of standing, open and None, parametrized; make_mark(\"fact\") raises MarkError matching ^'fact' is no mark: standing or open$; mark_name of the three, parametrized; knowledge_row of a line marked OPEN has mark \"open\"; mark_text(\"open\") == \"  (open)\"; mark_text(\"\") == \"\". tests/work_item/test_work_item_mark.py (edge marker; constants CHORE, CREATED, ON, ID, BARE copied from tests/work_item/test_work_item_knowledge.py): a line marked STANDING or OPEN, parametrized, is read back equal through write_work_item and read_work_item; read_work_item_detail gives knowledge[0].mark == \"open\"; the table of a line with no mark holds no key mark (tomllib over work_item_path(tmp_path, ID)); a file whose text has mark = \"open\" replaced by mark = \"fact\" raises WorkItemFileError at read_work_item; note_work_item with mark=OPEN saves an item whose last line holds OPEN (load a lambda, save a list's append). tests/feature/test_feature_mark.py (edge; constants from tests/feature/test_feature_knowledge.py): the same four facts through write_feature, read_feature, feature_detail, FeatureFileError and note_feature. Existing tests that change: none; KnowledgeRow and KnowledgeLine gain fields with defaults at their end. Out of bounds: src/flowgraph/feature/note.py, src/flowgraph/parser/, src/flowgraph/status/, src/flowgraph/knowledge/list.py, tests/functional/ (the xfail marks stay: the option is not there yet). If B-0026 has landed, the noted field of KnowledgeFile is a HeldTime: leave it as found."
