description = "New module src/flowgraph/status/frame.py (about 60 lines), pure, shaped as src/flowgraph/status/waits.py: a docstring saying it holds what a frame of fgraph watch adds to what fgraph status lists, the progress of the record and the time of the frame (S-0105, narrowed by the developer on 2026-11-23), computed from the rows status lists and from a time given to it; it reads no store and no clock. @dataclass(frozen=True) class Progress with completed: int and held: int. def record_progress(rows: Iterable[WorkItemRow | FeatureRow]) -> Progress, by an exhaustive match closed by assert_never: a WorkItemRow adds one to held unless its state is removed and one to completed when its state is completed; a FeatureRow adds its own completed and held, which count the work items under it with a removed one not held (src/flowgraph/feature/views.py, feature_row). The rows are those of status_rows of src/flowgraph/status/view.py, where a work item under a Feature of the record is on no row of its own but for a removed one, which adds nothing, so none is counted twice; say so in the docstring. def frame_head(progress: Progress, at: datetime) -> str: f\"{progress.completed}/{progress.held} W  {at.isoformat(sep=' ', timespec='seconds')}\\n\". Imports: FeatureRow of flowgraph.feature, WorkItemRow of flowgraph.work_item, the state words COMPLETED of flowgraph.status.rows (made by U-0026) and the removed state as that module or flowgraph.feature.views names it; nothing else of status/. Not exported from src/flowgraph/status/__init__.py: the next Task imports from the module. Red first: Progress whole, the two functions as typed stubs that raise NotImplementedError, the tests seen failing for their own reason. New tests/status/test_frame.py (about 70 lines), view as its pytestmark, one assert per test, rows built as tests/status/text/test_status_features.py builds them: no row gives Progress(0, 0); a completed, a started and a Backlog row give Progress(1, 3); a removed row is not held; a FeatureRow holding 2 completed of 5 adds Progress(2, 5); a Feature beside a row standing alone sums both; a removed row under a Feature beside that Feature adds nothing; frame_head(Progress(1, 3), datetime(2026, 1, 1, 12, 30, 5, tzinfo=UTC)) is \"1/3 W  2026-01-01 12:30:05+00:00\\n\". The xfail marks of tests/functional/test_watch_frame.py stay. Out of bounds: src/flowgraph/status/view.py, text.py and watch.py, src/flowgraph/cli.py, the docs."
check = "uv run pytest tests/status/test_frame.py tests/functional/test_watch_frame.py -q -p no:cacheprovider && grep -q \"^def frame_head\" src/flowgraph/status/frame.py && make lines"
