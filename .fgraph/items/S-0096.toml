description = "A move with no change of behavior, the suite its guard: the three keys F-0012 adds (development.mode here, development.branch_max in S-0098, development.approver in S-0099) would take src/flowgraph/record/config.py (230 lines today) past the 250 make lines allows; this Story alone takes it to about 249. Change src/flowgraph/record/config.py (230 lines, about 190 after) and add src/flowgraph/record/config_file.py (about 60 lines) only. Move, as written, the classes _Table, _GitTable, _DevelopmentTable, _DeliveryTable and _ConfigFile with their docstrings and comments into the new module. There _ConfigFile is renamed ConfigFile, the one public name; the four others keep their underscore, since no other module names them. The new module imports BaseModel, ConfigDict and Field of pydantic and Driver, Merge and TagAt of flowgraph.record.layers, and nothing of flowgraph.record.config, so no cycle closes. Its docstring, one paragraph: what config.toml may hold, a table per layer, each key with its type and its default, strict so no value is read as another type; flowgraph.record.config builds the configuration of it. In config.py: import ConfigFile from flowgraph.record.config_file; make_config calls ConfigFile.model_validate; the pydantic import keeps ValidationError alone; the import of flowgraph.record.layers drops the names config.py no longer uses (Driver, Merge, TagAt). The last sentence of the module docstring of config.py names the new module beside flowgraph.record.config_refusal. Keep in config.py: CONFIG, every key constant, Config, LoadConfig, Settings, LoadSettings, SaveSettings, ConfigError, make_config, make_settings, settings_text, _read, read_config, read_settings, write_settings. No test is added: no test names a class moved (grep -rn \"_ConfigFile\\|_DevelopmentTable\" tests finds nothing), and tests/record/config, tests/record/setting and tests/functional/test_config_refused.py pass untouched, which proves the move. Out of bounds: src/flowgraph/record/layers.py, config_refusal.py, setting.py, __init__.py, every test file, the docs."
