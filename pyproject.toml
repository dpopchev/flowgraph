[project]
name = "ramean"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dimitar popchev", email = "dpopchev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ramean = "ramean:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

# Tool residuals live in local/python/ (mk/python.mk): a tool with a cache key is
# pointed there here, a tool that only reads the environment in mk/python.mk.

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --doctest-modules --import-mode=importlib --strict-markers"
cache_dir = "local/python/pytest"

[tool.ruff]
line-length = 100
cache-dir = "local/python/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pyright]
exclude = ["**/__pycache__", ".venv", "build", "local"]
typeCheckingMode = "standard"
reportImportCycles = "error"
venvPath = "."
venv = ".venv"
