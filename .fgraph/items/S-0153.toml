[criterion]
given = "a repository with the development on and a started work item whose started Task names the files it changes, in a worktree where a file it names and a file it does not name are changed and not committed"
when = "the agent asks fgraph, before the commit, which changed files the brief of the Task does not name"
then = "it lists the file the brief does not name and not the one it names, by the rule fgraph complete of the Task holds the commit to (S-0142), and writes nothing"

