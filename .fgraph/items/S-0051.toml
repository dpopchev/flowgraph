title = "Raise the Features fgraph reorder places in the queue of the Backlog from none to every one"
description = "Part of F-0002. The developer's words of 2026-11-21, in the agent's wording: a Feature is part of the Backlog and just holds a couple of work items; starting it, when git is used for the development as well, starts its work items one by one in separate branches; they are completed but all stay in progress; when all are completed the Feature moves to Completed; a Feature can be blocked, or gets blocked when its child work item is blocked. The principle the plan was shown under: a Feature is to its work items what a work item is to its Tasks. Filed on the developer's 'file' of 2026-11-21. Its Tasks are written when it is ordered. Refiles S-0047, which stood alone. Readings of the agent: fgraph reorder takes the id of a Feature on either side, as a work item's; queue.toml places Features by id beside the work items; a Feature that is not in Backlog is refused as a work item is. Open: whether a work item under a Feature is still reordered, among the work items of that Feature alone -- that order is the one its work items start in."
parent = "F-0002"
