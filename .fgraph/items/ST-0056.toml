description = "Part of F-0002. The developer's words of 2026-11-21, in the agent's wording: a Feature is part of the Backlog and just holds a couple of work items; starting it, when git is used for the development as well, starts its work items one by one in separate branches; they are completed but all stay in progress; when all are completed the Feature moves to Completed; a Feature can be blocked, or gets blocked when its child work item is blocked. The principle the plan was shown under: a Feature is to its work items what a work item is to its Tasks. Filed on the developer's 'file' of 2026-11-21. Its Tasks are written when it is ordered. Readings of the agent: only a started Feature is blocked, with its reason and what it waits on, as a Task is; while it is blocked no further work item of it starts and the started one goes on -- the alternative, every write under it refused, was shown and not taken; fgraph unblock takes it back to started, with the started time it had, and starts its next work item when none is started."
