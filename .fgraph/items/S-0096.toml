id = "S-0096"
state = "backlog"
title = "Raise the modes of the development from one, a branch per work item, to two: the trunk"
description = "The words of the note: work on main, no worktree. Its Tasks are written when it is ordered."
parent = "F-0012"
complexity = "medium"
created = 2026-11-22 21:03:41+00:00
depends_on = [
    "B-0023",
