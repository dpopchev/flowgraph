id = "S-0190"
state = "backlog"
title = "Raise the Tasks a check meant to pass on its first run is accepted for, with that word recorded, from none to every one marked a guard"
description = "From the inbox note 2026-11-27-claude-complete-without-red of the session of ~/.claude, filed as written. Pairs with the Bug of complete without a red."
parent = "F-0040"
