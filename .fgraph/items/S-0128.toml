[[knowledge]]
kind = "decision"
text = "The developer decided on 2026-11-23: the items of a record stay in one directory, items/, one file per item with its state inside; a bucket is never a folder. Weighed that day against a folder per bucket: the bucket would be kept twice, in the folder and in the state, so a file could sit in the wrong one; every move would be a rename with an edit, which git often loses; a started item is written on its branch while main would move its file; and an id would be looked for in four places. One table of items with the state as a field is also the shape a store other than files would take. Left for S-0120 and F-0014: a single split of live items from an archive of the completed and removed ones, which are terminal."
