ller changes. src/flowgraph/record/config_refusal.py (52 lines, about 58 after): a value of \"archive.board\" refused says it takes a path, looked up by the dotted key before the type of the error (a constant \"a path\" and a mapping by key, as _WORDS is by key), so string_type and string_pattern_mismatch on that key no longer read a command line; every other key says what it said. Red first: add the Config field, the table and make_archive as a typed stub that raises NotImplementedError, write the tests, see each fail for its reason, then the body. Tests in tests/record/config/test_config.py (313 lines, about 350 after), each with the word archive in its name, edge as the file is: make_config(text).archive == UNARCHIVED for \"\" and \"[archive]\\n\" (parametrized); == Archived(\".board\") for '[archive]\\nboard = \".board\"\\n'; == Archived(\"../old/.board\") as written; values '\"\"', '\"  \"', \"1\", \"true\" and '[\".board\"]' are refused with f\"archive.board is {value}: it takes a path\", shaped as test_a_gate_that_is_no_command_line_is_refused_naming_the_key; '[archive]\\nboards = \".board\"\\n' gives archive.boards is no key of the configuration and \"archive = true\\n\" gives archive is true: it takes a table, as two new rows with ids of test_a_text_refused_names_the_key. Out of bounds: src/flowgraph/record/layers.py (the archive is no layer a configuration turns on), src/flowgraph/record/setting.py (the next Task), src/flowgraph/record/__init__.py, src/flowgraph/record/init.py (INITIAL stays: init writes no pointer), every parser module, tests/functional/ (every xfail mark stays: no command reads the key yet)."
