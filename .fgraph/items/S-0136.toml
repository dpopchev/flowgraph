e Backlog and the four of Completed (the flag wins); status under KEYS still holds the heading of Completed. XFAIL_LINES tests, under KEYS: the lines of status from the heading of the Backlog to that of InProgress are the heading, the lines of S-0005 and S-0006, then `  ... 1 more, 0 can start`; from the heading of Completed on they are the heading, S-0004, S-0003, S-0002, then `  ... 1 more`; status --backlog lists the three lines of the Backlog and no more-line, and Completed still three (--backlog replaces the backlog alone); under '[status]\\nbacklog = \"all\"\\n' a plain status lists all three; under '[status]\\nin-progress = 1\\n' on a record with two started Stories InProgress lists one line then `  ... 1 more`; under the [status] table of KEYS alone, watch --count 1 prints what status prints. XFAIL_WATCH tests, under KEYS: the headings of the frame of watch --count 1 (the lines matching ^\\S+ \\(\\d+\\)$) are those of the Backlog and of InProgress alone; watch --all --count 1 holds the same two headings, each bucket whole. Guards, no mark, on BUILT with no config.toml: status lists one line of the Backlog then `  ... 2 more, 0 can start` and all four of Completed; watch --count 1 holds three headings. Write every heading, bracket and mark as the checkout prints it when this Task runs (S-0130 to S-0135 have landed) and read each literal from a run: under --runxfail every marked test fails on its assert, none on the arrangement. Out of bounds: every file under src/, every other test file, the docs."
