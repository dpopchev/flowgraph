text = "Ruled by the coordinator on 2026-11-25 while writing its Tasks, under the /goal of Phase 1 the developer set on 2026-11-24, which has the coordinator write the Tasks before a Feature starts; the developer was not asked and reviews them at the close: (1) The open question: a text that is no id and no term (or a term name the record holds no term of) is read as the path of a file when it is on the disk, when a line governs it (both as today), or when a commit of the history of HEAD changed a file at exactly that path from the top of the work tree -- one 'git --literal-pathspecs log --full-history --no-renames --format= --name-only -z HEAD -- PATH', 0.05 to 0.2 s on this repository. (2) Not chosen: reading a text as a path only when a commit the record names changed it; it fits the title word for word but runs two git processes per completed item and Task (about 9 s on this repository, where fgraph about README.md takes 29 s) on every refused mistyped id, which already takes 20 s today. (3) Left refused, exit 2, words unchanged: a mistyped id or term no commit ever changed as a file (S-00O1, nope), a path git never knew, a pattern (*.txt, read literally), a directory (sub, even one whose files were deleted), a file only a branch HEAD does not hold changed, a path outside a git work tree or leading out of it, any path in a repository with no commit, and a text written as an item id (it is shown as the item, as today). (4) A deleted file only commits outside the record touched is answered no commit of the record touched PATH, exit 0, as a file on the disk is, not refused. (5) A file renamed since is answered under its old name (--no-renames), listing the items whose commits changed the old path. (6) The JSON of a deleted file is the FileLinks of S-0156 unchanged: path as given, kind file, governed_by, touched_by; no key added (one guard of the first Task pins touched_by). (7) The git read is a new adapter in a new module src/flowgraph/development/history_git.py (