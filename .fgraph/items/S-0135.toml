-0001`] (the brackets are those of S-0131); a blocked work item gives its line ending with its title, then `  waiting on <who>: <why>`, then its Task line; a blocked Task under a work item standing alone gives [`    !  T-0001  a task title`, `       waiting on the reviewer: the review is not back`], seven columns in, under the id of the Task; a superseded one gives the line then `  superseded by S-0002, <reason>`; no line of any of these outputs holds `  -- `; watch --all --count 1 on the blocked Feature gives the same pair. Marked XFAIL_FEATURE: the removed Feature gives [`  F-0001  a feature title`, `  <its reason>`]. Guards, no mark, passing today and after: a Story in Backlog that waits for nothing is followed by the next item or heading; status --format json on the blocked Feature holds block.waiting_on \"the sponsor\", the document unchanged. Read every literal from the run before it is marked. Out of bounds: every file under src/, every other test file, the docs."
