title = "Complete a Spike whose file holds a decision and no answer through a settle given to completed_work_item, so no started work item holds an Answer"
description = "FIRST PASS, written on 2026-11-25 before Phase 2 was completed: the coordinator reviews this Task before its Feature starts (U-0037, its decision of 2026-11-25). If no later line of U-0037 says its Tasks were reviewed, stop and say so. A step inside the work item, after U-0035 and U-0036 (it uses NoReply): no behavior changes. Today item_held reads the file of a Spike completed before its answer was taken by replacing the criterion of the started work item with answered_before(...) and completing it with no decision (grep -n 'answered_before' src/flowgraph/work_item/primitives.py). For that moment the code itself builds a started work item that holds an Answer, the state the next Task makes unbuildable. Two files. (1) src/flowgraph/work_item/moves.py (160 lines on 2026-11-25, about 166 after): the comment line '# The criterion a completion leaves: from the criterion, the decision given and the name of the item; raises the refusal of the decision.' and Settle = Callable[[Criterion, Decision | None, str], Criterion], after the imports (Callable from collections.abc, Criterion beside Answer, Decision, Evidence, settled from flowgraph.criterion); completed_work_item(item, on, commit, decision=None, settle: Settle = settled), whose StartedWorkItem branch calls settle(item.criterion, decision, work_item_id_text(item.id)) where it calls settled today, still after all_completed, so the order of its refusals stays; the docstring gains: settle is the rule that leaves the criterion, settled by default. (2) src/flowgraph/work_item/primitives.py (about 220 lines after U-0035, about 225 after): add _settled_as_held(criterion: Criterion, decision: Decision | None, named: str) -> Criterion, docstring 'The criterion the file of a completed item holds: a hypothesis whose decision has no yes or no was answered before it was taken; any other as settled leaves it.'; it returns answered_before(criterion.question, decision.text) when criterion is a Hypothesis and decision is a Decision whose answer is NoReply, else settled(criterion, decision, named) (settled and Decision imported from flowgraph.criterion). In item_held, the CompletedItemFile branch drops question = begun.criterion and the if block that replaces the criterion and sets decision = None, and calls done = completed_work_item(begun, held.completed, commit, decision, _settled_as_held); return _verified(done, held) as today. The refusals of a file stay word for word: a decision with a blank text is EmptyPartError naming decision (answered_before and settled both use said), and a Story file with a decision is DecisionError 'takes no decision'. A completed file holds only completed or removed Tasks (DoneTask of src/flowgraph/item/file.py), so all_completed never refuses before the decision on a read, and the order of its refusals is as before. No new test: the path is proven by tests/work_item/test_work_item_answer.py test_a_file_holding_a_decision_and_no_answer_is_read_as_before, and test_a_hypothesis_completed_with_a_decision_and_no_answer_is_refused_naming_it proves the command still refuses NoReply. Run them before and after. Red first: the check fails before the change on its grep of Settle; the named tests pass before and after. Existing tests: none changes; if one fails, stop and say which. Out of bounds: src/flowgraph/criterion/ (no room left in model.py: settled stays as it is), src/flowgraph/item/, every other file of src/ and tests/, the docs; run uv run ruff format on the two files."
check = "uv run pytest tests/work_item/test_work_item_answer.py tests/work_item/test_work_item_hypothesis.py tests/work_item/test_work_item_evidence.py tests/work_item/test_work_item_file.py tests/work_item/test_work_item_moves.py tests/functional/test_complete_spike.py tests/functional/test_complete_spike_answer.py -q -p no:cacheprovider && grep -q '^Settle = ' src/flowgraph/work_item/moves.py && ! grep -q 'replace(begun, criterion=' src/flowgraph/work_item/primitives.py && uv run python -c \"from pathlib import Path; import tomli_w; from flowgraph.record.store import KINDS; from flowgraph.work_item import read_work_item, parse_work_item_id; from flowgraph.work_item.primitives import item_primitives; r = Path('.fgraph'); print(sum(tomli_w.dumps(item_primitives(read_work_item(r, parse_work_item_id(k, p.stem), KINDS))) != p.read_text(encoding='utf-8') for k in KINDS for p in (r / 'items').glob(k.prefix + '-*.toml')))\" | grep -qx 0 && make lines && uv run pyright"
expected_output = "changed: completed_work_item of src/flowgraph/work_item/moves.py takes settle: Settle = settled, the criterion its completion leaves; item_held of src/flowgraph/work_item/primitives.py completes such a Spike with _settled_as_held and no longer puts an Answer on a started work item (no replace(begun, criterion=...) is left). Every work item file of the record reads and writes back with the bytes it had and every command prints what it printed before"
