ies {tools: {listChanged: true}}, an unknown method -32601, an unknown tool the JSON-RPC error -32603, refused arguments and a failed tool a result with isError true, and a success {content: [{type: text, text}]} with no isError. Write each message and each reply as a short sh block of the JSON, cut to its keys where long. Out of bounds: every file under src/ and tests/, README.md, the configuration of claude (~/.claude.json, .mcp.json of any repository)."
