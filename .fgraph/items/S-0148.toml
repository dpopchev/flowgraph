id = "S-0148"
state = "backlog"
title = "Raise the work items fgraph remove takes from one in Backlog to a started one too"
description = "Filed on the word of the developer of 2026-11-23, picked from the map made that day of what the skills and rules of ~/.claude ask of board 1 that fgraph does not do and no Backlog item builds, so that those skills can call fgraph in its place. In board 1: the prune of a doing work item, its open Tasks pruned with it, and board land --prune. Its Tasks are written when it is ordered."
complexity = "high"
created = 2026-11-23 20:39:10+00:00
depends_on = [
    "S-0147",
    "U-0025",
]

[criterion]
given = "a repository with the development on and a started work item that holds Tasks in Backlog, started and completed"
when = "fgraph remove of the work item is run with a reason"
then = "it is listed under Removed with its reason, its Tasks that were not completed removed with it, and it is no longer started, so the limit of development.parallel counts it no more"

