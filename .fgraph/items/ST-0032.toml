title = "Raise the Features fgraph status lists with their progress from none to every one"
description = "The developer's request of 2026-11-21: 'when it is a feature shows also how many work items are to be done'. The readings the developer agreed with 'go' on 2026-11-21: (1) the progress is written as board watch of board 1 writes it, '<completed>/<all> W', after the id: '  F-0001  1/2 W  InProgress  <title>'. (2) Every Feature is listed with it, in any bucket; one without a work item reads 0/0 W. (3) A removed work item is counted in neither number. (4) The derived bucket moves before the title, so that the cut of ST-0036 keeps it."
created = 2026-11-21 17:40:33+00:00

[criterion]
given = "a record with a Feature and two Stories under it, one of them completed"
when = "fgraph status is run"
then = "it lists the Feature with 1/2 W, its work items completed of all"
