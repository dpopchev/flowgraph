description = "The supersede is stored on the LATER line alone, as a relation is stored on the item that names it (docs/domain-model.md, Relations): the earlier line is never rewritten, and the file a supersede writes is the file of the item the later line is noted on. src/flowgraph/knowledge/model.py (about 150 lines after S-0102, about 172): KnowledgeLine gains supersedes: tuple[str, ...] = () after mark, as about and governs are kept, texts checked by the command that notes them; KnowledgeRow gains supersedes: list[str] and superseded_by: list[str], both field(default_factory=list[str]) after mark, the second documented as the refs of the lines that supersede this one, set by the view that reads the record and empty as the item holds it; make_knowledge_line gains a last parameter supersedes: tuple[str, ...] = (); knowledge_row passes list(line.supersedes); def line_ref(item: str, place: int) -> str returning f\"{item}#{place}\", its docstring: the ref of the line at that place among the lines of the item of that id, counted from 1 in the order noted, stable because a line is never amended or removed and is added after the lines the item keeps; def superseded_text(refs: Sequence[str]) -> str, \"  (superseded by S-0001#2, S-0002#1)\" for two and empty for none, beside governs_text. The module docstring says a line is never amended or removed and a later line supersedes one by naming its ref. src/flowgraph/knowledge/__init__.py (about 44, about 46): name line_ref and superseded_text. src/flowgraph/item/file.py (about 186, about 191): KnowledgeFile gains supersedes: list[str] = []; knowledge_primitives writes \"supersedes\" last, after governs, only when the line names some; knowledge_held passes tuple(held.supersedes) to its three make_knowledge_line calls. src/flowgraph/work_item/file.py (about 196, about 197): the KnowledgeRow of read_work_item_detail gains line.supersedes as its seventh value. src/flowgraph/work_item/commands.py (about 160, about 163): note_work_item gains the keyword supersedes: tuple[str, ...] = () and passes it on. src/flowgraph/feature/model.py (about 131, about 134): note_feature the same. Red first: line_ref and superseded_text as typed stubs that raise NotImplementedError, the fields and parameters with their defaults, the tests, each seen failing for its own reason. tests/knowledge/test_knowledge_supersedes.py (model marker): a line supersedes none by default; it holds the refs given in order; knowledge_row lists them; the superseded_by of that row is empty; line_ref(\"S-0001\", 2) == \"S-0001#2\"; superseded_text([]) == \"\"; superseded_text([\"S-0001#2\", \"S-0002#1\"]) == \"  (superseded by S-0001#2, S-0002#1)\". tests/work_item/test_work_item_supersedes.py (edge; constants as tests/work_item/test_work_item_mark.py): an item with FIRST and a SECOND made with supersedes=(line_ref(\"CH-0001\", 1),) is read back equal through write_work_item and read_work_item; read_work_item_detail gives knowledge[1].supersedes == [\"CH-0001#1\"]; the table of FIRST read with tomllib is equal before and after SECOND is added and written; the table of a line that names none holds no key supersedes; note_work_item with supersedes=(\"CH-0001#1\",) saves an item whose last line holds it. tests/feature/test_feature_supersedes.py (edge): the same through write_feature, read_feature, feature_detail and note_feature. Existing tests that change: none. Out of bounds: src/flowgraph/knowledge/list.py, src/flowgraph/feature/note.py, src/flowgraph/parser/, src/flowgraph/status/, tests/functional/."
