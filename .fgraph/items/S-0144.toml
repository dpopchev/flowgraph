id = "S-0144"
state = "backlog"
title = "Raise the Tasks in Backlog fgraph amend takes from none to every one: its title, its output, its check and its description"
description = "Filed on the word of the developer of 2026-11-23, picked from the map made that day of what the skills and rules of ~/.claude ask of board 1 that fgraph does not do and no Backlog item builds, so that those skills can call fgraph in its place. In board 1: board amend of a todo Task: its action, output and check. Its Tasks are written when it is ordered."
complexity = "medium"
created = 2026-11-23 20:38:49+00:00
depends_on = [
    "S-0100",
    "U-0025",
]

[criterion]
given = "a work item that holds a Task in Backlog and a started Task"
when = "fgraph amend of the Task in Backlog is run with a new title, output, check or description, and fgraph amend of the started Task"
then = "the Task in Backlog holds the parts given and keeps the others, and the started Task is refused, exit 2, naming its state, nothing written"

[[tasks]]
id = "T-0544"
state = "backlog"
title = "Move the parser of amend from src/flowgraph/parser/item_commands.py into src/flowgraph/parser/amend.py"
description = "A move with no change of behavior: no new test, the suite is its guard, a refactoring under green. It makes the room the two options of this Story need: src/flowgraph/parser/item_commands.py holds 241 of the 250 lines make lines allows. New module src/flowgraph/parser/amend.py (about 45 lines), shaped as src/flowgraph/parser/brief.py (23 lines) and src/flowgraph/parser/start.py (30 lines): a one-line docstring saying it is the parser of amend, the item whose parts are rewritten and each part by its own option; imports argparse and Commands, new_command from flowgraph.parser.base; one function amend_command(commands: Commands) -> argparse.ArgumentParser whose body is lines 24 to 55 of item_commands.py today moved as they are -- new_command(commands, \"amend\", \"rewrite parts of a work item or a Feature in Backlog\"), the ID argument and the thirteen options from --title to --about, in that order, each metavar and help text unchanged -- and which returns the parser. In src/flowgraph/parser/item_commands.py (241 lines, about 211 after): add from flowgraph.parser.amend import amend_command beside the imports of brief_command and start_command; the first statement of item_commands becomes amend = amend_command(commands), where the moved lines were; the dict it returns is untouched, so amend keeps its place in the help menu. Before the move keep the output of uv run fgraph amend --help and of uv run fgraph --help; after it see both print the same text. Run make check (ruff, make lines, pyright, the suite) and see it pass with no test file changed. Out of bounds: src/flowgraph/parser/arguments.py, src/flowgraph/parser/command.py, src/flowgraph/parser/base.py, every test file, README.md and docs/domain-model.md, neither of which names the module. No option is added in this Task."
check = "test \"$(wc -l < src/flowgraph/parser/item_commands.py)\" -le 215 && grep -q \"^def amend_command\" src/flowgraph/parser/amend.py && make check"
expected_output = "created: src/flowgraph/parser/amend.py holds amend_command(commands), the parser of fgraph amend with the options and the help texts it has today; changed: item_commands of src/flowgraph/parser/item_commands.py calls it and the module holds 215 lines or fewer; fgraph amend --help and fgraph --help print what they printed before, and no test file changes"
