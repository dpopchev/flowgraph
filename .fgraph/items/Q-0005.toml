e draft: an open of an index of 313 rows, WAL set, 3.6 ms with none to remove and 8.7 ms with one); a file whose parse raises (no TOML), whose row is never written, so the refusal of fgraph stays word for word. The verdict, weighed on those times: the hash at every read, a stat alone, or a stat then the hash. Out of bounds: every file under src/ and tests/, README.md, the record of the repository (.fgraph/), pyproject.toml, uv.lock."
