he item found by its id across the buckets; brief --format json lists the same three (id, state, reason). After REMOVED, start T-0003 and complete T-0003: ? S-0001  1/1 T  a title is among the lines status lists; complete S-0001 gives (0, \"completed S-0001\\n\"); after it show lists its lines starting with four spaces and bucket as Removed, Removed, Completed. After RECORD and the remove of all three Tasks:   S-0001  0/0 T  a title is among the lines status lists; in a test of its own, complete S-0001 gives (0, \"completed S-0001\\n\"). After RECORD and block T-0001 --reason \"no key\" --waiting-on developer, remove T-0001 --reason \"a reason\" gives (0, \"removed T-0001 of S-0001\\n\"). One parametrized test on (exit, last line of the error output), each parameter a pytest.param with marks=XFAIL and an id: after RECORD and complete T-0001, remove T-0001 is (2, T-0001 is completed already); DROP_WAITING twice, T-0002 is removed already; remove T-0002 with a reason of one space, reason is empty; remove T-0009, no Task T-0009 in the record; remove T-0000, a Task id counts from 1: 0 is below 1; remove X-0001, 'X-0001' is no Story, Upkeep, Bug, Spike, Task or Feature id; remove T-0001 --superseded-by S-0001, T-0001 is a Task: it is removed with --reason alone; the Task of a Story never started, T-0001 cannot be removed: S-0001 is in Backlog; after RECORD and block S-0001 --reason \"no key\" --waiting-on developer, T-0002 cannot be removed: S-0001 is blocked, waiting on developer: unblock it first; after REMOVED, start T-0002, complete T-0002 and block T-0002 --reason r --waiting-on w, each T-0002 is removed already. Guards, no mark, passing today: after RECORD, complete S-0001 is refused S-0001 has Tasks to complete first: T-0001, T-0002, T-0003; remove S-0009 --reason r is no Story S-0009 in the record. See each marked test xfail and each guard pass, then run the file with --runxfail and see each marked one fail. Where a test named red passes today, pair its fact with