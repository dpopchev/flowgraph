description = "FIRST PASS, written on 2026-11-25 before Phase 2 was completed: the coordinator reviews this Task before its Feature starts (U-0035, its decision of 2026-11-25). If no later line of U-0035 says its Tasks were reviewed, stop and say so. A step: no behavior changes. Follow the pattern of Evidence = Commit | NoCommit of src/flowgraph/criterion/model.py and of Realizes = CriterionPlace | NoCriterion of src/flowgraph/parent/realizes.py: none is a value, not a missing one. Seven source files and one test file, each place found by grep. (1) src/flowgraph/work_item/agent.py (57 lines on 2026-11-25, about 68 after): right after class Agent, add @dataclass(frozen=True) class NoAgent, docstring 'A work item handed to no agent: none is a value of its agent, not a missing one.'; then the comment line '# The one value of no agent.' and NO_AGENT = NoAgent(); then the comment line '# The agent a started, blocked or completed work item is handed to, or none.' and Handed = Agent | NoAgent. agent_written(text: str) -> Handed gives NO_AGENT for the empty text (docstring: NO_AGENT for the empty text a work item without one holds). make_agent, AgentError and check_agent_taken stay as they are. (2) src/flowgraph/work_item/model.py (248 lines on 2026-11-25, the same after; make lines holds 250): the import from flowgraph.work_item.agent becomes NO_AGENT, Handed (Agent is named nowhere else there: grep to see); the three fields agent: Agent | None = field(default=None, kw_only=True) of StartedWorkItem, BlockedWorkItem and CompletedWorkItem become agent: Handed = field(default=NO_AGENT, kw_only=True). (3) src/flowgraph/work_item/handed.py (78 lines): handed_work_item(started: StartedWorkItem, agent: Handed) -> StartedWorkItem, docstring 'The started work item handed to the agent, or to none.'; import Handed beside Agent; agent_text keeps its match as it is. (4) src/flowgraph/work_item/commands.py (169 lines): start_work_item takes agent: Handed = NO_AGENT; its import of Agent becomes NO_AGENT, Handed. (5) src/flowgraph/work_item/moves.py (160 lines): in started_work_item, the line holder = ... if item.agent is not None else '' (grep -n 'holds it' src/flowgraph/work_item/moves.py) becomes name = agent_text(item) then holder = f': {name} holds it' if name else '', agent_text imported from flowgraph.work_item.handed (handed imports model alone, so no cycle: uv run pyright reports reportImportCycles). The refusal stays word for word: S-0001 is started already: sonnet-a1 holds it. (6) src/flowgraph/item/moves.py, start_item (grep -n 'handed = None' src/flowgraph/item/moves.py): handed = NO_AGENT if agent is None else make_agent(agent); NO_AGENT added to its import from flowgraph.work_item.agent. (7) src/flowgraph/feature/start.py, start_feature_item (grep -n 'handed = None' src/flowgraph/feature/start.py): the same line; NO_AGENT added to its import from flowgraph.work_item.agent. The arguments of a command stay str | None: none there is an argument not given, as realizes_asked of src/flowgraph/parent/realizes.py gives None for --realizes not given. The file edge does not change: StartedItemFile, BlockedItemFile and CompletedItemFile of src/flowgraph/work_item/held_file.py keep agent: str = '', and _agent_primitives of src/flowgraph/work_item/primitives.py writes the key only when agent_text is not empty, as today; item_held still calls handed_work_item(begun, agent_written(held.agent)) and needs no edit. Existing tests that change, tests/work_item/test_work_item_agent.py only, four asserts, their names kept: agent_written('') is None becomes agent_written('') == NO_AGENT; UNHANDED.agent is None becomes == NO_AGENT; handed_work_item(UNHANDED, None) becomes handed_work_item(UNHANDED, NO_AGENT); done.agent is None becomes == NO_AGENT; NO_AGENT imported from flowgraph.work_item.agent. No new test: NoAgent is a value with no behavior, and the bytes are proven by the probe of the check and by the tests of that file that a file holds the key agent only when it has one and that one without it reads back as none. Red first: the check fails before the change on its grep of Handed; run the named tests and the byte probe before the change and see them pass. The byte probe is the uv run python -c part of the check: it prints how many work item files of .fgraph/items differ once read and written again as write_work_item writes them (tomli_w.dumps(item_primitives(read_work_item(...)))); it printed 0 for 255 files on 2026-11-25, 80 of them holding agent. If another test or pyright names a file this Task does not, stop and say which. Out of bounds: verified and superseded_by (the next two Tasks), src/flowgraph/work_item/held_file.py, file.py, primitives.py, projection.py, block.py, views.py, every module under status/, brief/, graph/ and about/ (they read WorkItemRow and WorkItemDetail, where the agent is a text), the docs; run uv run ruff format on the changed files."
check = "uv run pytest tests/work_item tests/item tests/feature/test_feature_start.py tests/functional/test_start_agent.py tests/functional/test_start_agent_refused.py tests/functional/test_hand.py tests/functional/test_hand_refused.py tests/status/test_document_agent.py tests/status/text/test_status_agent.py -q -p no:cacheprovider && grep -q '^Handed = Agent | NoAgent' src/flowgraph/work_item/agent.py && ! grep -q 'Agent | None' src/flowgraph/work_item/model.py && uv run python -c \"from pathlib import Path; import tomli_w; from flowgraph.record.store import KINDS; from flowgraph.work_item import read_work_item, parse_work_item_id; from flowgraph.work_item.primitives import item_primitives; r = Path('.fgraph'); print(sum(tomli_w.dumps(item_primitives(read_work_item(r, parse_work_item_id(k, p.stem), KINDS))) != p.read_text(encoding='utf-8') for k in KINDS for p in (r / 'items').glob(k.prefix + '-*.toml')))\" | grep -qx 0 && make lines && uv run pyright"
expected_output = "changed: src/flowgraph/work_item/agent.py holds NoAgent, NO_AGENT and Handed = Agent | NoAgent, and agent_written gives NO_AGENT for the empty text; the field agent of StartedWorkItem, BlockedWorkItem and CompletedWorkItem of src/flowgraph/work_item/model.py is a Handed, NO_AGENT by default; handed_work_item and start_work_item take a Handed. Every work item file of the record reads and writes back with the bytes it had and every command prints what it printed before"
