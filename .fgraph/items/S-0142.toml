id = "S-0142"
state = "backlog"
title = "Cut the Tasks fgraph completes at a commit that changed a file their brief does not name, with the development on, from every one to none"
description = "Filed on the word of the developer of 2026-11-23, picked from the map made that day of what the skills and rules of ~/.claude ask of board 1 that fgraph does not do and no Backlog item builds, so that those skills can call fgraph in its place. In board 1: the scope gate of board close, scope rule 1 of CLAUDE.md: a file the Action or Output does not name is out of scope. Its Tasks are written when it is ordered."
complexity = "medium"
created = 2026-11-23 20:38:39+00:00
depends_on = [
    "B-0029",
    "S-0101",
    "S-0104",
    "U-0025",
]

[criterion]
given = "a repository with the development on and a started work item whose started Task names in its output and its description the files it changes"
when = "fgraph complete of the Task is run at a commit that changed a file the Task does not name, and at one that changed files it names alone"
then = "the first is refused, exit 2, naming the file and the Task, nothing written; the second completes as today"
