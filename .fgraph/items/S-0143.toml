description = "New module src/flowgraph/work_item/progress.py (about 55 lines), shaped as src/flowgraph/knowledge/model.py. Its docstring: a progress line says where the work stands -- a hand-off, a red line, a structure note; it is no knowledge line, so fgraph knowledge never lists it, it is about no term and governs no file; it is never amended or removed. It holds: @dataclass(frozen=True) ProgressLine(text: str, noted: datetime, task: TaskId | None = None), the Task being one of the work item that keeps the line, none for a line of the work item itself; @dataclass ProgressRow(noted: datetime, text: str, task: str = \"\"), the line as a view reads it; make_progress_line(text, noted, task=None) -> ProgressLine, said(\"text\", text) and noted.replace(microsecond=0), EmptyPartError for a blank text; progress_row(line) -> ProgressRow, the Task by task_id_text and \"\" for none. It imports flowgraph.criterion and flowgraph.task alone, never flowgraph.work_item.model. src/flowgraph/work_item/model.py (221 lines, about 237 after): the field progress: tuple[ProgressLine, ...] = () as the LAST field of WorkItem, StartedWorkItem, BlockedWorkItem, CompletedWorkItem (after verified) and RemovedWorkItem, so every positional construction stays valid; right after noted_work_item, def progressed_work_item[W: WorkItemState](item: W, line: ProgressLine) -> W: when line.task is not None, task_of(item.tasks, line.task) of flowgraph.task, whose TaskNotFoundError goes up; then replace(item, progress=(*item.progress, line)). It takes every state: a line records, it moves nothing. The moves that rebuild a state field by field pass progress=item.progress as a keyword: started_work_item and completed_work_item of src/flowgraph/work_item/moves.py (154 lines, 156 after), blocked_work_item and unblocked_work_item of src/flowgraph/work_item/block.py (134, 136 after), removed_work_item of src/flowgraph/work_item/removal.py (96, 97 after). amended_work_item, handed_work_item and verified_work_item use replace and stay untouched. src/flowgraph/work_item/__init__.py (189, about 195 after): import and list ProgressLine, ProgressRow, make_progress_line, progress_row and progressed_work_item. Red first: add the field, then make_progress_line, progress_row and progressed_work_item as typed stubs raising NotImplementedError; write the tests; see each fail for its own reason; then write the bodies and the five keywords. Build every line and every item inside a test or a fixture, never at module level, so no test is red at the import. New tests/work_item/test_work_item_progress.py (about 130 lines), pytestmark = pytest.mark.model, one assert each, with CHORE, CREATED, ON, COMMIT, SCENARIO, BARE, TASK (make_task_id(3)), ITEM, HALF, STUCK and WHOLE as tests/work_item/test_work_item_file.py builds them: a line holds its text; its time is kept to the second; it names no Task by default; it holds the Task given; a blank text raises EmptyPartError matching ^text is empty$; progress_row of a line of T-0003 is ProgressRow(ON, \"a text\", \"T-0003\") and of one of the work item has task \"\"; two lines noted are kept in the order noted; a line of T-0003 is kept on ITEM; a line of T-0009 raises TaskNotFoundError matching ^no Task T-0009 in the record$; the knowledge of a work item with a line is still (); parametrized over the moves, the result keeps (LINE,): started_work_item of ITEM with the line, blocked_work_item of HALF with it, unblocked_work_item of STUCK with it, completed_work_item of the item whose Task is completed with it, removed_work_item of BARE with it, amended_work_item of BARE with it and a new title. Existing tests that change: none; those that compare a move with a state built by hand (tests/work_item/test_work_item_moves.py, test_work_item_remove.py) pass untouched, the default being (). Out of bounds: the file models and readers (Task 3), src/flowgraph/task/ (a Task holds no line of its own: the work item holds the line that names it), src/flowgraph/knowledge/, src/flowgraph/feature/, tests/functional/."
